# fly.toml app configuration file generated for exmud on 2025-12-16T19:55:32-10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'exmud'
primary_region = 'sjc'
kill_signal = 'SIGTERM'
kill_timeout = '5s'

[build]

[deploy]
  release_command = '/usr/local/bin/entrypoint.sh /app/bin/migrate'

[env]
  PHX_SERVER = 'true'
  DATABASE_PATH = '/mnt/name/name.db'
  PHX_HOST = 'exmud.fly.dev'
  PORT = '8080'

[[mounts]]
  source = 'name'
  destination = '/mnt/name'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
