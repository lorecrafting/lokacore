name: book-e2e

# Pre-production: nightly on main and by hand only (docs/decisions/owner-decision-preproduction-gate-2026-10-08.md).
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: book-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm ci --no-audit --no-fund
      - run: npx e2e-web install chromium --with-deps
      - run: npm run test:e2e
      # Every Storybook story renders, its play function and axe (test: 'error') pass (CHECKS.md).
      - run: npx playwright install chromium
      - run: npm run storybook:smoke
      - if: failure()
        name: Redact browser failure diagnostics
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          def redact(text):
              text = text.replace(os.environ['GITHUB_WORKSPACE'], '<checkout>')
              return re.sub(r'(?:/Users/|/home/|/tmp/|/private/var/|/var/folders/)[^\s"\)\]\x1b]+', '<redacted-path>', text)
          files = [Path('.e2e/report.json'), *Path('.e2e/artifacts').rglob('*')]
          for file in files:
              if file.is_file() and file.suffix in {'.json', '.txt', '.log'}:
                  file.write_text(redact(file.read_text()))
          PYTHON
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book-browser-failure
          path: |
            mobile/app/.e2e/report.json
            mobile/app/.e2e/artifacts/**/screenshots/*.png
            mobile/app/.e2e/artifacts/**/failure/screen.txt
            mobile/app/.e2e/artifacts/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore

  # The run's one verdict: fails unless the browser job succeeded.
  book-e2e-green:
    needs: [browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
