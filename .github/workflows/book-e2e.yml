name: book-e2e

# Pre-production: every push to a branch, nightly on main and by hand; a green run on the exact
# head is the merge gate (docs/decisions/owner-decision-two-lane-ci-2026-10-09.md).
on:
  push:
    branches-ignore: [main]
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: book-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filter (bin/ci_changes.sh): docs-only heads skip the test jobs; sim and walk need engine changes.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.f.outputs.code }}
      sim_walk: ${{ steps.f.outputs.sim_walk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        run: sh bin/ci_changes.sh "$EVENT" | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}

  # The local Book browser save/reload path with tester.army e2e (docs/web-preview.md).
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: ./.github/actions/chromium
      - run: npm run test:e2e
      - if: failure()
        name: Redact browser failure diagnostics
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          def redact(text):
              text = text.replace(os.environ['GITHUB_WORKSPACE'], '<checkout>')
              return re.sub(r'(?:/Users/|/home/|/tmp/|/private/var/|/var/folders/)[^\s"\)\]\x1b]+', '<redacted-path>', text)
          files = [Path('.e2e/report.json'), *Path('.e2e/artifacts').rglob('*')]
          for file in files:
              if file.is_file() and file.suffix in {'.json', '.txt', '.log'}:
                  file.write_text(redact(file.read_text()))
          PYTHON
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book-browser-failure
          path: |
            mobile/app/.e2e/report.json
            mobile/app/.e2e/artifacts/**/screenshots/*.png
            mobile/app/.e2e/artifacts/**/failure/screen.txt
            mobile/app/.e2e/artifacts/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore

  # Every Storybook story renders, its play function and axe (test: 'error') pass (CHECKS.md); then the
  # Live stories' click-throughs and the Loka picker end to end on the dev server (web-preview.md).
  storybook:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: ./.github/actions/chromium
      - run: npm run storybook:smoke
      - run: npm run storybook:live
      - run: npm run storybook:picker

  # The toolbox showcase's Book walk at 390 px (walkthrough/toolbox_showcase.walk.ts): homestead,
  # economy/law and magic routes on the author preview of cartridges/toolbox_showcase (web-preview.md).
  walk:
    needs: changes
    if: needs.changes.outputs.sim_walk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
      - run: mix deps.get --check-locked
        working-directory: .
      # bin/loka dev compiles through `mise exec -- mix`; CI pins the tools itself, so a stub
      # runs the command (as kernel/ts/test/author.test.ts stubs mise).
      - run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nshift 2\nexec "$@"\n' > "$RUNNER_TEMP/bin/mise"
          chmod +x "$RUNNER_TEMP/bin/mise"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bin/loka dev cartridges/toolbox_showcase
        working-directory: .
      - run: npm ci --no-audit --no-fund
      - uses: ./.github/actions/chromium
      - run: npm run walkthrough
        env:
          LOKA_WALK: toolbox_showcase
      # The runner's home is the only local path a hosted page or log holds; a literal match never
      # cuts into the sheet's inlined base64 screenshots the way a path pattern can.
      - if: failure()
        name: Redact walk failure diagnostics
        run: find .walkthrough -name contact-sheet.html -o -name report.json -o -name screen.txt | xargs -r sed -i "s#$HOME#<home>#g"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: showcase-walk-failure
          path: |
            mobile/app/.walkthrough/contact-sheet.html
            mobile/app/.walkthrough/report.json
            mobile/app/.walkthrough/artifacts/**/failure/screen.txt
          include-hidden-files: true
          if-no-files-found: ignore

  # The run's one verdict: fails unless every job succeeded or was filtered out.
  book-e2e-green:
    needs: [changes, e2e, storybook, walk]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # A job skips only by its path filter, so skipped passes once the filter itself succeeded.
      - if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
