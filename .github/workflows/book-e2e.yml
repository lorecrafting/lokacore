name: book-e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: book-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Draft PRs run no hosted CI; downstream jobs skip with this one (CHECKS.md).
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: |
          base=$(bin/ci_base.sh "$HEAD" browser)
          echo "skip=$([ "$(bin/ci_scope.sh "$base" "$HEAD" browser)" = skip ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  browser:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm ci --no-audit --no-fund
      - run: npx e2e-web install chromium --with-deps
      - run: npm run test:e2e
      - if: failure()
        name: Redact browser failure diagnostics
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          def redact(text):
              text = text.replace(os.environ['GITHUB_WORKSPACE'], '<checkout>')
              return re.sub(r'(?:/Users/|/home/|/tmp/|/private/var/|/var/folders/)[^\s"\)\]\x1b]+', '<redacted-path>', text)
          files = [Path('.e2e/report.json'), *Path('.e2e/artifacts').rglob('*')]
          for file in files:
              if file.is_file() and file.suffix in {'.json', '.txt', '.log'}:
                  file.write_text(redact(file.read_text()))
          PYTHON
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book-browser-failure
          path: |
            mobile/app/.e2e/report.json
            mobile/app/.e2e/artifacts/**/screenshots/*.png
            mobile/app/.e2e/artifacts/**/failure/screen.txt
            mobile/app/.e2e/artifacts/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore

  # The one check `main` requires. A skipped browser job passes; a draft (changes skipped) fails.
  book-e2e-green:
    needs: [changes, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
