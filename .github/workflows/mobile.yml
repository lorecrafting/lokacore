name: mobile

# Native release builds only when mobile code changes, or on manual trigger.
on:
  pull_request:
    paths: ['mobile/**', 'kernel/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - run: npm ci --no-audit --no-fund
      - run: CI=1 EXPO_NO_TELEMETRY=1 npx expo prebuild --platform android --no-install
      - name: Release APK (arm64, no Gradle cache)
        working-directory: mobile/app/android
        run: ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a -PreactNativeDevServerIp=localhost assembleRelease
      - name: Kernel is in the Hermes bundle (portability smoke)
        working-directory: mobile/app/android
        run: unzip -p app/build/outputs/apk/release/app-release.apk assets/index.android.bundle | grep -a -q loka-kernel

  ios:
    # Simulator build: headless, unsigned, free for public repositories. Device builds and
    # signing stay on the owner's M1.
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: xcodebuild -version && pod --version
      - run: npm ci --no-audit --no-fund
      - run: CI=1 EXPO_NO_TELEMETRY=1 npx expo prebuild --platform ios --no-install
      - run: pod install
        working-directory: mobile/app/ios
      - name: Release build for the iOS simulator (unsigned)
        working-directory: mobile/app/ios
        run: |
          xcodebuild -workspace Loka.xcworkspace -scheme Loka -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
      - name: Kernel is in the Hermes bundle (portability smoke)
        run: find "$RUNNER_TEMP/dd" -name main.jsbundle -path '*Loka.app*' -exec grep -a -q loka-kernel {} \; -print | grep -q .
