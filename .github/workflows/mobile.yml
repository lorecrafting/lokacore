name: mobile

# Native release builds only when mobile code changes, or on manual trigger.
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - run: npm ci --no-audit --no-fund
      - run: CI=1 EXPO_NO_TELEMETRY=1 npx expo prebuild --platform android --no-install
      - name: Release APK (arm64, no Gradle cache)
        working-directory: mobile/app/android
        run: |
          start=$(date +%s)
          ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a -PreactNativeDevServerIp=localhost assembleRelease
          echo "gradle_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
