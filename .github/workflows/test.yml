name: Tests

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/test.yml"

jobs:
  test:
    name: Test (Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        elixir: ['1.19.4']
        otp: ['28.3']

    env:
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{matrix.elixir}}
          otp-version: ${{matrix.otp}}

      - name: Cache deps
        uses: actions/cache@v3
        with:
          path: |
            server/deps
            server/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        working-directory: ./server
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Check formatting
        working-directory: ./server
        run: mix format --check-formatted

      - name: Compile
        working-directory: ./server
        run: mix compile --warnings-as-errors

      # Content validation starts the Loka application. Prepare the test DB first
      # so supervised services such as Loka.Timers.Server can query migrated tables.
      - name: Prepare test database
        working-directory: ./server
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Run content validation
        working-directory: ./server
        run: mix loka.test.validate --quiet

      - name: Run unit tests
        working-directory: ./server
        run: mix test --exclude full_storyline

      - name: Run full storyline bot test
        working-directory: ./server
        run: mix test --only full_storyline --max-failures 1
        timeout-minutes: 15
