name: Database Backup

on:
  schedule:
    # Run daily at 4 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  backup:
    name: Backup Database
    runs-on: ubuntu-latest

    steps:
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run backup script
        run: |
          flyctl ssh console -a exmud -C "/app/scripts/backup_db.sh"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify backup
        run: |
          echo "Listing backups..."
          flyctl ssh console -a exmud -C "ls -lh /mnt/exmud_data/backups/"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Database backup failed! Check the logs."
          # Add Slack/Discord notification here if configured
