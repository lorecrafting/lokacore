name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Draft PRs run no hosted CI; downstream jobs skip with this one (CHECKS.md).
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.docs.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      # A missing green code ancestor or API error runs everything; lint runs unless the PR is a draft.
      - id: docs
        run: |
          base=$(bin/ci_base.sh "$HEAD" code)
          echo "skip=$([ "$(bin/ci_scope.sh "$base" "$HEAD" code)" = skip ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  elixir:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
      # The composition differential in mix test runs the TypeScript kernel.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: elixir bin/contracts.exs --check
      - run: elixir bin/features.exs --check
      - run: mix xref graph --format cycles --fail-above 0
      - run: mix xref graph --label compile-connected --fail-above 0
      - run: mix test
      - run: mix credo --strict
      - run: elixir bin/check_size.exs
      - run: elixir bin/red_controls.exs

  lint:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm install --global @ast-grep/cli@0.45.3
      - run: ast-grep test --skip-snapshot-tests --filter '^(elixir-kernel-pure|ts-.*)$'
      - run: ast-grep scan --error --filter '^(elixir-kernel-pure|ts-.*)$' lib/loka/core kernel/ts/src
      - run: bin/lint_red_controls.sh --core-only
      - run: bin/docs_only_red_controls.sh
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
      - run: elixir bin/check_docs.exs
      - run: bin/docs_red_controls.sh
      - run: python3 bin/check_beads_export.py && sh bin/beads_red_controls.sh

  # The 10,000 fresh sequences (CI is set), in parallel with the typescript job, which skips sim.test.ts.
  sim:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm ci --no-audit --no-fund && npm run test:sim
        working-directory: kernel/ts
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-trace-sim
          path: tmp/obs/game_trace/
          if-no-files-found: ignore

  typescript:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      # The ferry fixture compiles the real authored chapter in this job.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
      - run: mix deps.get --check-locked
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm run test:nosim
        working-directory: kernel/ts
      - run: npm ci --no-audit --no-fund && git ls-files -z '*.ts' '*.tsx' '*.mjs' '*.js' '*.json' ':(exclude)mobile/**' | xargs -0 npx prettier --check
      - run: git ls-files -z '*.ts' '*.tsx' '*.mjs' ':(exclude)mobile/**' | xargs -0 node bin/check_ts_size.mjs
      - run: bin/ts_size_red_controls.sh --core-only
      - run: bin/kernel_red_controls.sh
      - if: failure() # a failing run's game trace (ADR-075 §2), fault corpus or simulator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-trace
          path: tmp/obs/game_trace/
          if-no-files-found: ignore
