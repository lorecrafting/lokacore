name: ci

# Pre-production: every push to a branch, nightly on main and by hand; a green run on the exact
# head is the merge gate (docs/decisions/owner-decision-two-lane-ci-2026-10-09.md).
on:
  push:
    branches-ignore: [main]
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filter (bin/ci_changes.sh): docs-only heads skip the test jobs; sim and walk need engine changes; a job skips only on an explicit false.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.f.outputs.code }}
      sim_walk: ${{ steps.f.outputs.sim_walk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        shell: bash # pipefail: a failing filter fails the job, not a silent tee
        run: sh bin/ci_changes.sh "$EVENT" | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}

  elixir:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
      # The composition differential in mix test runs the TypeScript kernel.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: elixir bin/contracts.exs --check
      - run: elixir bin/features.exs --check
      - run: python3 bin/source_reference.py --check
      - run: mix xref graph --format cycles --fail-above 0
      - run: mix xref graph --label compile-connected --fail-above 0
      - run: mix test
      - run: mix credo --strict
      - run: elixir bin/check_size.exs
      - run: elixir bin/red_controls.exs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm install --global @ast-grep/cli@0.45.3
      - run: ast-grep test --skip-snapshot-tests
      - run: ast-grep scan --error . mobile/app/.storybook # as bin/check_all.sh: whole tree, every rule
      - run: sh bin/check_as_never.sh
      - run: bin/lint_red_controls.sh --core-only
      - run: bin/integration_red_controls.sh
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
      - run: elixir bin/check_docs.exs
      - run: bin/docs_red_controls.sh
      - run: python3 bin/check_beads_export.py && sh bin/beads_red_controls.sh
      - run: sh bin/graph_diff_red_controls.sh
      - run: sh bin/prose_lint_red_controls.sh
      - run: sh bin/orphans_red_controls.sh
      - run: sh bin/ci_timing_red_controls.sh
      - run: sh bin/mutate_diff_red_controls.sh
      # bin/merge_resolve.py calls `mise exec -- elixir`; CI pins the tools itself, so a stub runs
      # the command (as in book-e2e.yml's walk job).
      - run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nshift 2\nexec "$@"\n' > "$RUNNER_TEMP/bin/mise"
          chmod +x "$RUNNER_TEMP/bin/mise"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: sh bin/merge_resolve_red_controls.sh
      # Real br (the pinned release, checksum-checked) for the Beads sync controls (bin/lib/beads_sync.sh).
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/br.tgz" https://github.com/Dicklesworthstone/beads_rust/releases/download/v0.7.6/br-0.7.6-linux_musl_amd64.tar.gz
          echo "28b89f8f26540a4c9e6242b3c9fc93bcdd89f4ec0b9c9792895028c53f5bf2bd  $RUNNER_TEMP/br.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/br.tgz" -C "$RUNNER_TEMP/bin" br
      - run: sh bin/beads_sync_red_controls.sh

  # sim.test.ts (CI is set: 10,000 fresh sequences), in parallel with the kernel job, which skips it:
  # two legs, the fresh sequences and the showcase test, each under the timeout on a slow runner.
  sim:
    needs: changes
    if: needs.changes.outputs.sim_walk != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [fresh, showcase]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: kernel/ts/package-lock.json
      # shell: bash runs with -o pipefail, so a failing test is not hidden by tee's exit.
      - run: npm ci --no-audit --no-fund && npm run "test:sim:$PART" | tee "$RUNNER_TEMP/sim.log"
        shell: bash
        working-directory: kernel/ts
        env:
          PART: ${{ matrix.part }}
      # A renamed showcase test would leave a leg green with no test run (only the file line passes).
      - run: grep '^✔ ' "$RUNNER_TEMP/sim.log" | grep -qv '^✔ test/sim.test.ts '
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-trace-sim-${{ matrix.part }}
          path: tmp/obs/game_trace/
          if-no-files-found: ignore

  # Kernel typecheck and unit tests (sim.test.ts runs in the sim jobs) and the TypeScript size gates
  # (they load typescript from kernel/ts). The chapter fixtures compile the real authored cartridge with mix.
  kernel:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: kernel/ts/package-lock.json
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
      - run: mix deps.get --check-locked
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm run test:nosim
        working-directory: kernel/ts
      # Each checkpoint replays headless; bin/loka check compiles through `mise exec -- mix`, so a
      # stub runs the command (as book-e2e.yml does).
      - run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nshift 2\nexec "$@"\n' > "$RUNNER_TEMP/bin/mise"
          chmod +x "$RUNNER_TEMP/bin/mise"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          rc=0; for d in cartridges/*/checkpoints; do bin/loka check "${d%/checkpoints}" || rc=1; done; exit $rc
      - run: bin/kernel_red_controls.sh
      - run: node bin/check_ts_size.mjs # loads typescript from kernel/ts
      - run: bin/ts_size_red_controls.sh
      - if: failure() # a failing run's game trace (ADR-075 §2) or fault corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-trace-kernel
          path: tmp/obs/game_trace/
          if-no-files-found: ignore

  # Local-story authority (saves, faults, start-over) and Book tests (67 s wall, 327 s CPU locally);
  # its fixtures also compile the chapter with mix. Prettier rides along.
  mobile:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/app/package-lock.json
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
      - run: mix deps.get --check-locked
      - run: npm ci --no-audit --no-fund && npm test
        working-directory: mobile/app
      - run: npm ci --no-audit --no-fund && git ls-files -z '*.ts' '*.tsx' '*.mjs' '*.js' '*.json' ':(exclude)mobile/**' | xargs -0 npx prettier --check
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-trace-mobile
          path: tmp/obs/game_trace/
          if-no-files-found: ignore

  # The run's one verdict: fails unless every job succeeded or was filtered out.
  ci-green:
    needs: [changes, elixir, lint, sim, kernel, mobile]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # A job skips only by its path filter, so skipped passes once the filter itself succeeded.
      - if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
