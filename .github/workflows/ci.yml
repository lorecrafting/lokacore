name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  elixir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix xref graph --format cycles --fail-above 0
      - run: mix xref graph --label compile-connected --fail-above 0
      - run: mix test
      - run: mix credo --strict
      - run: elixir bin/check_size.exs
      - run: elixir bin/red_controls.exs
      - run: elixir bin/check_docs.exs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm install --global @ast-grep/cli@0.45.3
      - run: ast-grep test --skip-snapshot-tests
      - run: ast-grep scan --error
      - run: bin/lint_red_controls.sh

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm test
        working-directory: kernel/ts
      - run: node bin/check_ts_size.mjs
        working-directory: .
      - name: Red control, TS size limits (one line over fails, exactly at the limit passes)
        working-directory: .
        run: |
          trap 'rm -rf kernel/ts/src/red_size_*.ts kernel/ts/test/red_size.test.ts mobile/features/story/red_size_fn.tsx mobile/features/story/__tests__' EXIT
          x() { for i in $(seq "$1"); do echo '//'; done; }
          x 301 > kernel/ts/src/red_size_big.ts
          { echo 'export function ok() {'; x 38; echo '}'; x 260; } > kernel/ts/src/red_size_ok.ts
          { echo 'export const f = () => {'; x 39; echo '};'; } > mobile/features/story/red_size_fn.tsx
          x 501 > kernel/ts/test/red_size.test.ts
          mkdir mobile/features/story/__tests__ && x 500 > mobile/features/story/__tests__/red_size_ok.test.ts
          expected='kernel/ts/src/red_size_big.ts:1: file, 301 lines, limit 300
          kernel/ts/test/red_size.test.ts:1: file, 501 lines, limit 500
          mobile/features/story/red_size_fn.tsx:1: function f, 41 lines, limit 40'
          out=$(node bin/check_ts_size.mjs) && { echo "size check passed planted violations"; exit 1; }
          [ "$out" = "$expected" ] || { printf 'expected\n%s\ngot\n%s\n' "$expected" "$out"; exit 1; }
      - name: Red control, host and Node APIs are type errors in the kernel
        working-directory: kernel/ts
        run: |
          for probe in "fetch('x')" "setTimeout(() => 0, 1)" "process.env" "require('os')" "Buffer.from('x')" "performance.now()"; do
            echo "export const p = $probe;" > src/red_control.ts
            if npx tsc; then echo "tsc accepted $probe in the kernel"; exit 1; fi
          done
          echo "import 'node:fs';" > src/red_control.ts
          if npx tsc; then echo "tsc accepted a node: import in the kernel"; exit 1; fi
          rm src/red_control.ts
