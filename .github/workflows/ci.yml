name: ci

# Pre-production: nightly on main and by hand only (docs/decisions/owner-decision-preproduction-gate-2026-10-08.md).
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  elixir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
      # The composition differential in mix test runs the TypeScript kernel.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: elixir bin/contracts.exs --check
      - run: elixir bin/features.exs --check
      - run: mix xref graph --format cycles --fail-above 0
      - run: mix xref graph --label compile-connected --fail-above 0
      - run: mix test
      - run: mix credo --strict
      - run: elixir bin/check_size.exs
      - run: elixir bin/red_controls.exs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm install --global @ast-grep/cli@0.45.3
      - run: ast-grep test --skip-snapshot-tests
      - run: ast-grep scan --error . mobile/app/.storybook # as bin/check_all.sh: whole tree, every rule
      - run: bin/lint_red_controls.sh --core-only
      - run: bin/docs_only_red_controls.sh
      - run: bin/integration_red_controls.sh
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
      - run: elixir bin/check_docs.exs
      - run: bin/docs_red_controls.sh
      - run: python3 bin/check_beads_export.py && sh bin/beads_red_controls.sh

  # The 10,000 fresh sequences (CI is set), in parallel with the typescript job, which skips sim.test.ts.
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm ci --no-audit --no-fund && npm run test:sim
        working-directory: kernel/ts
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-trace-sim
          path: tmp/obs/game_trace/
          if-no-files-found: ignore

  # E1 coverage recorder on the selected v042 artifact (docs/system/e1-certification.md):
  # exit 2 (pending obligation or gap) or 1 (failed case) fails. The recorder needs a clean
  # tree, so its artifact and output stay outside the checkout.
  e1-recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: |
          a=$RUNNER_TEMP/e1-selected-v042.json
          python3 -c "import json,sys;f=json.load(open('protocol/fixtures/missing_child_v042_hash.json'));sys.stdout.write('{\"cartridge\":'+f['canonical']+',\"content_hash\":\"'+f['sha256']+'\"}')" > "$a"
          echo "1c53bcd86149ee6087a08f15a5cc625873cc840e4a1769b36df89d03ff581115  $a" | sha256sum -c -
          node kernel/ts/test/e1_cases.ts "$a" "$RUNNER_TEMP/e1-recorder"

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 3 min before the mobile suite (67 s wall, 327 s CPU locally)
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      # The ferry fixture compiles the real authored chapter in this job.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
      - run: mix deps.get --check-locked
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm run test:nosim
        working-directory: kernel/ts
      # Local-story authority (saves, faults, start-over) and Book tests.
      - run: npm ci --no-audit --no-fund && npm test
        working-directory: mobile/app
      - run: npm ci --no-audit --no-fund && git ls-files -z '*.ts' '*.tsx' '*.mjs' '*.js' '*.json' ':(exclude)mobile/**' | xargs -0 npx prettier --check
      - run: node bin/check_ts_size.mjs
      - run: bin/ts_size_red_controls.sh
      - run: bin/kernel_red_controls.sh
      - if: failure() # a failing run's game trace (ADR-075 §2), fault corpus or simulator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-trace
          path: tmp/obs/game_trace/
          if-no-files-found: ignore

  # The run's one verdict: fails unless every job succeeded.
  ci-green:
    needs: [e1-recorder, elixir, lint, sim, typescript]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
