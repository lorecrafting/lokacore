name: mobile-bundle

# Compiles the Hermes bundle for both platforms, without Gradle or Xcode, on pull requests
# that touch the kernel or mobile code; native builds are in mobile.yml.
on:
  pull_request:
    paths: ['mobile/**', 'kernel/**', '.github/workflows/mobile-bundle.yml']

concurrency:
  group: mobile-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm ci --no-audit --no-fund
      - run: CI=1 EXPO_NO_TELEMETRY=1 npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/dist"
      - name: Kernel is in both Hermes bundles (portability smoke)
        run: for p in android ios; do grep -a -q loka-kernel "$RUNNER_TEMP"/dist/_expo/static/js/$p/*.hbc; done
