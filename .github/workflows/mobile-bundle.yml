name: mobile-bundle

# Compiles the Hermes bundle for both platforms, without Gradle or Xcode, on pull requests
# that touch the kernel or mobile code; native builds are in mobile.yml.
on:
  pull_request:
    paths: ['mobile/**', 'kernel/**', '.github/workflows/mobile-bundle.yml']

concurrency:
  group: mobile-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: The tree is clean, so the bundle's kernel stamp is the bare commit (ADR-075 §3)
        run: test -z "$(git status --porcelain)"
      - run: CI=1 EXPO_NO_TELEMETRY=1 npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/dist"
      - name: Kernel is in both Hermes bundles (portability smoke)
        run: for p in android ios; do grep -a -q loka-kernel "$RUNNER_TEMP"/dist/_expo/static/js/$p/*.hbc; done
      # The app joins KERNEL_ID and the stamp at run time, so the bundle holds the commit alone.
      - name: Both bundles carry the commit metro.config.js stamped, not -dirty
        run: |
          head=$(git rev-parse HEAD)
          for p in android ios; do
            grep -a -q "$head" "$RUNNER_TEMP"/dist/_expo/static/js/$p/*.hbc
            ! grep -a -q "$head-dirty" "$RUNNER_TEMP"/dist/_expo/static/js/$p/*.hbc || exit 1
          done
