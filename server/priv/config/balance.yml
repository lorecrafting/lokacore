# Balance Configuration
# All game formulas and multipliers in one place for easy tuning
#
# Variables available in formulas:
#   level, str, dex, sta, int, wis, cha
#   weapon_bonus, armor_bonus, skill_level

combat:
  # Damage calculation
  damage:
    # Base damage formula: (str + weapon_bonus) * level_multiplier
    base_formula: "str + weapon_bonus"
    level_multiplier: 1.0

    # Damage variance range (applied as multiplier)
    variance_min: 0.8
    variance_max: 1.2

    # Minimum damage (always deal at least this much)
    minimum: 1

    # Critical hits
    critical:
      base_chance: 5          # Base 5% crit chance
      dex_bonus: 0.5          # +0.5% per DEX point
      multiplier: 2.0         # Crits deal 2x damage

    # Defense calculation
    defense:
      formula: "sta / 2 + armor_bonus"
      cap_percent: 75         # Defense can't reduce damage below 25%

    # Defending stance bonus
    defend_multiplier: 1.5    # +50% defense when defending

  # Healing calculation
  healing:
    # Base healing formula
    base_formula: "int + level * 2"

    # Variance range
    variance_min: 0.9
    variance_max: 1.1

    # Overheal (can exceed max HP temporarily)
    allow_overheal: false
    overheal_cap: 1.2         # If enabled, max 120% of max HP

  # Success checks
  checks:
    # Skill check formula: skill_level * 5 + stat
    base_formula: "skill_level * 5 + stat"

    # Difficulty modifiers
    difficulty:
      trivial: -20
      easy: -10
      normal: 0
      hard: 10
      very_hard: 20
      legendary: 30

progression:
  # XP required per level: 100 * level^xp_exponent
  # With 1.8 exponent, progression is gentler than quadratic (2.0)
  xp_base: 100
  xp_exponent: 1.8

  # Skill/Stat points per level
  skill_points_per_level: 3

  # HP gained per level up
  hp_per_level: 10

  # Base stats at level 1
  base_stats:
    str: 10
    dex: 10
    sta: 10
    int: 10
    wis: 10
    cha: 10

  # Max level
  max_level: 50

resources:
  # Health pool
  health:
    max_formula: "50 + sta * 5 + level * 10"
    regen_rate: 1
    regen_condition: "out_of_combat"

  # Mana pool
  mana:
    max_formula: "20 + int * 3 + level * 5"
    regen_rate: 2
    regen_condition: "always"

  # Stamina pool
  stamina:
    max_formula: "30 + sta * 2 + level * 3"
    regen_rate: 5
    regen_condition: "always"

abilities:
  # Global cooldown between any actions
  global_cooldown_ms: 1000

  # Specific ability costs and cooldowns
  power_strike:
    stamina_cost: 20
    cooldown_ms: 5000
    damage_multiplier: 1.5

  flee:
    stamina_cost: 10
    cooldown_ms: 3000
    base_success_rate: 60
    level_penalty: 3          # -3% per enemy level

economy:
  # Gold drops
  gold_drop:
    base_formula: "level * 2"
    variance_min: 0.5
    variance_max: 1.5

  # Shop prices
  shop:
    buy_multiplier: 1.0       # Players pay 100% of base price
    sell_multiplier: 0.5      # Players get 50% when selling

  # Repair costs
  repair:
    cost_formula: "item_value * 0.1"

gathering:
  # Base success rate
  base_success: 70

  # Skill bonus per level
  skill_bonus_per_level: 2

  # Quality chances (if successful)
  quality_weights:
    common: 70
    uncommon: 20
    rare: 8
    epic: 2

crafting:
  # Base success rate
  base_success: 80

  # Skill bonus per level
  skill_bonus_per_level: 3

  # Quality chances (if successful)
  quality_weights:
    normal: 60
    fine: 25
    superior: 12
    masterwork: 3

# =============================================================================
# NEW CORE MECHANICS (6-stat system)
# =============================================================================

stats:
  # Character creation
  creation:
    pool: 60              # Total points to distribute at creation
    min_per_stat: 5       # Minimum value per stat at creation
    max_per_stat: 30      # Maximum value per stat at creation

  # Progression
  points_per_level: 5     # Stat points gained per level
  max_stat: 100           # Maximum value any stat can reach
  max_level: 50           # Maximum character level

# Character resources (HP, Mana, MV)
character_resources:
  hp:
    base: 50
    con_multiplier: 4     # HP = base + (CON * con_mult) + (level * level_mult)
    level_multiplier: 2
    regen_rate: 0         # HP doesn't regen automatically

  mana:
    base: 20
    int_multiplier: 3     # Mana = base + (INT * int_mult) + (SPI * spi_mult)
    spi_multiplier: 2
    regen_base: 5         # Regen = base + (INT / divisor)
    regen_int_divisor: 5

  mv:
    base: 100
    con_multiplier: 2     # MV = base + (CON * con_mult) + (DEX * dex_mult)
    dex_multiplier: 2
    regen_base: 10        # Regen = base + (DEX / divisor)
    regen_dex_divisor: 5

  tick_interval_ms: 5000  # Regen tick every 5 seconds
  combat_regen_multiplier: 0.5  # 50% regen rate in combat

# Combat stats (derived from base stats)
combat_stats:
  # Damage bonuses (stat / divisor)
  damage_bonus_divisor: 3     # STR/3 for slashing, DEX/3 for piercing, etc.

  # Accuracy
  hit_bonus:
    dex_divisor: 4            # DEX/4
    per_divisor: 6            # + PER/6

  # Critical hits
  crit:
    per_divisor: 5            # PER/5 = crit %
    cap: 20                   # Max 20% crit chance

  # Dodge
  dodge:
    dex_divisor: 5            # DEX/5 = dodge %
    cap: 20                   # Max 20% dodge chance

  # Resistances
  magic_resist:
    spi_divisor: 4            # SPI/4 = magic resist %
    cap: 25                   # Max 25%

  poison_resist:
    con_divisor: 4            # CON/4 = poison resist %
    cap: 25                   # Max 25%

  # Spell power
  spell_power_stat_divisor: 100   # 1 + (INT/100) = spell multiplier
  heal_power_stat_divisor: 100    # 1 + (SPI/100) = heal multiplier
  mana_cost_stat_divisor: 200     # 1 - (INT/200) = mana cost multiplier

# Damage types and variance
damage_types:
  physical:
    variance_min: 0.8
    variance_max: 1.2
    minimum: 1
    crit_multiplier: 2.0

  magical:
    variance_min: 0.9
    variance_max: 1.1
    minimum: 1

  healing:
    variance_min: 0.95
    variance_max: 1.05
    minimum: 1

  # DoT damage formulas
  dot:
    burning:
      base: 5
      stat_divisor: 10        # 5 + INT/10
      stat: int
    poisoned:
      base: 3
      stat_divisor: 10        # 3 + INT/10
      stat: int
    bleeding:
      base: 3
      stat_divisor: 10        # 3 + STR/10
      stat: str

# Binary skill system
skills:
  points_per_level: 1         # Skill points gained per level
  max_total_points: 50        # Total skill points at max level

# Magic system (Sanskrit mantras)
magic:
  # Stratum INT requirements
  stratum:
    first: 30                 # First Stratum requires INT 30
    second: 50                # Second Stratum requires INT 50
    third: 70                 # Third Stratum requires INT 70

  # Guna (modifier) multipliers
  guna_multipliers:
    maha: 1.5                 # Great - 1.5x power/cost
    laghu: 0.5                # Small - 0.5x power/cost
    dvaya: 2.0                # Twin - cast twice
    sthira: 1.0               # Lasting - 2x duration (no power change)
    shighra: 1.0              # Swift - -1 lag (no power change)
    bheda: 1.0                # Piercing - ignore 50% resist (no power change)

  # Guna cost multipliers
  guna_cost_multipliers:
    maha: 1.5
    laghu: 0.5
    dvaya: 2.0
    sthira: 1.3
    shighra: 1.3
    bheda: 1.4

  # Quick slot count
  quick_slots: 5

# Combat rounds
combat_round:
  duration_ms: 3000           # 3 second rounds
  flee_cost: 30               # MV cost to flee
  flee_base_chance: 60        # Base 60% flee success
  flee_fail_lag: 2            # 2 rounds lag on failed flee

# Movement (MV) costs
movement:
  terrain_costs:
    road: 5
    path: 8
    normal: 10
    forest: 12
    rough: 15
    desert: 15
    swamp: 18
    snow: 18
    water: 20
    swimming: 20
    difficult: 20
    mountain: 25
    climbing: 25

  default_cost: 10
  flee_cost: 30
  sprint_multiplier: 2        # Sprint costs 2x terrain
