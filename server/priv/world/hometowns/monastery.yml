key: monastery
name: "Mountain Monastery"
description: |
  You are a traveler seeking wisdom at the remote monastery of
  Serene Valley. Something drew you here - a dream, perhaps, or
  a name whispered on the wind. Now you find the monastery in
  crisis, and your path intertwined with its fate.
starting_room: monastery_gate
starting_quest: main_sleeping_master
axioms:
  magic: 60
  combat: 40
  nature: 50
  wisdom: 70
starting_skills:
  - meditation
starting_items:
  - travelers_robes
  - travelers_staff
  - butter_tea
starting_stats:
  health: 50
  insight: 0
  karma: 0
character_creation:
  backgrounds:
    - id: pilgrim
      name: "Pilgrim"
      description: "You came seeking spiritual teaching."
      bonus:
        insight: 1
        karma: 10
    - id: wanderer
      name: "Wanderer"
      description: "The road brought you here by chance."
      bonus:
        dex: 1
    - id: seeker
      name: "Seeker"
      description: "You heard rumors of the master's wisdom."
      bonus:
        wisdom: 1
intro_text: |
  The mountain road was long, but at last you stand before the
  gates of Serene Valley Monastery. Prayer flags snap in the
  cold wind. Something is wrong here - you feel it in your bones.

  Your journey has only begun.
