key: karma
name: "Karma Balance"
description: "The balance of your actions - Wisdom or Power."
default_reputation: 0
min_reputation: -100
max_reputation: 100
levels:
  - id: shadow_walker
    min: -100
    max: -50
    title: "Shadow Walker"
    effects:
      - type: damage_bonus
        amount: 20
      - type: insight_penalty
        amount: -2
    description: "You walk the path of power. The darkness serves you."

  - id: conflicted
    min: -49
    max: 49
    title: "Seeker"
    effects: []
    description: "Your path is yet unclear. Both wisdom and power call to you."

  - id: awakening
    min: 50
    max: 99
    title: "Awakening One"
    effects:
      - type: insight_bonus
        amount: 2
      - type: mantra_power_bonus
        amount: 10
    description: "Wisdom begins to illuminate your actions."

  - id: bodhisattva
    min: 100
    max: null
    title: "Bodhisattva"
    effects:
      - type: insight_bonus
        amount: 5
      - type: mantra_power_bonus
        amount: 25
      - type: unlock_liberation_ending
        value: true
    description: "You have chosen the path of compassion for all beings."

karma_sources:
  - action: compassionate_choice
    amount: 10
  - action: violent_solution
    amount: -10
  - action: side_quest_wisdom
    amount: 5
  - action: destroy_mara
    amount: -25
  - action: liberate_mara
    amount: 50
