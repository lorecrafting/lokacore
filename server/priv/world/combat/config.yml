# Enhanced Combat System Configuration
# Controls action points, initiative, and other combat features

combat:
  # Initiative: Turn order based on DEX stat
  initiative: true

  # Action Points: How many actions per turn
  action_points: 3

  # Cost of each action type in AP
  action_costs:
    attack: 1
    ability: 2
    item: 1
    defend: 1
    flee: 2

  # Combo System: Chain abilities for bonus effects
  combo_system: true

  # Elemental System: Fire/water/etc damage types
  elemental_system: true
