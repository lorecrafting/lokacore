key: monastery_arc
name: "The Sleeping Master"
description: |
  Lama Tenzin, the monastery's meditation master, has been trapped in
  a spiritual battle with his own inner demons for seven days. Journey
  through the ancient caves beneath the monastery, face the Three Poisons
  made manifest, and choose between destruction and liberation.
starting_room: monastery_gate
tags:
  - main
  - buddhist
  - monastery

acts:
  - id: prologue
    name: "Arrival"
    description: |
      You have arrived at Serene Valley Monastery. Learn about the crisis
      that has befallen this sacred place and seek an audience with the Abbot.
    quests:
      - intro_welcome
      - intro_find_temple

  - id: act_1
    name: "Discovery"
    description: |
      Learn about Master Tenzin's condition and gather clues about what
      happened. Speak with the monks and find the meditation journal.
    quests:
      - main_sleeping_master
    requires:
      - prologue

  - id: act_2
    name: "The Three Trials"
    description: |
      Enter the meditation caves and face the Three Poisons: Attachment,
      Aversion, and Ignorance. Each demon must be defeated using wisdom,
      not brute force.
    quests:
      - main_three_trials
    requires:
      - act_1

  - id: act_3
    name: "Liberation"
    description: |
      With all three seal fragments collected, enter the Heart Cave
      and confront Mara the Deceiver. Choose your path: destruction
      or liberation through compassion.
    quests:
      - main_liberation
    requires:
      - act_2

side_quests:
  - side_restless_spirits
  - side_mountain_peak
  - side_hermits_song
  - side_butchers_burden
  - side_tea_for_travelers
  - side_the_forge_blessing
  - side_the_musicians_tale
  - side_cooks_apprentice
  - side_alchemist_lesson
  - portal_attunement
