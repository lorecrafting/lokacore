id: side_the_musicians_tale
name: "The Musician's Tale"
description: |
  The wandering musician knows an ancient song of protection,
  but will only teach it to someone who proves they understand
  the true power of stories - by collecting three tales from
  the people of this mountain.
giver: wandering_musician
type: side
paramita: wisdom
level_requirement: 2
requires_quest: intro_find_temple

objectives:
  - id: accept_challenge
    type: talk
    target_id: wandering_musician
    description: "Speak with the Wandering Musician about his songs"
    dialogue_topic: teach_request
  - id: hear_pilgrim_story
    type: talk
    target_id: elderly_pilgrim
    description: "Hear the Pilgrim's story"
    dialogue_topic: pilgrimage
  - id: hear_farmer_wisdom
    type: talk
    target_id: farmer_tsering
    description: "Learn Farmer Tsering's wisdom"
    dialogue_topic: wisdom
  - id: hear_tashi_memory
    type: talk
    target_id: blacksmith_tashi
    description: "Hear Blacksmith Tashi's memory of the caves"
    dialogue_topic: cave_memory
  - id: return_to_musician
    type: talk
    target_id: wandering_musician
    description: "Return to the musician with the stories"
    dialogue_topic: teach_song

rewards:
  xp: 100
  insight: 1
  teaches:
    - song_of_warding

journal_entries:
  accepted: "The musician wants me to collect stories from the mountain folk before he'll teach me his song. I should speak with the pilgrim, the farmer, and the blacksmith."
  pilgrim_done: "The pilgrim's story spoke of patience and acceptance. A lifetime of walking, and she finds peace here."
  farmer_done: "Simple wisdom from the farmer - you reap what you sow. The mountain teaches those who listen."
  smith_done: "Tashi's memory of the caves was chilling. He saw something looking back at him."
  completed: "The musician was pleased with the stories I gathered. He taught me a song that seems to push back the darkness."
