id: portal_attunement
name: "The Portal's Song"
description: |
  The Veilkeeper—an ancient guardian of the portal network—has tasked you
  with gathering three resonance crystal shards from the Crystal Sanctum.
  These crystals carry fragments of the portal's song, and when combined
  in the Rite of Attunement, they will teach the portal to recognize your
  unique resonance.
giver: veilkeeper
type: main
level_requirement: 1
objectives:
  - id: collect_crystals
    type: get_item
    target_id: resonance_crystal
    count: 3
    description: "Gather three resonance crystal shards from the Crystal Sanctum"
rewards:
  xp: 500
  items:
    - portal_attunement_token
journal_entries:
  start: "The Veilkeeper has asked me to gather three resonance crystal shards from the Crystal Sanctum. They carry fragments of the portal's song."
  complete: "The Rite of Attunement is complete. The portal knows my song, and I know its. The network of the Resonance is open to me."
