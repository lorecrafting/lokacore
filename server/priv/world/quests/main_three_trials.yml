id: main_three_trials
name: "The Three Trials"
description: |
  Enter the ancient meditation caves and face the Three Poisons
  made manifest. Only by overcoming attachment, aversion, and
  ignorance can you reach Lama Tenzin and discover the truth.
giver: abbot_jampa
type: main
act: 2
level_requirement: 2
requires_quest: main_sleeping_master
objectives:
  - id: enter_caves
    type: go_to
    target_id: threshold
    description: "Enter the Meditation Caves"
  - id: defeat_raga
    type: kill
    target_id: raga_mara
    description: "Overcome the Trial of Attachment"
    hint: "Non-attachment weakens Raga Mara"
  - id: defeat_dvesha
    type: kill
    target_id: dvesha_mara
    description: "Overcome the Trial of Aversion"
    hint: "Patience weakens Dvesha Mara"
  - id: defeat_moha
    type: kill
    target_id: moha_mara
    description: "Overcome the Trial of Ignorance"
    hint: "The Om Tare Tuttare mantra reveals the true form"
rewards:
  xp: 250
  unlocks:
    - main_liberation
journal_entries:
  start: "The caves open before me. Three trials await."
  raga_defeated: "Attachment overcome. One seal fragment acquired."
  dvesha_defeated: "Aversion overcome. Two seal fragments acquired."
  moha_defeated: "Ignorance overcome. All three fragments collected."
  complete: "The Heart Cave awaits. Mara and Tenzin are within."
