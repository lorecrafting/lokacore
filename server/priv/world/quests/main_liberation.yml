id: main_liberation
name: "Liberation"
description: |
  The three seals are yours. Enter the Heart Cave, confront Mara
  the Deceiver, and free Lama Tenzin from his meditation prison.
  The choice you make will determine the fate of all.
giver: abbot_jampa
type: main
act: 3
level_requirement: 4
requires_quest: main_three_trials
objectives:
  - id: reach_heart
    type: go_to
    target_id: heart_cave
    description: "Enter the Heart Cave"
    # Note: requires_items removed until loot drop system is implemented
    # requires_items:
    #   - seal_fragment_attachment
    #   - seal_fragment_aversion
    #   - seal_fragment_ignorance
  - id: defeat_mara
    type: kill
    target_id: mara_the_deceiver
    description: "Defeat Mara the Deceiver"
  - id: free_tenzin
    type: talk
    target_id: lama_tenzin_liberated
    description: "Free Lama Tenzin from his meditation prison"
    dialogue_topic: start
rewards:
  xp: 500
  items:
    - enlightenment_seal
    - bodhisattva_vestments
journal_entries:
  start: "The Heart Cave opens. The final confrontation awaits."
  mara_revealed: "Mara speaks with my own voice. It is the ego made manifest."
  destroy_ending: "Mara is scattered. But the darkness will return. It always does."
  liberate_ending: "Compassion transforms what force cannot destroy. This is the bodhisattva way."
