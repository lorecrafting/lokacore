# Kill Quest Template
# Use this template for quests that require defeating enemies.
#
# Required variables:
#   target      - Enemy prototype key (e.g., "bandit", "wolf")
#   target_name - Display name for the enemy (e.g., "bandits", "wolves")
#   count       - Number to defeat
#   xp_reward   - XP reward amount
#
# Optional overrides:
#   giver       - Quest giver NPC key
#   name        - Quest title
#   description - Quest description

id: kill_template
is_template: true
type: side
name: "Defeat the ${target_name}"
description: |
  A threat lurks nearby. Eliminate ${count} ${target_name}
  to restore peace to the area.
objectives:
  - id: kill_target
    type: kill
    target_id: ${target}
    target_count: ${count}
    description: "Defeat ${count} ${target_name}"
rewards:
  xp: ${xp_reward}
journal_entries:
  start: "I must defeat ${count} ${target_name}."
  complete: "The ${target_name} have been dealt with."
