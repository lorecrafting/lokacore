# Fetch Quest Template
# Use this template for quests that require collecting items and returning.
#
# Required variables:
#   item         - Item prototype key to collect
#   item_name    - Display name for the item
#   giver        - Quest giver NPC key (also used for return objective)
#   giver_name   - Display name for the quest giver
#   xp_reward    - XP reward amount
#
# Optional variables:
#   count        - Number of items (default: 1)
#
# Optional overrides:
#   name         - Quest title
#   description  - Quest description

id: fetch_template
is_template: true
type: side
name: "Collect ${item_name}"
description: |
  ${giver_name} needs ${item_name}. Find it and bring it back.
variables:
  count: 1
objectives:
  - id: get_item
    type: get_item
    target_id: ${item}
    target_count: ${count}
    description: "Find ${item_name}"
  - id: return_to_giver
    type: talk
    target_id: ${giver}
    dialogue_topic: quest_complete
    description: "Return to ${giver_name}"
rewards:
  xp: ${xp_reward}
journal_entries:
  start: "${giver_name} asked me to find ${item_name}."
  got_item: "I found the ${item_name}. Time to return."
  complete: "I delivered the ${item_name} to ${giver_name}."
