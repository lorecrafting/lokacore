# Escort Quest Template
# Use this template for quests that require escorting an NPC to a location.
#
# Required variables:
#   escort_npc    - NPC prototype key to escort
#   escort_name   - Display name for the NPC being escorted
#   destination   - Room prototype key for destination
#   dest_name     - Display name for the destination
#   giver         - Quest giver NPC key
#   xp_reward     - XP reward amount
#
# Optional overrides:
#   name          - Quest title
#   description   - Quest description

id: escort_template
is_template: true
type: side
name: "Escort ${escort_name}"
description: |
  ${escort_name} needs safe passage to ${dest_name}.
  Protect them on the journey.
objectives:
  - id: meet_escort
    type: talk
    target_id: ${escort_npc}
    description: "Meet ${escort_name}"
  - id: reach_destination
    type: go_to
    target_id: ${destination}
    description: "Escort ${escort_name} to ${dest_name}"
  - id: confirm_arrival
    type: talk
    target_id: ${escort_npc}
    dialogue_topic: arrived_safely
    description: "Confirm ${escort_name}'s safe arrival"
rewards:
  xp: ${xp_reward}
journal_entries:
  start: "I must escort ${escort_name} to ${dest_name}."
  en_route: "We're on our way to ${dest_name}."
  complete: "${escort_name} arrived safely at ${dest_name}."
