id: side_the_forge_blessing
name: "The Forge Blessing"
description: |
  Blacksmith Tashi can enhance your weapon with sacred mantras,
  but he needs ghost essence from the caves and a blessing from
  the temple to complete the ritual.
giver: blacksmith_tashi
type: side
paramita: effort
level_requirement: 3
requires_quest: main_sleeping_master

objectives:
  - id: talk_tashi
    type: talk
    target_id: blacksmith_tashi
    description: "Speak with Blacksmith Tashi about special work"
    dialogue_topic: special_work
  - id: get_ghost_essence
    type: get_item
    target_id: ghost_essence
    target_count: 2
    description: "Collect 2 Ghost Essence from the caves"
    location_hint: cemetery
  - id: get_blessing
    type: talk
    target_id: abbot_jampa
    description: "Request a forge blessing from Abbot Jampa"
    dialogue_topic: forge_blessing
  - id: return_to_forge
    type: talk
    target_id: blacksmith_tashi
    description: "Return to Tashi with the materials and blessing"
    dialogue_topic: ready_to_forge

rewards:
  xp: 125
  items:
    - blessed_blade
  unlocks_crafting:
    - forge_blessed_blade

journal_entries:
  accepted: "Tashi can enchant a weapon if I bring him ghost essence and a temple blessing. The ghost essence can be found in the caves or cemetery."
  essence_found: "I have the ghost essence. Now I need to ask Abbot Jampa for a forge blessing."
  blessing_received: "The Abbot gave me a scroll of blessing for Tashi's forge. Time to return."
  completed: "Tashi worked the metal with mantra and flame. The blade now hums with sacred power."
