# Side Quest: Cook's Apprentice
# Ties cooking skill to the storyline through Cook Tenzin

id: side_cooks_apprentice
name: "The Cook's Apprentice"
description: |
  Cook Tenzin needs help preparing a special meal for the monastery.
  Learn the basics of cooking and help nourish those who protect the dharma.
giver: cook_tenzin
type: side
paramita: generosity
level_requirement: 1

objectives:
  - id: talk_cook
    type: talk
    target_id: cook_tenzin
    description: "Speak with Cook Tenzin about helping in the kitchen"
    dialogue_topic: help_cooking
  - id: gather_berries
    type: get_item
    target_id: wild_berries
    target_count: 5
    description: "Gather 5 wild berries from the cliff path"
    location_hint: cliff_path
  - id: gather_ginger
    type: get_item
    target_id: sheng_jiang
    target_count: 2
    description: "Gather 2 ginger roots from the herb garden"
    location_hint: herb_garden
  - id: return_ingredients
    type: talk
    target_id: cook_tenzin
    description: "Return with the ingredients"
    dialogue_topic: ingredients_gathered

rewards:
  xp: 75
  gold: 25
  items:
    - butter_tea
    - butter_tea
    - sweet_rice
  teaches:
    - cooking

journal_entries:
  start: "Cook Tenzin asked me to gather ingredients for a special meal - wild berries and ginger root."
  gathering: "I need to find wild berries on the cliff path and ginger in the herb garden."
  complete: "I've learned the basics of cooking from Tenzin. The monastery's meals never tasted so good."
