id: main_sleeping_master
name: "The Sleeping Master"
description: |
  Lama Tenzin, the monastery's beloved meditation master, has not
  moved in seven days. The monks are frightened. Find out what
  has happened and what can be done.
giver: abbot_jampa
type: main
act: 1
level_requirement: 1
objectives:
  - id: talk_abbot
    type: talk
    target_id: abbot_jampa
    description: "Speak with Abbot Jampa in the Temple"
    dialogue_topic: crisis
  - id: visit_cell
    type: go_to
    target_id: tenzins_cell
    description: "Visit Lama Tenzin's meditation cell"
  - id: find_journal
    type: get_item
    target_id: meditation_journal
    description: "Find Tenzin's meditation journal"
  - id: talk_pema
    type: talk
    target_id: novice_pema
    description: "Show the journal to Novice Pema"
    dialogue_topic: tenzin
  - id: return_abbot
    type: talk
    target_id: abbot_jampa
    description: "Return to Abbot Jampa with what you've learned"
    dialogue_topic: help
rewards:
  xp: 100
  items:
    - cave_entrance_key
  unlocks:
    - main_three_trials
  companion_available: novice_pema
journal_entries:
  start: "The Abbot has asked me to investigate Lama Tenzin's condition."
  journal_found: "Tenzin's journal speaks of confronting the Three Poisons. He knew the danger."
  complete: "Novice Pema wishes to join me. The caves await."
