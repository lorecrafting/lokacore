# Magic Basics - Skills that enhance or enable spellcasting
# Note: Actual spells use the Sanskrit mantra system (word combinations)
# These skills provide passive bonuses and special casting abilities

skills:
  # =============================================================================
  # Spellcasting Fundamentals
  # =============================================================================

  meditate:
    key: meditate
    name: Meditate
    category: magic_utility
    cost: 1
    stat: spi
    prerequisites: []
    trainers:
      - monastery_elder
      - magic_trainer
    lag: 0
    cooldown: 0
    mv_cost: 0
    mana_cost: 0
    description: >
      Enter a meditative state to recover mana faster. Cannot be used in combat.
    effect:
      type: channel
      duration: 30  # seconds
      combat_restriction: out_of_combat
      while_channeling:
        mana_regen_multiplier: 3.0
        cannot_move: true
        interrupted_by: damage
      message_start: "You close your eyes and begin to meditate."
      message_end: "You emerge from your meditation, refreshed."
      message_interrupt: "Your meditation is broken!"

  focus:
    key: focus
    name: Focus
    category: magic_offense
    cost: 2
    stat: int
    prerequisites:
      - meditate
    trainers:
      - monastery_elder
      - magic_trainer
    lag: 1
    cooldown: 10
    mv_cost: 0
    mana_cost: 10
    description: >
      Focus your mind, increasing spell power for the next mantra.
    effect:
      type: buff
      applies:
        effect: focused
        duration: 1  # Next spell only
        modifier:
          spell_power_bonus: 25  # +25% spell damage/healing
        consumed_on: spell_cast
      message_self: "You focus your mind, gathering magical energy."
      message_room: "$actor's eyes glow briefly with concentration."

  # =============================================================================
  # Defensive Magic
  # =============================================================================

  ward:
    key: ward
    name: Ward
    category: magic_defense
    cost: 2
    stat: spi
    prerequisites:
      - meditate
    trainers:
      - monastery_elder
      - temple_priest
    lag: 2
    cooldown: 15
    mv_cost: 0
    mana_cost: 20
    description: >
      Create a magical ward that absorbs incoming spell damage.
    effect:
      type: buff
      applies:
        effect: warded
        duration: 5
        absorb:
          damage_types:
            - magic
            - fire
            - ice
            - lightning
          amount: 30  # Absorbs 30 damage
      message_self: "You weave a protective ward around yourself."
      message_room: "A shimmering barrier forms around $actor."

  dispel:
    key: dispel
    name: Dispel
    category: magic_defense
    cost: 2
    stat: int
    prerequisites:
      - ward
    trainers:
      - monastery_elder
      - magic_trainer
    lag: 2
    cooldown: 20
    mv_cost: 0
    mana_cost: 25
    description: >
      Attempt to remove magical effects from a target.
    effect:
      type: special
      action: dispel
      check:
        stat: int
        vs: caster_int  # Original caster's INT
      removes:
        - buffs  # All magical buffs
        - debuffs  # All magical debuffs
      message_success: "You dispel the magical effects on $target!"
      message_fail: "The magical effects resist your dispelling attempt."
      message_target: "$actor's dispelling magic washes over you!"

  # =============================================================================
  # Advanced Magic
  # =============================================================================

  quickcast:
    key: quickcast
    name: Quickcast
    category: magic_utility
    cost: 3
    stat: int
    prerequisites:
      - focus
    trainers:
      - monastery_elder
      - archmage
    lag: 0
    cooldown: 30
    mv_cost: 0
    mana_cost: 15
    description: >
      Your next mantra is cast instantly with no lag.
    effect:
      type: buff
      applies:
        effect: quickcasting
        duration: 1  # Next spell only
        modifier:
          spell_lag: 0
        consumed_on: spell_cast
      message_self: "You prepare to cast with lightning speed!"
      message_room: "Magical energy crackles around $actor's hands."

  mana_shield:
    key: mana_shield
    name: Mana Shield
    category: magic_defense
    cost: 3
    stat: int
    prerequisites:
      - ward
      - meditate
    trainers:
      - archmage
      - monastery_elder
    lag: 2
    cooldown: 60
    mv_cost: 0
    mana_cost: 30
    description: >
      Convert incoming damage to mana drain instead of HP loss.
    effect:
      type: buff
      applies:
        effect: mana_shielded
        duration: 10
        while_active:
          damage_to_mana: true
          conversion_rate: 2  # 2 mana per 1 damage
          breaks_when: mana_depleted
      message_self: "A barrier of pure mana surrounds you!"
      message_room: "A swirling shield of magical energy envelops $actor."
      message_break: "Your mana shield shatters!"
