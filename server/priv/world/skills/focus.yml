key: focus
name: Focus
category: magic_offense
cost: 2
stat: int
prerequisites:
  - meditate
trainers:
  - monastery_elder
  - magic_trainer
lag: 1
cooldown: 10
mv_cost: 0
mana_cost: 10
description: >
  Focus your mind, increasing spell power for the next mantra.
effect:
