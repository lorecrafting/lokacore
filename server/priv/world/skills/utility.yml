# Utility Skills - Non-combat skills for exploration and survival

skills:
  # =============================================================================
  # Movement / Stealth
  # =============================================================================

  sneak:
    key: sneak
    name: Sneak
    category: stealth
    cost: 1
    stat: dex
    prerequisites: []
    trainers:
      - shadow_trainer
      - monastery_shadow_monk
    lag: 0
    cooldown: 0
    mv_cost: 0  # Toggle, costs extra MV while active
    mana_cost: 0
    description: >
      Move quietly, avoiding detection. Costs 50% more MV while active.
    effect:
      type: toggle
      while_active:
        mv_cost_multiplier: 1.5
        hidden: true
        detection_check:
          stat: per
          difficulty: dex  # Attacker's PER vs your DEX
      message_on: "You begin moving quietly."
      message_off: "You stop sneaking."
      message_detected: "$actor notices you lurking in the shadows!"

  sprint:
    key: sprint
    name: Sprint
    category: movement
    cost: 1
    stat: con
    prerequisites: []
    trainers:
      - combat_trainer
      - monastery_martial_master
    lag: 0
    cooldown: 10
    mv_cost: 0  # Uses MV faster while active
    mana_cost: 0
    description: >
      Move at double speed for a short time. Drains MV quickly.
    effect:
      type: toggle
      duration: 5  # Max 5 rooms
      while_active:
        mv_cost_multiplier: 2.0
        movement_speed: 2.0
      message_on: "You break into a sprint!"
      message_off: "You slow to a normal pace, breathing heavily."

  climb:
    key: climb
    name: Climb
    category: movement
    cost: 1
    stat: dex
    prerequisites: []
    trainers:
      - scout_trainer
      - monastery_shadow_monk
    lag: 2
    cooldown: 0
    mv_cost: 20
    mana_cost: 0
    description: >
      Allows climbing difficult terrain. Required for some exits.
    effect:
      type: passive
      enables:
        - climb_exits
      check:
        stat: dex
        difficulty_from: exit  # Exit defines difficulty
      message_success: "You climb $direction skillfully."
      message_fail: "You fail to find purchase and cannot climb."

  # =============================================================================
  # Survival
  # =============================================================================

  forage:
    key: forage
    name: Forage
    category: survival
    cost: 1
    stat: per
    prerequisites: []
    trainers:
      - herbalist
      - monastery_garden_keeper
    lag: 3
    cooldown: 30
    mv_cost: 10
    mana_cost: 0
    description: >
      Search the area for edible plants, herbs, or useful materials.
    effect:
      type: gather
      resource_type: forage
      check:
        stat: per
        base_success: 60
      loot_table: forage_common
      message_success: "You find $item while foraging."
      message_fail: "You search but find nothing useful."

  first_aid:
    key: first_aid
    name: First Aid
    category: survival
    cost: 2
    stat: int
    prerequisites: []
    trainers:
      - healer
      - monastery_infirmary_keeper
    lag: 4
    cooldown: 60
    mv_cost: 0
    mana_cost: 0
    description: >
      Treat wounds using bandages. Restores HP outside of combat.
    effect:
      type: heal
      requires:
        item: bandage
        consume: true
      base_heal: 20
      stat_bonus: int
      combat_restriction: out_of_combat
      message_self: "You carefully bandage your wounds."
      message_other: "You carefully bandage $target's wounds."
      message_room: "$actor tends to $target's wounds."

  # =============================================================================
  # Social
  # =============================================================================

  haggle:
    key: haggle
    name: Haggle
    category: social
    cost: 1
    stat: per
    prerequisites: []
    trainers:
      - merchant
      - monastery_quartermaster
    lag: 0
    cooldown: 0
    mv_cost: 0
    mana_cost: 0
    description: >
      Negotiate better prices with merchants.
    effect:
      type: passive
      modifier:
        shop_buy_discount: 10  # 10% off purchases
        shop_sell_bonus: 5     # 5% more when selling
      check:
        stat: per
        vs: merchant_will  # Merchant's resistance

  intimidate:
    key: intimidate
    name: Intimidate
    category: social
    cost: 1
    stat: str
    prerequisites: []
    trainers:
      - combat_trainer
      - monastery_martial_master
    lag: 2
    cooldown: 30
    mv_cost: 0
    mana_cost: 0
    description: >
      Attempt to frighten an NPC into compliance or fleeing.
    effect:
      type: social_check
      check:
        stat: str
        vs: target_con
      on_success:
        applies:
          effect: frightened
          duration: 3
        flee_chance: 30
      message_success: "$target cowers before your intimidating presence!"
      message_fail: "$target seems unimpressed by your threats."
      message_room: "$actor attempts to intimidate $target."
