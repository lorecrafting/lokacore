key: elder_drolma
name: "Elder Drolma"
type: npc
parent: base_npc
description: |
  An ancient nun whose face is a map of wrinkles, each line a story.
  She moves with deliberate grace, her clouded eyes seeing more than
  most with clear sight. She tends the dining hall as she has for
  sixty years.
