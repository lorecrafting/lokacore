key: elder_drolma
short_desc: "Elder Drolma"
long_desc: "An ancient nun with a face like a map of wrinkles tends the hall."
type: npc
parent: base_npc
keywords:
  - elder
  - drolma
  - nun
primary_keyword: nun
extra_desc: |
  An ancient nun whose face is a map of wrinkles, each line a story.
  She moves with deliberate grace, her clouded eyes seeing more than
  most with clear sight. She tends the dining hall as she has for
  sixty years.
tags:
  - friendly
  - lore
  - monastery

# Personality emotes for behavior events
emotes:
  waking_up: "*rises stiffly but with purpose* Another day to serve."
  going_to_sleep: "*settles onto her mat with a contented sigh* Rest comes easy to the peaceful heart."
  meditation_start: "*her clouded eyes close, face becoming serene*"
  greeting: "Come, sit. There is always tea for a weary traveler."
  serving_tea: "*pours butter tea with practiced grace, steam rising*"
  teaching: "*her voice grows stronger as ancient wisdom flows through her*"
  remembering: "*gazes into the distance, seeing memories long past*"

# Behaviors - elder follows a gentle schedule
traits:
  - script: day_night_schedule
    config:
      wake_at: morning
      sleep_at: dusk

components:
  ambient_actions:
    messages:
      - "Elder Drolma stirs a pot of butter tea with practiced care."
      - "The ancient nun hums an old melody, nearly forgotten by time."
      - "Drolma arranges bowls with quiet precision."
      - "The elder's clouded eyes gaze into the distance, seeing memories."
      - "Drolma mutters a blessing over the tea as it steeps."
    interval_min: 30
    interval_max: 60
    chance: 0.5
  combatant:
    health:
      current: 80
      max: 80
    stats:
      str: 4
      dex: 4
      sta: 10
    level: 3
  dialogue_tree:
    start:
      text: "Come, sit. Even in dark times, we must eat. I am Drolma. Would you like some tea?"
      choices:
        - text: "Yes, please. [Accept tea]"
          next: "tea_given"
          action: ["give_item", "butter_tea"]
        - text: "Tell me about the monastery."
          next: "lore"
        - text: "What do you know about the caves?"
          next: "caves_lore"
        - text: "I should keep moving."
          next: null
    tea_given:
      text: "[She pours warm butter tea with practiced hands.] Drink. It will give you strength for the journey ahead. I can see in your eyes that you are troubled. All who come here now are troubled."
      choices:
        - text: "What do you know about what's happening?"
          next: "current_crisis"
        - text: "Tell me about the monastery's history."
          next: "lore"
        - text: "Thank you for the tea."
          next: null
    current_crisis:
      text: "Tenzin went where all masters must eventually go - to face the shadow within. The Three Poisons grow stronger when we ignore them. He thought to confront them directly. [She shakes her head.] Perhaps it was wise. Perhaps it was foolish. The line between is thin."
      choices:
        - text: "Can anything be done?"
          next: "hope"
        - text: "Tell me about the Three Poisons."
          next: "teaching"
    hope:
      text: "You are here, are you not? [She smiles.] Fate guides seekers to this place in times of need. Take this with you. [She offers blessed rice.] In the caves, offerings have power. What you give freely cannot be taken from you."
      choices:
        - text: "[Accept the blessed rice]"
          next: "rice_given"
          action: ["give_item", "offering_rice"]
        - text: "I don't understand."
          next: "teaching"
    rice_given:
      text: "Use it when the darkness seems overwhelming. An offering of compassion can turn aside the fiercest demon. Remember: Mara feeds on our fear and desire. Give freely, and you starve it."
      choices:
        - text: "Thank you, Elder."
          next: null
        - text: "Tell me more about Mara."
          next: "caves_lore"
    lore:
      text: "These caves are older than the monastery. The first teachers came here to face themselves. They built this place as a reminder - the enemy is within, and so is the liberation. Sixty years I have served tea here. Sixty years watching seekers come and go."
      choices:
        - text: "What have you learned in sixty years?"
          next: "wisdom"
        - text: "Tell me about the caves."
          next: "caves_lore"
    wisdom:
      text: "That everything passes. Joy, sorrow, fear, peace - all clouds across the sky of mind. The sky remains. You will face terrible things in those caves. Remember: they too will pass."
      choices:
        - text: "How do I face the Three Poisons?"
          next: "teaching"
        - text: "Tell me about karma."
          next: "karma"
        - text: "Thank you for your wisdom."
          next: null
    caves_lore:
      text: "Mara lives in us all, child. The caves merely... concentrate it. Give it form. The Three Poisons - attachment, aversion, ignorance - have manifest there as demons. But they are our demons, not creatures from outside."
      choices:
        - text: "How do I defeat them?"
          next: "teaching"
        - text: "That sounds terrifying."
          next: "comfort"
    comfort:
      text: "[She pats your hand.] Fear is natural. Even Tenzin feared. But he went anyway. Courage is not absence of fear - it is going forward despite it. You have that courage. I can see it."
      choices:
        - text: "Thank you, Elder."
          next: null
    teaching:
      text: "The Three Poisons - attachment, aversion, ignorance. They are not enemies to destroy, but teachers to learn from. Attachment teaches us what we cling to. Aversion teaches us what we push away. Ignorance teaches us what we refuse to see."
      choices:
        - text: "How do I use this knowledge?"
          next: "practical"
        - text: "I'll remember this."
          next: null
    practical:
      text: "When attachment offers you everything you desire - let go. When aversion strikes with fury - respond with patience. When ignorance clouds your sight - seek the light of wisdom. The mantras will help. Ask Master Chen or Teacher Lobsang."
      choices:
        - text: "Thank you for your guidance."
          next: null
    karma:
      text: "Karma is not punishment - it is teaching. Every action plants a seed. Good actions plant good seeds. Even one who has taken many lives can plant new seeds of compassion. The past cannot be changed, but the future... the future is always open."
      choices:
        - text: "Can anyone truly change?"
          next: "karma_change"
        - text: "Thank you, Elder."
          next: null
    karma_change:
      text: "I have seen hardened warriors become gentle teachers. I have seen those who caused great harm become great healers. The Buddha himself said: 'No one saves us but ourselves. No one can and no one may. We ourselves must walk the path.' Change is always possible for those who truly seek it."
      choices:
        - text: "Can you teach me more of this philosophy?"
          next: "teach_philosophy"
        - text: "That's comforting to know."
          next: null

    # Philosophy Teaching
    teach_philosophy:
      text: "You wish to study the dharma more deeply? [She nods approvingly.] Philosophy is not mere words - it is a way of seeing. Each teaching opens new eyes. I can share what sixty years have taught me."
      choices:
        - text: "Please teach me philosophy. (1 point per level)"
          next: "learn_philosophy"
          action: ["learn_skill", "philosophy", 1]
        - text: "What will I learn?"
          next: "philosophy_benefits"
        - text: "Perhaps another time."
          next: null

    learn_philosophy:
      text: "[Elder Drolma's eyes seem to clear as she speaks.] The Three Marks of Existence: impermanence, suffering, and non-self. When you truly understand these, the demons in the caves lose their power. What can attachment grasp that is not already passing? What can aversion push away that is not already changing? What can ignorance hide that is not already empty?"
      choices:
        - text: "This is deep wisdom."
          next: "philosophy_continued"
        - text: "Thank you, Elder."
          next: null

    philosophy_benefits:
      text: "Philosophy strengthens the mind against the Three Poisons. Those who understand impermanence cannot be tempted by attachment's treasures. Those who understand suffering respond to aversion with compassion. Those who understand non-self see through ignorance's illusions."
      choices:
        - text: "Teach me then. (1 point per level)"
          next: "learn_philosophy"
          action: ["learn_skill", "philosophy", 1]
        - text: "I need time to think on this."
          next: null

    philosophy_continued:
      text: "Return when you wish to learn more. The dharma is vast - a lifetime is not enough to drink it all. But even a cup quenches thirst. [She presses something smooth and cool into your palm.] Take this calm stone. When attachment grasps at your heart, hold it and remember: all things pass."
      action: ["give_item", "calm_stone"]
      choices:
        - text: "Thank you, Elder. I will treasure this."
          next: null
  teacher:
    skills:
      - philosophy
    mantras:
      - tayata_om_bekanze
  gives_items:
    - offering_rice
    - butter_tea
    - calm_stone
