key: tavern_keeper
parent: base_npc
type: npc
name: "Burly Barkeep"
description: |
  A barrel-chested man with thick forearms and a bushy beard.
  He wipes down the bar with a practiced hand while keeping
  one eye on the rowdier patrons. A friendly smile creases
  his weathered face.
components:
  combatant:
    health:
      current: 120
      max: 120
    stats:
      str: 14
      dex: 10
      sta: 12
  conversant:
    default_greeting: "What'll it be, friend?"
    dialogue_tree:
      start:
        text: "Welcome to the Rusty Tankard! What'll it be?"
        choices:
          - label: "I'd like a drink"
            next: drinks
          - label: "Got any rooms?"
            next: rooms
          - label: "Heard any gossip?"
            next: gossip
          - label: "Nothing right now"
            next: goodbye
      drinks:
        text: "Ale's a copper, mead's two. The stew's hearty and cheap."
        action: open_shop
      rooms:
        text: "Aye, ten silver a night, includes breakfast. Clean sheets too."
        choices:
          - label: "I'll take a room"
            action: rent_room
          - label: "Maybe later"
            next: start
      gossip:
        text: "Strange folk been coming through lately. Adventuring types, heading for the old ruins east of here. Bad business, that place."
        choices:
          - label: "Tell me about these ruins"
            next: ruins_info
          - label: "Back"
            next: start
      ruins_info:
        text: "Ancient place, from before the village. Nobody goes there anymore. Strange lights at night, they say."
        choices:
          - label: "Back"
            next: start
      goodbye:
        text: "Stay as long as you like!"
        action: end_conversation
tags:
  - friendly
  - merchant
  - innkeeper
attributes:
  shop_inventory:
    - ale
    - mead
    - bread
