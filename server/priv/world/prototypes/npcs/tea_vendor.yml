key: tea_vendor
type: npc
parent: base_npc

short_desc: "Tea Vendor Karma"
long_desc: "A cheerful vendor tends her bubbling kettles, the scent of butter tea filling the air."
extra_desc: |
  A plump, rosy-cheeked woman presides over an array of steaming
  kettles, her stall fragrant with the rich aroma of butter tea
  and sweet rice. Her laugh comes easily and often, and she seems
  to know everyone who passes by name.
keywords:
  - vendor
  - tea
  - karma
  - seller
  - woman
primary_keyword: vendor
mood: cheerful

tags:
  - friendly
  - merchant
  - village
  - atmosphere

components:
  ambient_actions:
    messages:
      - "Karma stirs one of her kettles, humming contentedly."
      - "The vendor ladles steaming tea into a waiting cup."
      - "Karma calls out to a passing villager, exchanging cheerful gossip."
      - "The tea vendor adds a pinch of salt to her largest kettle."
      - "Karma wipes her hands on her apron, surveying her domain with satisfaction."
      - "Steam rises from the kettles, carrying the rich scent of yak butter."
      - "The vendor arranges her cups in neat rows, ready for customers."
      - "Karma laughs at something, the sound bright as a bell."
    interval_min: 25
    interval_max: 45
    chance: 0.6
  combatant:
    health:
      current: 50
      max: 50
    stats:
      str: 8
      dex: 8
      sta: 10
    level: 2
  dialogue_tree:
    # ==========================================================================
    # BEST PRACTICE: Quest offers should be upfront in the first dialogue node.
    # ==========================================================================

    # Default start - quest offer upfront
    start:
      text: "Welcome, welcome! You look like you could use some warming up. Say, I'm running low on ingredients for my famous Chrysanthemum Goji Tea. Could you gather some from the monastery gardens? I'd be ever so grateful!"
      show_if:
        quest_not_active: "side_tea_for_travelers"
      choices:
        - text: "[Accept Quest] I can help with that."
          next: "quest_accepted"
          action: ["accept_quest", "side_tea_for_travelers"]
        - text: "Where do I find the ingredients?"
          next: "ingredient_directions_start"
        - text: "I'd just like some tea."
          next: "tea_order"
          action: ["open_shop", null]
        - text: "Just passing through."
          next: "passing"

    ingredient_directions_start:
      text: "The chrysanthemum grows in the herb garden - those lovely white and yellow blooms near the monastery. The goji berries grow on thorny shrubs in the terraced fields to the east."
      choices:
        - text: "[Accept Quest] I'll find them."
          next: "quest_accepted"
          action: ["accept_quest", "side_tea_for_travelers"]
        - text: "Maybe later."
          next: null
    # Start when quest is active - reminder
    start_active:
      text: "Ah, my ingredient-gatherer returns! Have you found the chrysanthemum flowers and goji berries? The monastery gardens for the flowers, and the terraced fields for the berries."
      show_if:
        quest_active: "side_tea_for_travelers"
      choices:
        - text: "Still looking."
          next: null
        - text: "Where do I find them again?"
          next: "ingredient_directions"
        - text: "I'd like some tea while I search."
          next: "tea_order"
          action: ["open_shop", null]
    # Start when quest ready to turn in
    start_ready_to_turn_in:
      text: "[Karma's eyes light up.] You found them! I can smell the chrysanthemum from here! Let me see, let me see!"
      show_if:
        quest_complete: "side_tea_for_travelers"
      choices:
        - text: "Here are your ingredients."
          next: "ingredients_ready"
    # Start after quest completed
    start_completed:
      completed_quest: "side_tea_for_travelers"
      text: "My favorite ingredient-gatherer! Thanks to you, my Chrysanthemum Goji Tea is the talk of the valley. What can I get you today? It's on the house for you!"
      choices:
        - text: "I'd love some tea."
          next: "tea_order"
          action: ["open_shop", null]
        - text: "What's the local news?"
          next: "gossip"
        - text: "Just saying hello."
          next: "passing"
    # Ingredient directions
    ingredient_directions:
      text: "The chrysanthemum grows in the herb garden - those lovely white and yellow blooms near the monastery. The goji berries grow on thorny shrubs in the terraced fields to the east. Herb Master Dolkar can point you the right way if you get lost!"
      choices:
        - text: "I'll find them."
          next: null
    help_needed:
      text: "Now that you mention it... I'm running low on ingredients for my famous Chrysanthemum Goji Tea. If you could gather some from the monastery gardens, I'd be ever so grateful!"
      show_if:
        quest_not_active: "side_tea_for_travelers"
      choices:
        - text: "[Accept Quest] I can help with that."
          next: "quest_accepted"
          action: ["accept_quest", "side_tea_for_travelers"]
        - text: "Maybe later."
          next: null
    quest_accepted:
      text: "Oh, wonderful! I need chrysanthemum flowers and goji berries. The chrysanthemum grows in the herb garden - those lovely white and yellow blooms. The goji berries grow on thorny shrubs in the terraced fields. Herb Master Dolkar can point you the right way."
      choices:
        - text: "I'll be back soon."
          next: null
    ingredients_ready:
      text: "You found them! Oh, these are perfect - the chrysanthemum petals are so delicate, and the goji berries are so bright! Here, take these teas as thanks. You've earned a lifetime of free tea, as far as I'm concerned!"
      show_if:
        quest_active: "side_tea_for_travelers"
      choices:
        - text: "[Complete Quest] Happy to help."
          next: null
          action: ["complete_quest", "side_tea_for_travelers"]
    tea_order:
      text: "Coming right up! Nothing like hot butter tea to chase away the mountain chill. Here, let me get you a fresh cup."
      choices:
        - text: "Thank you."
          next: null
    gossip:
      text: "Oh, where to begin! The merchant Dorje claims he saw lights in the caves last night. Farmer Tsering's best yak went missing - though I suspect she just wandered off again. And everyone's worried about the master, of course. Seven days now..."
      choices:
        - text: "Tell me about the master."
          next: "master_gossip"
        - text: "Lights in the caves?"
          next: "cave_gossip"
        - text: "Actually, I'd like some tea."
          next: "tea_order"
          action: ["open_shop", null]
    master_gossip:
      text: "Lama Tenzin, bless him. Kindest soul you'd ever meet. He'd stop and talk to anyone - even us common folk. Now he just sits there, not moving, not eating. The monks say he's fighting something. Something old."
      choices:
        - text: "I hope to help."
          next: "hero_response"
        - text: "That's concerning."
          next: null
    cave_gossip:
      text: "Strange lights, strange sounds. My grandmother used to tell stories about those caves - said they were there before the monastery, before the village, before anyone. Said the Buddha himself couldn't fully tame what lived there. Just put it to sleep."
      choices:
        - text: "Interesting. Thank you."
          next: null
    hero_response:
      text: "Are you now? The Abbot's been looking for someone. A prophecy, they say. Someone from outside who can walk the path. Maybe that's you! Here - have a tea on the house. You'll need your strength."
      choices:
        - text: "Thank you, that's very kind."
          next: null
          action: ["give_item", "butter_tea"]
    passing:
      text: "Well, stop by if you change your mind! The kettle's always warm, and I love hearing tales from travelers."
      choices:
        - text: "Perhaps later."
          next: null
  shop:
    sells:
      - butter_tea
      - sweet_rice
      - herbal_remedy
      - blessed_rice
    buys: []
