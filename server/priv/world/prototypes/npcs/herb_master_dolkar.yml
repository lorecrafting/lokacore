key: herb_master_dolkar
type: npc
parent: base_npc

short_desc: "Herb Master Dolkar"
long_desc: "A serene monk tends the herbs with delicate, knowing fingers."
extra_desc: |
  An elderly monk whose robes are stained with the green of countless
  crushed leaves and the brown of mountain soil. Her movements are
  slow and deliberate, each gesture purposeful. She speaks to her
  plants in soft whispers, and they seem to lean toward her voice.
  Her hands, though old, are steady and sure.
keywords:
  - herbalist
  - dolkar
  - monk
  - healer
  - master
primary_keyword: monk
mood: peaceful

tags:
  - friendly
  - monastery
  - healer
  - teacher

components:
  ambient_actions:
    messages:
      - "Dolkar whispers something to a flowering plant, which seems to perk up."
      - "The herb master gently prunes a wayward stem."
      - "Dolkar closes her eyes, breathing deeply of the garden's fragrance."
      - "The herbalist examines a leaf with careful attention."
      - "Dolkar hums an old melody as she waters the herbs."
      - "The master tenderly transplants a seedling to better soil."
      - "Dolkar's fingers brush the herbs as she passes, checking their health."
      - "The herb master sorts dried roots into neat piles, murmuring their names."
    interval_min: 30
    interval_max: 50
    chance: 0.6
  combatant:
    health:
      current: 45
      max: 45
    stats:
      str: 5
      dex: 10
      sta: 8
    level: 3
  dialogue_tree:
    start:
      text: "Welcome to the healing garden. Everything here serves to mend body, mind, or spirit. How may I help you?"
      choices:
        - text: "Can you teach me about herbs?"
          next: "teaching"
        - text: "I need healing supplies."
          next: "supplies"
        - text: "Tell me about your work."
          next: "work"
        - text: "Just enjoying the garden."
          next: "enjoy"
    teaching:
      text: "The old masters taught that herbs have five natures - hot, warm, neutral, cool, and cold. Each flavor too has meaning - sweet nourishes, bitter drains, sour astringes. Understanding these principles is the foundation of herbalism."
      choices:
        - text: "Can you teach me to gather herbs?"
          next: "teach_herbalism"
        - text: "What about making medicines?"
          next: "teach_alchemy"
        - text: "Tell me about the herbs here."
          next: "herb_guide"
        - text: "Thank you for the wisdom."
          next: null
    teach_herbalism:
      text: "Very well. Look around you - fresh ginger for warming, chrysanthemum for cooling, licorice to harmonize. Take what you need, but never strip a plant bare. Leave some for the garden to regenerate."
      choices:
        - text: "I'll practice."
          next: null
          action: ["learn_skill", "herbalism"]
    teach_alchemy:
      text: "That is more complex. First, learn the simple teas - chrysanthemum with goji to brighten the eyes, ginger with jujube to warm the blood. Master these, and I shall teach you the Four Gentlemen formula."
      choices:
        - text: "I understand."
          next: null
    herb_guide:
      text: "In this garden you'll find ginger, jujube dates, licorice root, and chrysanthemum - the common herbs. In the terraced fields grow goji berries, longan, and atractylodes. Near the pine roots, you might find poria mushroom. Each has its purpose."
      choices:
        - text: "What are they used for?"
          next: "herb_uses"
        - text: "Thank you."
          next: null
    herb_uses:
      text: "Ginger drives away cold. Chrysanthemum cools heat and brightens eyes. Licorice harmonizes other herbs - it appears in nearly every formula. Goji nourishes the blood. Longan calms the spirit. Together, they can heal much."
      choices:
        - text: "I should start gathering."
          next: null
    supplies:
      text: "I keep some prepared remedies for travelers. Simple things - wound salves, headache powders, calming teas. What do you need?"
      choices:
        - text: "Show me what you have."
          next: null
          action: ["open_shop", null]
    work:
      text: "For forty years I have tended this garden. Every plant here is a friend, a teacher, a healer. The monastery depends on our remedies - for the monks, for the villagers, for pilgrims. It is good work."
      choices:
        - text: "Do you use herbs against what's in the caves?"
          next: "cave_herbs"
        - text: "That's admirable dedication."
          next: null
    cave_herbs:
      text: "Some things cannot be healed with herbs alone. The poisons of the mind - attachment, aversion, ignorance - require spiritual medicine. But herbs can clear the mind, steady the heart, open the eyes. They can help one face what must be faced."
      choices:
        - text: "What would you recommend for the caves?"
          next: "cave_recommendation"
        - text: "Thank you for your wisdom."
          next: null
    cave_recommendation:
      text: "Clarity incense for confusion, calming tea before battle, and bitter root to resist temptation. I can prepare these, if you bring me the ingredients."
      choices:
        - text: "What ingredients do you need?"
          next: "ingredient_list"
        - text: "I'll look for them."
          next: null
    ingredient_list:
      text: "For clarity, brew chrysanthemum and goji tea - it brightens the eyes and clears the mind. For warmth before battle, ginger and jujube tea drives away cold and steadies the nerves. And for true vitality, seek the longan fruit."
      choices:
        - text: "I'll gather what I can."
          next: null
    enjoy:
      text: "Then please, take your time. The garden welcomes all who come in peace. Perhaps you might help me weed a row or two - there is meditation in the work."
      choices:
        - text: "I'd be happy to help."
          next: null
  shop:
    sells:
      - sheng_jiang
      - da_zao
      - gan_cao
      - ju_hua
      - chrysanthemum_goji_tea
      - ginger_jujube_tea
      - water_flask
      - mortar_and_pestle
      - alchemy_kit
      - herbal_remedy
    buys:
      - sheng_jiang
      - da_zao
      - gan_cao
      - ju_hua
      - gou_qi_zi
      - long_yan_rou
      - fu_ling
      - bai_zhu
      - ghost_essence
