key: lama_yeshe
short_desc: "Lama Yeshe"
long_desc: "An ethereal figure draped in mist stands near the waterfall."
type: npc
parent: base_npc
keywords:
  - lama
  - yeshe
  - figure
primary_keyword: figure
extra_desc: |
  An ethereal figure draped in mist from the waterfall, her eyes
  holding the depth of still pools. She teaches the Sangha Path -
  magic through connection with all beings.
tags:
  - friendly
  - trainer
  - sacred
  - magic
components:
  ambient_actions:
    messages:
      - "Lama Yeshe's form shimmers in the waterfall mist."
      - "The ethereal figure traces symbols in the air that fade to light."
      - "Yeshe's eyes reflect the endless flow of water."
      - "A soft chant rises from the lama, harmonizing with the waterfall."
      - "Mist swirls around Yeshe like a living thing."
    interval_min: 30
    interval_max: 60
    chance: 0.5
  combatant:
    health:
      current: 90
      max: 90
    stats:
      str: 6
      dex: 10
      sta: 10
    level: 5
  dialogue_tree:
    start:
      text: "The water falls and never stops. Like compassion, it flows to all beings equally."
      choices:
        - text: "I seek training in magic."
          next: "training"
        - text: "Tell me about magic."
          next: "magic"
        - text: "What mantra should I learn?"
          next: "mantra"
        - text: "I must go."
          next: null
    training:
      text: "The Sangha Path draws power from connection - to all beings, to all elements. Separation is illusion. I can teach you Meditation - to deepen your inner calm and enhance all healing you receive."
      choices:
        - text: "Teach me Meditation. (1 point per level)"
          next: "learn_meditation"
          action: ["learn_skill", "meditation", 1]
        - text: "Tell me about magic."
          next: "magic"
        - text: "I must go."
          next: null
    learn_meditation:
      text: "[Lama Yeshe's form shimmers.] Breathe with the waterfall. Let go of thought. When healing comes to you, it will flow deeper now."
      choices:
        - text: "I seek more training."
          next: "training"
        - text: "Thank you, Lama Yeshe."
          next: null
    magic:
      text: "Magic is not forcing the world to obey. It is asking, and being answered."
      choices:
        - text: "I seek training."
          next: "training"
        - text: "What mantra should I learn?"
          next: "mantra"
        - text: "I must go."
          next: null
    mantra:
      text: "Om Tare Tuttare Ture Soha. Tara dispels all fears, all illusions. In the caves, this mantra will save your life. I can teach you the Protection Mantra - it shields against the spirits' attacks."
      choices:
        - text: "Teach me the Protection Mantra. (1 point per level)"
          next: "learn_protection"
          action: ["learn_skill", "mantra_protection", 1]
        - text: "What other mantras exist?"
          next: "other_mantras"
        - text: "I must go."
          next: null
    learn_protection:
      text: "[Lama Yeshe's voice seems to come from everywhere at once.] Om Tare Tuttare Ture Soha. Feel the shield form around you. When spirits strike, the mantra absorbs the blow. Practice until the words become instinct."
      choices:
        - text: "What other mantras can I learn?"
          next: "other_mantras"
        - text: "Thank you, Lama Yeshe."
          next: null
    other_mantras:
      text: "There are three mantras for the caves: Protection shields against harm. Compassion weakens attachments. Wisdom pierces confusion. I teach Protection here. For Compassion, seek Abbot Jampa. For Wisdom, the hermit Milarepa in his cave."
      choices:
        - text: "Teach me Protection then."
          next: "learn_protection"
          action: ["learn_skill", "mantra_protection", 1]
        - text: "I will seek the others."
          next: null
  teacher:
    skills:
      - meditation
      - mantra_protection
