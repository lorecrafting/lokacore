key: planet_brennan
type: npc
short_desc: "Brennan"
long_desc: "Brennan stands at the path's edge with the stillness of a man who has stood this watch many times."
extra_desc: |
  He is built for endurance rather than speed — broad shoulders, wind darkened skin, eyes that have spent decades scanning horizons. There is a badge on his chest, worn and hand polished. He does not look at it. He does not need to.
keywords: [brennan, watcher, guard, man]
primary_keyword: brennan

components:
  combatant:
    health:
      current: 150
      max: 150
    stats:
      str: 14
      dex: 10
      sta: 14
    level: 6

  ai:
    aggression: neutral
    wander: false

  dialogue_tree:
    # ==========================================================================
    # BRENNAN — The Watcher
    # Key dialogue_topic nodes:
    #   introduction (grove_arrival)
    #   edge_truth (grove_revelation)
    # ==========================================================================

    start:
      text: "You're the newcomer."
      choices:
        - text: "Thera sent me to meet you."
          show_if:
            quest_active: grove_arrival
          next: intro_meeting

        - text: "I've been thinking about something you said."
          show_if:
            quest_not_active: side_brennan
            quest_not_completed: side_brennan
            quest_completed: grove_arrival
          next: seren_quest_lead

        - text: "Are you all right?"
          show_if:
            quest_active: grove_sacrifice
          next: brennan_sacrifice_check

        - text: "You're still at your post."
          show_if:
            completed_quest: grove_epilogue
          next: post_landing_brennan

        - text: "What do you watch for?"
          next: watches_for

        - text: "Can I pass?"
          next: can_pass

        - text: "Goodbye."
          next: null

    intro_meeting:
      text: "Good. You should know the Watchers exist and what we do."
      choices:
        - text: "What do you do?"
          next: watches_for

    watches_for:
      text: "We watch the Thinning. Make sure no one goes too far. The edges of the Grove are... not safe for long exposure."
      choices:
        - text: "What's out there?"
          next: out_there
        - text: "Why aren't they safe?"
          next: not_safe

    out_there:
      text: "Nothing worth seeing."
      choices:
        - text: "That's not an answer."
          next: out_there_2
        - text: "(You let it go)"
          next: null

    out_there_2:
      text: "No. It isn't."
      choices:
        - text: "(He's not going to say more)"
          next: null

    not_safe:
      text: "The Thinning thins more than trees. Something about the far edges affects cognition. People lose themselves. I've pulled a dozen people back over the years."
      choices:
        - text: "Have you ever lost one?"
          next: lost_one

    lost_one:
      text: "..."
      next: lost_one_2

    lost_one_2:
      text: "Once."
      choices:
        - text: "(Don't ask more)"
          next: null
        - text: "I'm sorry."
          next: lost_one_sorry

    lost_one_sorry:
      text: "Thirty years ago. I've had time."
      choices:
        - text: "(Some things don't heal with time)"
          next: null

    can_pass:
      text: "As far as the thinning_approach, yes. Not past. I don't make exceptions."
      choices:
        - text: "Understood."
          next: null
        - text: "What if it's important?"
          next: cant_pass_important

    cant_pass_important:
      text: "People always think their reason is important. That's not what determines whether you lose yourself."
      choices:
        - text: "(Fair enough)"
          next: null

    # ---- grove_arrival dialogue_topic node ----

    introduction:
      text: "I'm Brennan. Chief Watcher. My job is to make sure the Grove's edge stays a boundary and not a door."
      choices:
        - text: "Has it ever been a door?"
          next: intro_door
        - text: "How many Watchers are there?"
          next: intro_how_many

    intro_door:
      text: "Once. It was a mistake."
      choices:
        - text: "(Leave it there)"
          next: null

    intro_how_many:
      text: "Three, counting me. Enough for the rotation."
      choices:
        - text: "Do you ever sleep?"
          next: intro_sleep

    intro_sleep:
      text: "When I'm off shift."
      choices:
        - text: "(He says this without irony)"
          next: null

    # ---- grove_revelation dialogue_topic node ----

    edge_truth:
      text: "You've seen it. The membrane."
      choices:
        - text: "Yes. The stars."
          next: edge_truth_2
        - text: "I need to understand what I saw."
          next: edge_truth_2

    edge_truth_2:
      text: "I've known for thirty years. Since Seren."
      choices:
        - text: "Who was Seren?"
          next: edge_seren
        - text: "Why didn't you tell anyone?"
          next: edge_why_not

    edge_seren:
      text: "The Rootspeaker before Thera. She was — we were close. She was chosen the way Thera has been chosen."
      choices:
        - text: "What happened to her?"
          next: edge_seren_what

    edge_seren_what:
      text: "She went to the Heartroot alone. She understood what was asked. She... chose differently than Thera will choose."
      choices:
        - text: "She chose rest."
          next: edge_seren_rest
        - text: "She said no?"
          next: edge_seren_rest

    edge_seren_rest:
      text: "The second root. Not wrong. Lira herself said it wasn't wrong — just not enough to hold the Grove. Without a new Heart, the ship fails slowly. Seren's choice bought thirty years. That's all."
      choices:
        - text: "You loved her."
          next: edge_seren_loved

    edge_seren_loved:
      text: "Yes."
      choices:
        - text: "I'm sorry."
          next: edge_seren_sorry
        - text: "(Stay with him)"
          next: edge_seren_sorry

    edge_seren_sorry:
      text: "She was peaceful. She told me not to grieve. I've spent thirty years almost managing it."
      choices:
        - text: "The badge."
          next: edge_badge

    edge_badge:
      text: "*He touches it once, not looking down.* \"She gave it to me. 'Guard the truth,' she said. I have.\""
      choices:
        - text: "(Leave him to his watch)"
          next: null

    edge_why_not:
      text: "Because knowing doesn't help. It just shifts what you're afraid of."
      choices:
        - text: "It helps Thera."
          next: edge_why_thera

    edge_why_thera:
      text: "Yes. I think that's why the time is now."
      choices:
        - text: "(Leave)"
          next: null

    # ---- side_brennan quest lead chain ----

    seren_quest_lead:
      text: "Did I?"
      choices:
        - text: "About losing someone. Thirty years ago."
          next: seren_quest_lead_2

    seren_quest_lead_2:
      text: "..."
      next: seren_quest_lead_3

    seren_quest_lead_3:
      text: "What do you want to know?"
      choices:
        - text: "[Accept Quest] I'd like to understand."
          action: ["accept_quest", "side_brennan"]
          next: seren_quest_accepted
        - text: "Nothing. I shouldn't have asked."
          next: null

    seren_quest_accepted:
      text: "Then start with Maren. She has the records. She knows what this badge means, even if she's never said so."
      choices:
        - text: "(I will)"
          next: null

    # ---- side_brennan dialogue_topic node ----

    seren_named:
      show_if:
        quest_active: side_brennan
      text: "Maren told you about her."
      choices:
        - text: "Seren."
          next: seren_named_2
        - text: "She chose rest."
          next: seren_named_2

    seren_named_2:
      text: "..."
      next: seren_named_3

    seren_named_3:
      text: "She told me — on the last morning — she said: 'Watch it for me. The truth. Make sure it finds the right person when it's time.' I've been watching for forty years."
      choices:
        - text: "She knew someone would come."
          next: seren_named_4

    seren_named_4:
      text: "She always looked ahead. Said it was the Rootspeaker way — to look forward and not flinch."
      choices:
        - text: "You haven't said her name."
          next: seren_say_name

    seren_say_name:
      text: "*A long pause. He does not look at the badge.*"
      next: seren_say_name_2

    seren_say_name_2:
      text: "Seren."
      choices:
        - text: "(Stay)"
          next: seren_after_name

    seren_after_name:
      text: "I haven't said it to anyone. In forty years. Not for any reason that wasn't alone."
      choices:
        - text: "I know."
          next: seren_after_name_2

    seren_after_name_2:
      text: "*He touches the badge once, then drops his hand.* \"She'd be glad you came. She always did want this done properly.\""
      choices:
        - text: "(Leave him to his watch)"
          action: ["complete_quest", "side_brennan"]
          next: null

    # ---- grove_landing dialogue nodes ----

    landing_brennan:
      show_if: { quest_active: grove_landing }
      text: |
        He stands at the edge of the thinning, one hand on his blade hilt. Not for defense. For steadiness. Above him, the membrane flickers in long, slow pulses. Through the gaps: darkness. Points of light.
      choices:
        - text: "What do you see?"
          next: landing_brennan_2

    landing_brennan_2:
      text: |
        "Stars. And something else. A surface. Grey, flat, going on forever." He does not take his eyes off it. "I have spent my whole life patrolling a wall I could not see. Now it is disappearing."
      choices:
        - text: "Are you ready?"
          next: landing_brennan_3
        - text: "We will need you out there."
          next: landing_brennan_3b

    landing_brennan_3:
      text: |
        He is quiet for a moment.

        "No. But I was not ready for any of this. I was not ready when the blight started. I was not ready when Maren told us the truth." He adjusts his grip on the blade. "Ready has not mattered for a while now. I will be where I need to be."
      choices:
        - text: "(Nod)"
          next: null

    landing_brennan_3b:
      text: |
        "Out there." He looks north, through a gap in the membrane where sky should be and is not. "I have been protecting a boundary my whole life. Now it is going to be a frontier."

        A pause. The practical mind, already working.

        "Wider patrols. I will need to talk to Rendell about the shifts."
      choices:
        - text: "(Nod)"
          next: null

    # ---- grove_sacrifice phase dialogue ----

    brennan_sacrifice_check:
      text: "I've been here before. Not the same — but the shape of it."
      choices:
        - text: "Seren."
          next: brennan_sacrifice_seren

    brennan_sacrifice_seren:
      text: "She chose rest. Thera's choosing something else. I keep reminding myself of that."
      choices:
        - text: "Is it helping?"
          next: brennan_sacrifice_helping

    brennan_sacrifice_helping:
      text: "Slowly."
      choices:
        - text: "She'll be here. Not gone — present."
          next: brennan_sacrifice_present
        - text: "(Stay with him)"
          next: brennan_sacrifice_present

    brennan_sacrifice_present:
      text: "Seren used to talk about Lira that way. 'She's not gone — just bigger.' I couldn't understand it then."
      choices:
        - text: "Do you understand it now?"
          next: brennan_sacrifice_now

    brennan_sacrifice_now:
      text: "I understand it differently. Seren chose rest because she had nothing left. Thera's choosing remaining because she still has everything. That's the part I couldn't see until now."
      choices:
        - text: "(Leave him to his watch)"
          next: null

    # ---- post-landing dialogue (show after grove_epilogue complete) ----

    post_landing_brennan:
      text: "The post is still here. *He gestures at the monitoring equipment.* Still works."
      choices:
        - text: "What are you watching now?"
          next: post_landing_brennan_2

    post_landing_brennan_2:
      text: "Weather. Wind patterns. What the planet does at dawn versus midday. The membrane is gone but the habit is thirty years deep."
      choices:
        - text: "You don't have to keep watching."
          next: post_landing_brennan_3

    post_landing_brennan_3:
      text: "I know. *He keeps watching anyway.* I left a note for whoever comes next. 'I was right. It was worth watching.' Beneath it, in older ink — 'She was here.'"
      choices:
        - text: "Seren."
          next: post_landing_brennan_4
        - text: "(Leave him to it)"
          next: null

    post_landing_brennan_4:
      text: "She stood here once. Early years. Said the edge felt like a door. I thought she was being poetic."
      choices:
        - text: "She wasn't."
          next: post_landing_brennan_5

    post_landing_brennan_5:
      text: "No. *Long pause.* She never was."
      choices:
        - text: "(Leave him)"
          next: null

tags: [neutral, watcher, grove]

emotes:
  idle: "*scans the treeline with practiced stillness*"
  patrol: "*walks the path's edge, unhurried*"
  dawn: "*stands at the boundary, watching the light change*"
  night: "*moves quietly through the dark*"
  thinking: "*stands motionless at the post, looking inward rather than outward*"
  checking: "*walks the boundary markers, touching each one briefly*"

traits:
  - script: patrol
    config:
      rooms: [watchers_post, brennan_path, north_understory, thinning_approach, thinning_patrol_route]
      interval: 120
  - script: ambient_emitter
    config:
      interval: 100
      emotes: [idle, patrol, dawn, thinking, checking]
