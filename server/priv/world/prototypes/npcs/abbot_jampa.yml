key: abbot_jampa
short_desc: "Abbot Jampa"
long_desc: "An elderly monk with kind eyes stands here, radiating calm authority."
type: npc
parent: base_npc
keywords:
  - abbot
  - jampa
  - monk
  - elder
primary_keyword: monk
extra_desc: |
  An elderly monk with kind eyes and weathered hands, his saffron
  robes worn thin by decades of service. Despite the crisis, he
  radiates calm authority, his presence itself a teaching.
tags:
  - friendly
  - quest_giver
  - monastery

# Personality emotes for behavior events
emotes:
  waking_up: "*rises slowly from meditation* The dawn brings new hope."
  going_to_sleep: "*settles into stillness* May wisdom visit our dreams."
  meditation_start: "*closes his eyes, hands forming a mudra*"
  greeting: "May the dharma guide your path, traveler."
  blessing: "*traces a sacred symbol in the air* Go with wisdom."
  concerned: "*furrows his brow, prayer beads moving faster*"

# Behaviors - abbot rises early for morning prayers
behaviors:
  - script: day_night_schedule
    config:
      wake_at: dawn
      sleep_at: evening

components:
  ambient_actions:
    messages:
      - "The Abbot fingers his prayer beads, lips moving in silent recitation."
      - "Abbot Jampa gazes toward the meditation hall with concern in his eyes."
      - "The Abbot adjusts his saffron robes, lost in thought."
      - "A soft sigh escapes the Abbot as he watches the prayer flags flutter."
      - "The Abbot's eyes close briefly in meditation, then open again."
    interval_min: 30
    interval_max: 60
    chance: 0.5
  combatant:
    health:
      current: 150
      max: 150
    stats:
      str: 8
      dex: 8
      sta: 12
    level: 5
  dialogue_tree:
    # ==========================================================================
    # BEST PRACTICE: Quest offers should be upfront in the first dialogue node.
    # Players can accept immediately or ask for more context.
    # Pattern: [Accept Quest] first, then [Ask Questions], then [Decline/Leave]
    # ==========================================================================

    # Player sent by Pema - offer main quest upfront
    start_pema_sent:
      text: "Ah! Young Pema sent you. I am Jampa, Abbot of this monastery. Master Tenzin has been trapped in deep meditation for seven days - his spirit wanders in the realm between. Will you help us find clues in his meditation journal?"
      show_if:
        quest_active: "intro_find_temple"
      action: ["complete_quest", "intro_find_temple"]
      choices:
        - text: "[Accept Quest] I'll find the journal."
          next: "quest_accepted"
          action: ["accept_quest", "main_sleeping_master"]
        - text: "Tell me more about what happened."
          next: "crisis_detail"
        - text: "I need to think about this."
          next: null

    # Player hasn't met Pema yet
    start:
      text: "Ah, traveler. The mountain has brought you to us in our hour of need. I am Jampa, Abbot of this monastery. Master Tenzin has been trapped in deep meditation for seven days. Will you help us find clues in his meditation journal?"
      show_if:
        quest_not_active: "intro_find_temple"
        quest_not_active: "main_sleeping_master"
      choices:
        - text: "[Accept Quest] I'll help you."
          next: "quest_accepted"
          action: ["accept_quest", "main_sleeping_master"]
        - text: "Tell me more about what happened."
          next: "crisis_detail"
        - text: "I'm just passing through."
          next: "passing"

    # More context for curious players
    crisis_detail:
      text: "Tenzin entered meditation willingly, but he has not returned. His body breathes, but his spirit is trapped. The Three Poisons - attachment, aversion, and ignorance - have taken form in the caves below. Mara, the demon of delusion, holds him captive."
      choices:
        - text: "[Accept Quest] I'll find his journal and help."
          next: "quest_accepted"
          action: ["accept_quest", "main_sleeping_master"]
        - text: "How do I defeat these demons?"
          next: "defeat_advice"
        - text: "This seems beyond me."
          next: "encouragement"

    defeat_advice:
      text: "Each poison has an antidote. Attachment is overcome by non-attachment. Aversion by compassion. Ignorance by wisdom. But first, we need Tenzin's journal - it may hold clues to what he faced."
      choices:
        - text: "[Accept Quest] I'll find the journal."
          next: "quest_accepted"
          action: ["accept_quest", "main_sleeping_master"]
        - text: "Where is his cell?"
          next: "cell_location"

    encouragement:
      text: "The mountain chose you. Whether you came seeking adventure, wisdom, or merely shelter - you were brought here for a reason. Will you help us?"
      choices:
        - text: "[Accept Quest] I'll do what I can."
          next: "quest_accepted"
          action: ["accept_quest", "main_sleeping_master"]
        - text: "I need to think about this."
          next: null

    passing:
      text: "Perhaps. But the mountain does not bring travelers here by accident. Master Tenzin is trapped between worlds. His journal may hold the key to saving him. Will you help?"
      choices:
        - text: "[Accept Quest] I'll help you."
          next: "quest_accepted"
          action: ["accept_quest", "main_sleeping_master"]
        - text: "I should go."
          next: null

    cell_location:
      text: "Go through the courtyard and find the guest hall to the north. Tenzin's meditation cell is in the quiet corner. Young Pema keeps vigil there."
      choices:
        - text: "[Accept Quest] I'll investigate."
          next: "quest_accepted"
          action: ["accept_quest", "main_sleeping_master"]
        - text: "I need to prepare first."
          next: null

    quest_accepted:
      text: "Thank you, traveler. The journal is in Tenzin's meditation cell, in the guest hall beyond the courtyard. May the wisdom of the dharma guide your steps."
      choices:
        - text: "I'll return with answers."
          next: null

    # Quest active - reminder
    start_active:
      text: "You have returned. Have you found Tenzin's meditation journal? His cell is in the guest hall, beyond the courtyard."
      show_if:
        quest_active: "main_sleeping_master"
      choices:
        - text: "I'm still searching."
          next: null
        - text: "Where is his cell again?"
          next: "cell_location_reminder"

    cell_location_reminder:
      text: "Go through the courtyard and find the guest hall to the north. Tenzin's meditation cell is in the quiet corner. Young Pema keeps vigil there."
      choices:
        - text: "I'll continue searching."
          next: null

    # Journal found - turn in and get next quest upfront
    start_ready_to_turn_in:
      show_if:
        quest_complete: "main_sleeping_master"
      text: "The journal... you found it! [He reads quickly.] So he truly went to face Mara alone. Take this key to the caves beyond the cemetery. Will you brave the Three Trials to save him?"
      action: ["complete_quest", "main_sleeping_master"]
      choices:
        - text: "[Accept Quest] I will bring him back."
          action: ["accept_quest", "main_three_trials"]
          next: "trials_accepted"
        - text: "What are the Three Trials?"
          next: "trials_info"

    trials_info:
      text: "Three chambers where the Three Poisons manifest: Raga Mara (attachment), Dvesha Mara (aversion), and Moha Mara (ignorance). Defeat all three to reach the Heart Cave where Tenzin is held."
      choices:
        - text: "[Accept Quest] I'll face them."
          action: ["accept_quest", "main_three_trials"]
          next: "trials_accepted"
        - text: "I need to prepare first."
          next: null

    trials_accepted:
      text: "Take young Pema with you - she knows Tenzin better than anyone. Together, perhaps you can succeed where he could not. [He presses a small butter lamp into your hands.] Take this lamp of wisdom. When darkness threatens to overwhelm you, its light will guide your way. The cave entrance is beyond the cemetery to the east."
      action: ["give_item", "lamp_of_wisdom"]
      choices:
        - text: "We won't fail you."
          next: null

    # Three trials complete - offer liberation quest upfront
    start_three_trials_complete:
      show_if:
        quest_complete: "main_three_trials"
      text: "I sense it... the Three Poisons have been overcome! The seals are broken. Go to the Heart Cave where Mara holds Tenzin's spirit. Will you face the Deceiver himself?"
      action: ["complete_quest", "main_three_trials"]
      choices:
        - text: "[Accept Quest] I will free him."
          action: ["accept_quest", "main_liberation"]
          next: "liberation_accepted"
        - text: "What will I find there?"
          next: "mara_info"

    mara_info:
      text: "Mara the Deceiver holds Tenzin's spirit captive. But remember - Mara is not truly external. He is the shadow within. Face him with clarity, and you will prevail."
      choices:
        - text: "[Accept Quest] I'm ready."
          action: ["accept_quest", "main_liberation"]
          next: "liberation_accepted"
        - text: "I need to prepare first."
          next: null

    liberation_accepted:
      text: "Beyond the three trial chambers lies the Heart Cave. With the Three Poisons defeated, Mara's power wanes. Trust in yourself. Free our Master."
      choices:
        - text: "I am ready."
          next: null

    # After main quest complete
    start_completed:
      show_if:
        completed_quest: "main_liberation"
      text: "You have done what none other could. Tenzin's spirit is free. The monastery owes you a debt we can never repay. Rest here as long as you need."
      choices:
        - text: "Are there other ways I can help?"
          next: "other_quests"
        - text: "I should continue my journey."
          next: null

    other_quests:
      text: "The hungry ghosts still haunt the cemetery - spirits trapped by their own cravings. And the village below has its own troubles. A hero is always needed somewhere."
      choices:
        - text: "Tell me about the ghosts."
          next: "ghosts"
        - text: "Thank you for your wisdom."
          next: null

    # Side quest: Restless Spirits - offer upfront
    ghosts:
      text: "The hungry ghosts haunt the cemetery - spirits trapped between worlds by their own cravings. Violence only feeds their hunger. Will you help release them through compassion?"
      show_if:
        quest_not_active: "side_restless_spirits"
      choices:
        - text: "[Accept Quest] I'll help the spirits find peace."
          next: "ghosts_accepted"
          action: ["accept_quest", "side_restless_spirits"]
        - text: "How do I release them?"
          next: "ghosts_solution"
        - text: "That sounds difficult."
          next: null

    ghosts_accepted:
      text: "Be careful. The hungry ghosts are pitiable, not evil. Elder Drolma keeps offering rice in the dining hall. Take some and offer it freely. When the ghosts see generosity, they may find peace."
      choices:
        - text: "I understand."
          next: null

    ghosts_solution:
      text: "Elder Drolma keeps offering rice in the dining hall. Take some to the cemetery and offer it freely. When the ghosts see generosity where they expected fear, they may find peace."
      choices:
        - text: "[Accept Quest] I'll try that approach."
          next: null
          action: ["accept_quest", "side_restless_spirits"]
        - text: "I'll consider it."
          next: null

    forge_blessing:
      text: "The forge blessing? Yes, I can provide such a thing. [He writes carefully on a scroll.] Take this to Blacksmith Tashi. The mantras here will purify his work."
      show_if:
        quest_active: "side_the_forge_blessing"
      choices:
        - text: "Thank you, Abbot."
          next: null
          action: ["set_flag", "forge_blessing_received"]

    # Compassion Mantra Training
    teach_mantra:
      text: "You seek the Compassion Mantra? Om Mani Padme Hum - the jewel in the lotus. It dissolves the bonds of attachment by transforming grasping into generosity. When you face Raga Mara, this mantra will weaken his hold."
      choices:
        - text: "Teach me the Compassion Mantra. (1 point per level)"
          next: "learn_compassion"
          action: ["learn_skill", "mantra_compassion", 1]
        - text: "What other mantras exist?"
          next: "mantra_info"
        - text: "Thank you, Abbot."
          next: null
    learn_compassion:
      text: "[The Abbot's voice becomes a chant.] Om Mani Padme Hum. Feel compassion flow through you - for all beings, even those who would harm you. When attachment grasps, offer this instead. The demon of desire cannot hold what is freely given."
      choices:
        - text: "Tell me of other mantras."
          next: "mantra_info"
        - text: "Thank you for this teaching."
          next: null
    mantra_info:
      text: "Three mantras guard against the Three Poisons. I teach Compassion for attachment. Lama Yeshe at the waterfall teaches Protection against harmful spirits. And the hermit Milarepa teaches Wisdom for piercing confusion."
      choices:
        - text: "Teach me Compassion then."
          next: "learn_compassion"
          action: ["learn_skill", "mantra_compassion", 1]
        - text: "I will seek the others."
          next: null
  teacher:
    skills:
      - mantra_compassion
    mantras:
      - om_mani_padme_hum
  quests:
    - main_sleeping_master
    - side_restless_spirits
  gives_items:
    - lamp_of_wisdom
    - cave_entrance_key
