key: young_monk
type: npc
parent: base_npc

short_desc: "Young Monk"
long_desc: "A teenage monk sweeps the stones with careful, meditative strokes."
extra_desc: |
  A gangly youth still growing into his robes, concentration furrowing
  his brow as he sweeps. His shaved head gleams in the light, and his
  movements have the self-conscious precision of one still learning
  the rhythms of monastic life. Despite his duties, his eyes often
  wander to the horizon.
keywords:
  - monk
  - young
  - novice
  - sweeper
  - boy
primary_keyword: monk
mood: distracted

tags:
  - friendly
  - monastery
  - atmosphere
  - novice

# Behaviors - follows monastic schedule, early rise for chores
traits:
  - script: day_night_schedule
    config:
      wake_at: dawn
      sleep_at: dusk

# Personality emotes
emotes:
  waking_up: "*stumbles out bleary-eyed, fumbling for his broom*"
  going_to_sleep: "*yawns hugely and shuffles toward the dormitory*"
  greeting: "*startles, then bows hastily* O-oh! Greetings, traveler!"
  sweeping: "*sweeps with meditative concentration, or tries to*"
  distracted: "*glances toward the mountains, then guiltily resumes work*"
  curious: "*peers at you with barely concealed curiosity*"

components:
  ambient_actions:
    messages:
      - "The young monk sweeps with careful, methodical strokes."
      - "The novice pauses to wipe sweat from his brow."
      - "The young monk glances toward the mountains, then guiltily resumes sweeping."
      - "The novice murmurs a mantra under his breath as he works."
      - "The young monk stretches his back, wincing slightly."
      - "A leaf escapes the young monk's broom; he chases it with quiet determination."
      - "The novice hums a sutra, slightly off-key."
      - "The young monk yawns, then looks around guiltily."
    interval_min: 30
    interval_max: 50
    chance: 0.5
  combatant:
    health:
      current: 35
      max: 35
    stats:
      str: 8
      dex: 9
      sta: 7
    level: 1
  dialogue_tree:
    start:
      text: "Oh! You startled me. Greetings, traveler. I should be focusing on my sweeping..."
      choices:
        - text: "Tell me about your sweeping."
          next: "sweeping"
        - text: "What do you know about the caves?"
          next: "caves"
        - text: "What is life like here?"
          next: "life"
        - text: "What do you hope for your future?"
          next: "future"
        - text: "I'll leave you to your work."
          next: null
    sweeping:
      text: "Master Lobsang says sweeping is meditation - each stroke should be mindful. But my mind keeps wandering to the stories of the caves. Is that wrong?"
      choices:
        - text: "What stories of the caves?"
          next: "caves"
        - text: "Tell me about life here."
          next: "life"
        - text: "I'll leave you to your work."
          next: null
    caves:
      text: "The older monks won't speak of what's down there. But I've heard whispers. Demons made of desire and anger and confusion. I wonder what they look like..."
      choices:
        - text: "Have you had strange dreams?"
          next: "dreams"
        - text: "What do you hope for your future?"
          next: "future"
        - text: "I'll leave you to your work."
          next: null
    life:
      text: "I came here when I was seven. My parents couldn't feed all of us. Sometimes I wonder about my brothers, my sisters. But this is my home now."
      choices:
        - text: "What do you hope for?"
          next: "future"
        - text: "What about the caves?"
          next: "caves"
        - text: "I'll leave you to your work."
          next: null
    future:
      text: "One day I'll be a full monk like Master Chen. Maybe I'll learn the warrior arts. Or maybe I'll become a meditation master like Lama Tenzin. If... if he wakes up."
      choices:
        - text: "Have you had strange dreams?"
          next: "dreams"
        - text: "Tell me about your sweeping."
          next: "sweeping"
        - text: "I'll leave you to your work."
          next: null
    dreams:
      text: "I've been having strange dreams lately. A voice calling from beneath the earth. The other novices too. We don't talk about it."
      choices:
        - text: "Tell me more about the caves."
          next: "caves"
        - text: "What is life like here?"
          next: "life"
        - text: "I'll leave you to your work."
          next: null
