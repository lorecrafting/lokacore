key: hermit_milarepa
short_desc: "Hermit Milarepa"
long_desc: "A wild-haired yogi squats near a smoky fire, humming strange melodies."
type: npc
parent: base_npc
keywords:
  - hermit
  - milarepa
  - yogi
primary_keyword: yogi
extra_desc: |
  A wild-haired yogi squats near a smoky fire, his body thin as
  a reed but vibrating with strange energy. He hums a melody that
  bends the air. His eyes, when they find you, see everything.
tags:
  - friendly
  - quest_giver
  - eccentric
components:
  ambient_actions:
    messages:
      - "Milarepa hums a strange melody that bends the air around him."
      - "The hermit stares into the fire, seeing visions only he can perceive."
      - "Milarepa's fingers move as if playing an invisible instrument."
      - "The yogi cackles softly at some private joke."
      - "Milarepa adds a twisted branch to his smoky fire."
      - "The hermit's eyes roll skyward, lost in inner contemplation."
    interval_min: 25
    interval_max: 50
    chance: 0.6
  combatant:
    health:
      current: 60
      max: 60
    stats:
      str: 4
      dex: 12
      sta: 8
    level: 6
  dialogue_tree:
    # ==========================================================================
    # BEST PRACTICE: Quest offers should be upfront in the first dialogue node.
    # ==========================================================================

    # Default start - quest offer upfront
    start:
      text: "Ha! Your steps were destined for this place! I need seven white river stones from the waterfall shrine for a ceremony. Fetch them, and I will teach you a song that makes the shadows dance away!"
      show_if:
        quest_not_active: "side_hermits_song"
      choices:
        - text: "[Accept Quest] I'll find your stones."
          next: "quest_accepted"
          action: ["accept_quest", "side_hermits_song"]
        - text: "Where do I find these stones?"
          next: "stone_directions"
        - text: "I seek wisdom first."
          next: "wisdom"
        - text: "I should go."
          next: null
    # Start when quest is active - reminder
    start_active:
      text: "Ha! You return empty-handed! Where are my white river stones? The waterfall shrine, remember? Seven stones for the ceremony!"
      show_if:
        quest_active: "side_hermits_song"
      choices:
        - text: "I'm still looking for them."
          next: null
        - text: "Where do I find the stones again?"
          next: "stone_directions"
        - text: "Tell me more wisdom while I'm here."
          next: "wisdom"
    # Start when quest ready to turn in
    start_ready_to_turn_in:
      text: "[His eyes widen.] The stones! Seven white stones from the waterfall! You found them! Quick, quick, show me!"
      show_if:
        quest_complete: "side_hermits_song"
      choices:
        - text: "[Complete Quest] Here are your stones, hermit."
          next: "turn_in"
    # Start after quest completed
    start_completed:
      completed_quest: "side_hermits_song"
      text: "Ha! My friend returns! The one who brought me the sacred stones for my ceremony. What wisdom do you seek today?"
      choices:
        - text: "Teach me another song."
          next: "post_quest_song"
        - text: "Share more wisdom with me."
          next: "wisdom"
        - text: "I should go."
          next: null
    # Turn in node
    turn_in:
      text: "[He arranges the stones in a careful pattern, humming.] Ahhhh! Perfect! Seven truths, seven songs. As promised, I will teach you one. Listen well... [He hums a haunting melody that seems to push back the shadows.] This song wards against fear. Sing it when the darkness presses close."
      action: ["complete_quest", "side_hermits_song"]
      choices:
        - text: "Thank you, Milarepa."
          next: null
    # Stone directions
    stone_directions:
      text: "The waterfall shrine! Where the water cascades down the mountainside. White river stones gleam in the sacred pool. Seven of them, smooth and round. The water knows which ones to give."
      choices:
        - text: "I'll find them."
          next: null
    # Post-quest song teaching
    post_quest_song:
      text: "[He hums thoughtfully.] You have earned one song already. Perhaps one day, when you have walked further on your path, I will teach you another. The mountain knows when you are ready."
      choices:
        - text: "I understand."
          next: null
    riddle:
      text: "The door with no hinges! The door with no lock! The door that opens when you stop trying to open it! Ha! [He cackles and stirs his fire.]"
      choices:
        - text: "I don't understand."
          next: "wisdom"
        - text: "Teach me, then."
          next: "quest"
    wisdom:
      text: "Empty your cup before you fill it. Give away everything and you will have everything. Simple, yes? [He grins.] Not simple at all."
      choices:
        - text: "Can you teach me more?"
          next: "quest"
        - text: "I have much to learn."
          next: null
    song:
      text: "I sing the hundred thousand songs. Each one opens a different door. Which door do you seek? [His fingers move as if playing an invisible instrument.]"
      choices:
        - text: "A door to power."
          next: "power_warning"
        - text: "A door to peace."
          next: "peace_song"
    power_warning:
      text: "[His eyes flash.] Power? Bah! Power is a chain disguised as a crown. Seek liberation, not dominion. Come back when you understand."
      choices:
        - text: "I'm sorry. What should I seek?"
          next: "quest"
        - text: "I'll think on that."
          next: null
    peace_song:
      text: "[He hums a strange melody.] Peace comes from the stone, not the water. The water shapes, but the stone endures. Speaking of which... I need stones."
      choices:
        - text: "What stones?"
          next: "quest"
        - text: "That was beautiful."
          next: null
    quest:
      text: "Bring me seven white river stones! I need them for a ceremony. The waterfall shrine has the purest ones. [His face grows wistful.] The water shapes them into perfect truths. Perhaps you could fetch some?"
      show_if:
        quest_not_active: "side_hermits_song"
      choices:
        - text: "[Accept Quest] I'll find you the stones."
          next: "quest_accepted"
          action: ["accept_quest", "side_hermits_song"]
        - text: "I have other matters to attend to."
          next: null
    quest_accepted:
      text: "Ha! You are generous. Perhaps I will teach you a song when you return. One of the good ones. One that makes the shadows dance away."
      choices:
        - text: "I'll return soon."
          next: null

    # Wisdom Mantra Training
    teach_wisdom:
      text: "[His eyes suddenly focus with piercing clarity.] The Wisdom Mantra! Gate Gate Paragate Parasamgate Bodhi Svaha! Gone, gone, gone beyond, gone completely beyond - awake! This mantra pierces confusion like sunlight through fog."
      choices:
        - text: "Teach me the Wisdom Mantra. (1 point per level)"
          next: "learn_wisdom"
          action: ["learn_skill", "mantra_wisdom", 1]
        - text: "What does it mean?"
          next: "wisdom_meaning"
        - text: "I'm not ready."
          next: null
    learn_wisdom:
      text: "[Milarepa's voice becomes a song.] Gate Gate Paragate Parasamgate Bodhi Svaha! When confusion clouds your sight, when Moha Mara shows you lies, when you cannot tell real from illusion - sing this! The truth will reveal itself. Ha! [He cackles with delight.] Now you are dangerous!"
      choices:
        - text: "What other mantras exist?"
          next: "other_mantras_info"
        - text: "Thank you, teacher."
          next: null
    wisdom_meaning:
      text: "Gone beyond illusion! Gone beyond the veil of maya! Gone to the other shore where confusion cannot reach! This is the Heart Sutra condensed to its essence. Moha Mara cannot abide its light."
      choices:
        - text: "Teach me then."
          next: "learn_wisdom"
          action: ["learn_skill", "mantra_wisdom", 1]
        - text: "I need to contemplate this."
          next: null
    other_mantras_info:
      text: "Ha! Three mantras for three poisons! I teach Wisdom for confusion. The Abbot at the temple teaches Compassion for attachment. The ethereal Lama Yeshe at the waterfall teaches Protection. Collect them all! [He cackles.] Like picking flowers!"
      choices:
        - text: "Teach me Wisdom first."
          next: "learn_wisdom"
          action: ["learn_skill", "mantra_wisdom", 1]
        - text: "I will seek all three."
          next: null
  teacher:
    skills:
      - mantra_wisdom
  quests:
    - side_hermits_song
