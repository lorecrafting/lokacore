key: working_farmer
type: npc
parent: base_npc

short_desc: "Working Farmer"
long_desc: "A weather-worn farmer toils in the fields, bent to the eternal task."
extra_desc: |
  A figure bent by years of labor but unbroken in spirit. The farmer's
  clothes are patched and sun-bleached, hands calloused from a lifetime
  of coaxing life from stubborn mountain soil. Despite the hard work,
  there's a quiet contentment in the lined face.
keywords:
  - farmer
  - worker
  - peasant
  - laborer
primary_keyword: farmer
mood: working

tags:
  - friendly
  - village
  - atmosphere
  - worker

# Behaviors - hard working farmer rises early, sleeps when sun sets
behaviors:
  - script: day_night_schedule
    config:
      wake_at: dawn
      sleep_at: dusk

# Personality emotes
emotes:
  waking_up: "*stretches work-worn muscles and surveys the fields*"
  going_to_sleep: "*sets down the hoe and wipes tired brow* Another day done."
  greeting: "*pauses from work, leaning on hoe* Eh? Need something?"
  working: "*bends to the task, back curved by years of toil*"
  resting: "*takes a long drink of water, eyes never leaving the crops*"
  praying: "*murmurs thanks to the mountain spirits for the harvest*"

components:
  ambient_actions:
    messages:
      - "The farmer wipes sweat from their brow, surveying the day's work."
      - "The farmer bends to pull a stubborn weed from the barley."
      - "The farmer's hoe bites into the soil with a rhythmic thunk."
      - "The farmer pauses to drink from a water skin."
      - "The farmer stretches their back with a soft groan."
      - "The farmer checks the irrigation channels, adjusting a stone."
      - "The farmer murmurs a blessing over the growing crops."
      - "The farmer shields their eyes, checking the sky for rain."
    interval_min: 25
    interval_max: 40
    chance: 0.6
  combatant:
    health:
      current: 55
      max: 55
    stats:
      str: 11
      dex: 8
      sta: 12
    level: 2
  dialogue_tree:
    start:
      text: "Eh? Oh, just a traveler. Don't mind me - the barley won't harvest itself."
      choices:
        - text: "How is the farming life?"
          next: "work"
        - text: "What do you think of the monastery?"
          next: "monastery"
        - text: "Any advice for a traveler?"
          next: "advice"
        - text: "How are the crops?"
          next: "crops"
        - text: "I'll let you work."
          next: null
    work:
      text: "Same as yesterday, same as tomorrow. Plant, tend, harvest, repeat. It's an honest life. The mountain provides if you treat her right."
      choices:
        - text: "Tell me about the monastery."
          next: "monastery"
        - text: "How are the crops this season?"
          next: "crops"
        - text: "I'll let you work."
          next: null
    monastery:
      text: "We owe everything to the monks. Their blessings keep the weather kind and the pests away. Without Lama Tenzin's spring blessing... I don't know what we'll do."
      choices:
        - text: "Any advice for a traveler?"
          next: "advice"
        - text: "How are the crops?"
          next: "crops"
        - text: "I'll let you work."
          next: null
    advice:
      text: "You look like you're heading for trouble. Take an old farmer's advice: some things aren't worth the harvest. Know when to plant and when to let the field lie fallow."
      choices:
        - text: "Tell me about your work."
          next: "work"
        - text: "How are the crops?"
          next: "crops"
        - text: "I'll let you work."
          next: null
    crops:
      text: "Good season, considering. The barley's strong, the radishes are coming in. Could use more rain, but we take what the sky gives."
      choices:
        - text: "Tell me about your work."
          next: "work"
        - text: "What about the monastery?"
          next: "monastery"
        - text: "I'll let you work."
          next: null
