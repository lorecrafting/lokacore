key: temple_cat
type: npc
parent: base_npc

short_desc: "Temple Cat"
long_desc: "A sleek grey cat with knowing amber eyes lounges nearby."
extra_desc: |
  A temple cat of ancient lineage, her grey fur sleek and immaculate despite
  her wandering ways. Her amber eyes hold an unsettling intelligence, as if
  she understands far more than any cat should. The monks say she has lived
  here longer than anyone can remember.

keywords:
  - cat
  - feline
  - temple
  - grey
primary_keyword: cat
mood: contemplative

tags:
  - friendly
  - animal
  - atmosphere
  - sacred

# Behaviors - cats sleep during the day, more active at dusk
traits:
  - script: day_night_schedule
    config:
      wake_at: dusk
      sleep_at: morning
  - script: wander
    config:
      rooms: [main_courtyard, temple, meditation_hall, dining_hall, monastery_gate]
      interval: 300
      stay_probability: 0.75

# Personality emotes
emotes:
  waking_up: "*stretches luxuriously, claws extending, then surveys her domain*"
  going_to_sleep: "*curls into a perfect circle in a patch of sunlight*"
  greeting: "*regards you with ancient, knowing eyes*"
  purring: "*a deep rumbling purr emanates from the grey cat*"
  hunting: "*ears flatten, body low, stalking something invisible*"
  disdainful: "*turns away with regal indifference*"

components:
  ambient_actions:
    messages:
      - "The temple cat stretches luxuriously in a patch of sunlight."
      - "The grey cat grooms her paw with meticulous care."
      - "The cat's ears swivel, tracking some sound only she can hear."
      - "The temple cat curls into a tight ball, tucking her nose under her tail."
      - "The cat yawns, revealing tiny sharp teeth."
      - "The grey cat blinks slowly at you - a feline gesture of trust."
    interval_min: 30
    interval_max: 60
    chance: 0.5
  combatant:
    health:
      current: 15
      max: 15
    stats:
      str: 3
      dex: 18
      sta: 6
    level: 1
  dialogue_tree:
    start:
      text: "*The temple cat regards you with ancient, knowing eyes, then looks away with regal disinterest.*"
      choices:
        - text: "Pet the cat."
          next: "pet"
        - text: "Offer something."
          next: "offer"
        - text: "Leave the cat alone."
          next: null
    pet:
      text: "*The cat tolerates your touch for exactly three strokes before slipping away, her grey form disappearing around a corner.*"
      choices:
        - text: "Good kitty."
          next: null
    offer:
      text: "*The cat sniffs the air, then turns her head away dismissively. Clearly, whatever you have is beneath her standards.*"
      choices:
        - text: "Fine, be that way."
          next: null
