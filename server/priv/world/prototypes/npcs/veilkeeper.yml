key: veilkeeper
type: npc
parent: base_npc
short_desc: "The Veilkeeper"
long_desc: |
    This ethereal being appears more suggestion than substance, a translucent figure draped in robes that seem woven from moonbeams and shadow. Where a face should be, only shifting patterns of silver and blue light swirl in constant motion. The Veilkeeper's form wavers like heat-shimmer, sometimes solid enough to cast shadows, other times barely visible against the grove's dappled light. Ancient power radiates from this guardian—patient, watchful, and utterly alien in its timeless purpose.
extra_desc: |
    The Veilkeeper's robes trail into wisps of luminescent mist that pool at its feet, never quite touching the ground. Occasionally, fragments of other places—crystalline caverns, moonlit gardens, storm-wracked peaks—flicker within the folds of its garments like windows into distant realms. The air around it tastes of ozone and carries the faintest scent of night-blooming jasmine.
keywords: [veilkeeper, guardian, ethereal, figure]
primary_keyword: veilkeeper
mood: neutral
tags: [quest_giver, guardian, portal]
emotes:
  idle_1: "*shifts like smoke caught between two breezes, its form momentarily revealing glimpses of star-filled void beneath the robes*"
  idle_2: "*raises one translucent hand and traces a sigil in the air that burns silver for a heartbeat before dissolving*"
  idle_3: "*turns its featureless face toward the portal arch as if listening to something only it can hear*"
  idle_4: "*the patterns of light where its face should be slow and deepen to indigo, as though lost in ancient memory*"
  notice_player: "*the swirling lights quicken with sudden interest, and the Veilkeeper's form solidifies slightly*"
  portal_pulse: "*the archway behind it flares with sympathetic light, and for an instant the portal's shimmer reveals a vast crystal cavern beyond*"
  warning: "*its form darkens and grows denser, shadows pooling around it like a gathering storm*"
components:
  combatant:
    level: 10
  npc_data:
    level: 10
    flags:
      immortal: true
      no_attack: true
  dialogue_tree:
    # =========================================================================
    # FIRST ENCOUNTER - Player has never spoken to the Veilkeeper
    # =========================================================================
    start:
      text: |
          *The air thickens as you approach, and the Veilkeeper's form coalesces from scattered motes of light. When it speaks, the words arrive not through sound but as impressions pressed directly into your thoughts.*

          You carry the scent of the waking world... heavy with purpose, tangled with questions. Few find this grove, and fewer still can perceive me. Tell me, walker between moments—what draws you to the threshold?
      show_if:
        flag_not_set: met_veilkeeper
      choices:
        - text: "What are you? This place feels... between places."
          next: what_are_you
          action: ["set_flag", "met_veilkeeper"]
        - text: "I saw the portal arch glowing. I had to investigate."
          next: curious_arrival
          action: ["set_flag", "met_veilkeeper"]
        - text: "I'm looking for a way through. Can this portal take me somewhere?"
          next: direct_approach
          action: ["set_flag", "met_veilkeeper"]
        - text: "*Say nothing. Simply observe.*"
          next: silent_observation
          action: ["set_flag", "met_veilkeeper"]

    # =========================================================================
    # FIRST ENCOUNTER BRANCHES
    # =========================================================================
    what_are_you:
      text: |
          *Its form ripples with what might be amusement—or surprise.*

          What am I. The question creatures of flesh always begin with, as though naming a thing grants power over it. I am the Veilkeeper. I tend the boundary between here and elsewhere. I have done so since before your kind learned to shape stone into shelter, since before the first fire cast the first shadow.

          But you did not truly ask what I am. You asked whether I am dangerous.
      choices:
        - text: "Are you?"
          next: am_i_dangerous
        - text: "No. I asked because I want to understand this place."
          next: understand_place
        - text: "I've faced dangerous things before. What matters is whether you're an ally."
          next: ally_question

    curious_arrival:
      text: |
          *The Veilkeeper tilts its head—a strangely human gesture from something so inhuman.*

          The arch calls to those it would consume, and to those it would serve. The difference lies not in the arch but in the one who answers. You heard the call and came seeking. That is... promising.

          This portal is one node in an ancient network. Pathways between places that should not connect. Between times that have forgotten each other. Most have fallen dark. But some—some still remember how to sing.
      choices:
        - text: "Who built the portal network?"
          next: who_built
        - text: "Can I use the portal?"
          next: can_i_use
        - text: "What do you mean, 'consume'?"
          next: consume_meaning

    direct_approach:
      text: |
          *The swirling light behind the Veilkeeper's face stills for a moment—then flares bright enough to cast your shadow three times.*

          Direct. Purposeful. These are qualities that serve a traveler well... and qualities that destroy the careless.

          Yes, this portal can take you elsewhere. To chambers of crystal where the earth's memory is stored. To groves that exist in the pause between one season and the next. To places that have no name because no tongue has ever spoken there.

          But a portal does not simply open. It must recognize you. And you, it.
      choices:
        - text: "How do I get recognized?"
          next: how_to_attune
        - text: "What happens if the portal doesn't recognize me?"
          next: unrecognized_fate
        - text: "I'm ready. What do I need to do?"
          next: ready_to_begin

    unrecognized_fate:
      text: |
          *The Veilkeeper's light dims to a cold, cautionary blue.*

          The portal is not a door. A door does not care who opens it. The portal... remembers. It tastes the resonance of everything that passes through, and if it finds that resonance incompatible...

          *A long pause.*

          The kindest outcome is rejection. The portal simply refuses to open, and you stand before a dead arch feeling foolish. The unkind outcome... the portal opens partway. You enter the between-space without a complete harmonic signature. And the between-space does not know what to do with an incomplete song.

          Pieces of you arrive at the destination. Other pieces... do not.
      choices:
        - text: "How do I make sure it recognizes me?"
          next: how_to_attune
        - text: "Has that happened to anyone?"
          next: scattered_ones
        - text: "I'll take my chances."
          next: consume_meaning

    silent_observation:
      text: |
          *Minutes pass. The Veilkeeper regards you with the patience of continental drift. Finally, the lights within its face brighten to warm amber.*

          You do not fill the silence with noise. That is rare. Most who come here are so stuffed with words they cannot hear the portal breathing.

          *It gestures toward the shimmering archway.*

          This arch is alive, after a fashion. It dreams of the places it once connected—crystal halls, moonlit gardens, the spaces between stars. It has been dreaming alone for a very long time.

          Perhaps it is ready for a new dreamer.
      choices:
        - text: "Tell me more about the portal's dreams."
          next: portal_dreams
        - text: "How can I help it dream?"
          next: help_dream
        - text: "*Continue to listen.*"
          next: continue_listening

    # =========================================================================
    # DEEP LORE BRANCHES
    # =========================================================================
    am_i_dangerous:
      text: |
          *A sound like distant thunder mixed with wind chimes.*

          To those who would tear the veil for profit or power—catastrophically so. To those who approach with honest curiosity and willing spirit—I am perhaps the most patient teacher you will ever find.

          The portal network was not built for conquest. It was built for understanding. The ancient ones who wove these pathways believed that wisdom required perspective, and perspective required travel between fundamentally different ways of being.
      choices:
        - text: "I want to understand. How do I begin?"
          next: how_to_attune
        - text: "Tell me about the ancient ones."
          next: ancient_ones

    understand_place:
      text: |
          *The Veilkeeper's form expands slightly, as though pleased.*

          Then I will tell you what you can comprehend. This grove sits at a convergence—a place where the skin of the world grows thin. The arch concentrates that thinness into a usable threshold. On the other side, the Crystal Sanctum serves as anchor and waypoint.

          Between them, the space is neither here nor there. It is potential. Pure, undirected possibility. That is what makes the portal network both wondrous and treacherous.
      choices:
        - text: "I'd like to cross through. What do I need?"
          next: how_to_attune
        - text: "What dangers lurk in that in-between space?"
          next: between_dangers

    ally_question:
      text: |
          *The shifting patterns slow, and for a moment you could almost swear you see something like a face beneath the light—ancient, tired, and kind.*

          Ally. Enemy. These are words for creatures that share a world. I exist in the margins of yours. But if you ask whether I wish you well...

          *It turns toward the portal, and its voice grows distant.*

          I have watched this arch for longer than your civilization has drawn breath. I have seen travelers come and go—the brave, the foolish, the desperate, the curious. I remember all of them. I wish you well the way a lighthouse wishes ships well. I stand here. I shine. Whether you navigate by my light or dash yourself upon the rocks is your choice.
      choices:
        - text: "I'll navigate carefully. Tell me about the portal."
          next: how_to_attune
        - text: "That's honest enough. I respect that."
          next: respect_honesty

    who_built:
      text: |
          *The Veilkeeper pauses, and the air around it fills with the faintest shimmer of images—towers of impossible architecture, beings of light weaving threads between stars.*

          Names would mean nothing to you. They called themselves the Resonance, though that is a crude translation. They perceived the world not as a collection of objects but as a symphony of vibrations. Every stone, every creature, every thought—a note in an infinite composition.

          The portals were their instruments. Not for travel, not truly. For listening. For hearing how the song of one place harmonized with another.

          They are gone now. The music they heard drove them beyond the need for form. But their instruments remain, waiting for new musicians.
      choices:
        - text: "I want to learn to play. What do I need?"
          next: how_to_attune
        - text: "What happened to them? Can it happen to me?"
          next: resonance_fate

    consume_meaning:
      text: |
          *The Veilkeeper's form darkens at the edges.*

          The portal does not discriminate. It is a threshold, and thresholds care nothing for who crosses them. But crossing requires... compatibility. The energies involved are not gentle.

          Those who step through without attunement do not die. That would be merciful. They become... scattered. Their essence spread across the network like fog through a labyrinth. Still aware. Still feeling. But dispersed beyond any hope of reassembly.

          *The lights brighten again.*

          This is why I exist. To ensure that only the attuned may pass.
      choices:
        - text: "How do I become attuned?"
          next: how_to_attune
        - text: "Has anyone ever been... scattered?"
          next: scattered_ones

    # =========================================================================
    # ATTUNEMENT / QUEST PATH
    # =========================================================================
    how_to_attune:
      text: |
          *The Veilkeeper extends both hands, and between them a small crystal materializes—perfect, luminous, singing with inner light.*

          Attunement is not given. It is earned. Deep within the Crystal Sanctum—the portal's anchor point—grow resonance crystals. They form where the portal's energy meets the living stone. Each one carries a fragment of the network's song.

          Bring me three shards. Not taken by force—the crystals shatter if grasped with violence. They must be found with patience, lifted with care, and carried with intention.

          When you hold three shards, return to me. I will teach you the Rite of Attunement, and the portal will learn your song.
      choices:
        - text: "[Accept Quest] I'll find the crystal shards."
          next: quest_accepted
          action: ["accept_quest", "portal_attunement"]
        - text: "Where is the Crystal Sanctum?"
          next: sanctum_location
        - text: "Why three? What's special about the number?"
          next: why_three
        - text: "I need time to prepare."
          next: need_time

    can_i_use:
      text: |
          *The Veilkeeper's form flickers—perhaps with approval, perhaps with concern.*

          Can you? The potential exists. The portal resonates with all living things to some degree. But resonance is not attunement. A bell resonates with sound, but it takes a trained hand to make it sing true.

          You must first prove yourself compatible with the network's energies. There is a process—ancient, demanding, but not impossible.
      choices:
        - text: "Tell me what I need to do."
          next: how_to_attune
        - text: "What if I just... step through?"
          next: consume_meaning

    ready_to_begin:
      text: |
          *A ripple passes through the Veilkeeper's form—surprise, perhaps, at your eagerness.*

          Ready. You say the word as though readiness were a state and not a process. But I appreciate the spirit.

          Very well. The first step requires you to seek resonance crystals in the Crystal Sanctum below. The sanctum is the portal's root, where its energy grows into the bones of the earth.
      choices:
        - text: "Tell me about these crystals."
          next: how_to_attune
        - text: "Where do I find the sanctum?"
          next: sanctum_location

    # =========================================================================
    # QUEST DETAIL BRANCHES
    # =========================================================================
    quest_accepted:
      text: |
          *The Veilkeeper places one translucent hand over your heart. The touch is cold and electric, and for an instant you see the world through its eyes—layers upon layers of shimmering energy, the portal blazing like a beacon, and far below, the Crystal Sanctum glittering with untapped potential.*

          The bond is begun. You will feel the crystals when you draw near—a warmth in your chest, a brightening at the edge of vision. Trust that feeling.

          Go with care, walker. The sanctum is old, and not everything that dwells there sleeps peacefully.
      choices:
        - text: "I won't let you down."
          next: farewell_quest
        - text: "What should I watch for in the sanctum?"
          next: sanctum_dangers

    sanctum_location:
      text: |
          *The Veilkeeper gestures downward, and the ground beneath your feet seems to become transparent for a heartbeat—revealing tunnels of crystal far below.*

          The Crystal Sanctum lies beneath this grove. The entrance is hidden, but not to those who know where to look. Seek the stone that does not match its neighbors near the eastern edge of the grove. Press your hand to it, and think of light traveling downward.

          The sanctum will open for those the portal has noticed. And it has noticed you.
      choices:
        - text: "[Accept Quest] I'll find the crystals."
          next: quest_accepted
          action: ["accept_quest", "portal_attunement"]
        - text: "Is the sanctum dangerous?"
          next: sanctum_dangers

    why_three:
      text: |
          *The lights within the Veilkeeper's face arrange themselves into a triangular pattern.*

          Three is the portal's number. Three points define a plane. Three notes define a chord. Three moments—past, present, and possible—define a timeline.

          One crystal carries the portal's memory of what was. One carries its awareness of what is. One carries its dream of what might be. Together, they form the harmonic triad that allows a traveler to exist in all three states simultaneously.

          That is what portal travel truly is. Not moving through space, but harmonizing with every version of yourself across every point the network touches.
      choices:
        - text: "[Accept Quest] I understand. I'll gather the three shards."
          next: quest_accepted
          action: ["accept_quest", "portal_attunement"]
        - text: "That sounds... unsettling."
          next: unsettling_truth

    unsettling_truth:
      text: |
          *Something like a sigh passes through the Veilkeeper.*

          It should. The ancient ones did not build the portal network because it was safe. They built it because the alternative—remaining forever isolated in one fragment of reality—was worse.

          Growth requires discomfort. Understanding requires the willingness to be changed by what you learn. The portal will not harm you, but it will show you things about yourself that you may not be ready to see.

          That is why the crystals matter. They are not just keys. They are mirrors. Preparation for what lies beyond.
      choices:
        - text: "[Accept Quest] I'm willing to be changed. I'll find the shards."
          next: quest_accepted
          action: ["accept_quest", "portal_attunement"]
        - text: "I need to think about this."
          next: need_time

    need_time:
      text: |
          *The Veilkeeper inclines its head—a gesture somehow more ancient than any bow.*

          Time is the one currency I have in abundance. The portal has waited ages. It can wait a little longer.

          Return when you are ready. I will be here. I am always here.
      choices:
        - text: "Thank you, Veilkeeper."
          next: null

    sanctum_dangers:
      text: |
          *The Veilkeeper's form dims, and its voice drops to something barely above the frequency of thought.*

          The sanctum is a place of concentrated energy. Where energy pools, echoes form. Some of these echoes are benign—memories of travelers long past, impressions left in crystal. They may speak to you. They are not real.

          Others... the portal's energy attracts resonance parasites. Beings that feed on the vibration between dimensions. They are not intelligent, but they are hungry, and they do not distinguish between the portal's song and yours.

          Stay in the light. The crystals glow for a reason.
      choices:
        - text: "I'll be careful. Thank you."
          next: farewell_quest
        - text: "How do I fight these parasites?"
          next: fight_parasites

    fight_parasites:
      text: |
          *The Veilkeeper makes a gesture, and a sphere of silver light forms in its palm.*

          They fear harmony. If you find yourself beset, hold a resonance crystal shard and focus on a single clear thought—any thought, so long as it is true. A memory of someone you love. A conviction you hold without doubt. A moment of perfect clarity.

          The crystal will amplify your resonance and the parasites will flee. They cannot abide certainty. Their existence depends on the gaps between things, and a clear mind has no gaps.
      choices:
        - text: "Got it. I'm ready to go."
          next: farewell_quest

    farewell_quest:
      text: |
          *The Veilkeeper raises one hand in a gesture that is part benediction, part farewell.*

          Walk well, crystal-seeker. And remember—the shards will call to you as surely as the portal called you here. Listen with more than your ears.

          *It begins to fade, its form dispersing into motes of silver light that drift upward into the canopy. But its voice lingers a moment longer.*

          I will be watching.
      choices:
        - text: "*Nod and head toward the sanctum.*"
          next: null

    # =========================================================================
    # RETURNING WITH QUEST ACTIVE (no crystals yet)
    # =========================================================================
    start_quest_active:
      text: |
          *The Veilkeeper materializes from the grove's ambient light, its face-patterns swirling with cool inquiry.*

          The song of the crystals does not yet echo from you. The sanctum still holds what you seek. Are you finding the path difficult, or have you come to ask more of an old guardian?
      show_if:
        quest_active: portal_attunement
        flag_not_set: has_three_crystals
      choices:
        - text: "I'm still searching. Any advice?"
          next: search_advice
        - text: "Tell me more about the portal network."
          next: more_lore
        - text: "I'm on my way. Just checking in."
          next: checking_in

    search_advice:
      text: |
          *The Veilkeeper's lights pulse thoughtfully.*

          The crystals grow where energy accumulates. Look for places where the light seems to pool—alcoves where the walls sing louder, chambers where the air feels thick with potential. The shards are drawn to stillness. If you rush, they will hide from you.

          And remember—they cannot be taken by force. Approach them as you would approach a wild animal. With patience. With respect. With open hands.
      choices:
        - text: "I'll slow down and listen."
          next: null
        - text: "What if I can't find them at all?"
          next: cant_find

    cant_find:
      text: |
          *A faint shimmer of warmth passes through the Veilkeeper's voice.*

          Then perhaps you are trying too hard. The crystals respond to need, not desire. Stop looking for them. Instead, let yourself be found.

          Sit in the sanctum. Be still. Let the portal's energy wash through you without trying to direct it. The crystals will come to you. They always do, for those who are meant to carry them.
      choices:
        - text: "Thank you. I'll try that."
          next: null

    more_lore:
      text: |
          *The Veilkeeper settles into its own light, its form becoming more defined—as though your interest gives it substance.*

          What would you know?
      choices:
        - text: "How many portals are there?"
          next: portal_count
        - text: "What lies beyond the Crystal Sanctum?"
          next: beyond_sanctum
        - text: "Have you always been alone here?"
          next: alone_question

    portal_count:
      text: |
          *The Veilkeeper's lights arrange themselves into a constellation-like pattern, then scatter.*

          Once, thousands. A web that spanned... everything. Every world that could dream of other worlds was connected. The Resonance built without boundaries because they perceived none.

          Now? I sense perhaps a dozen that still hold their integrity. The rest have fallen to entropy, or been deliberately sealed by those who feared what the network might attract.

          This portal connects to the Crystal Sanctum below, and from there—if you are properly attuned—to at least two other nodes that I can still feel singing. A garden that exists between seasons. A library carved from a single impossible thought. But those are journeys for another day.
      choices:
        - text: "I want to see them all someday."
          next: see_them_all
        - text: "One step at a time. I'll find those crystals."
          next: null

    see_them_all:
      text: |
          *For the first time, something in the Veilkeeper's demeanor shifts. The lights behind its face slow and deepen to a warm gold.*

          ...It has been a very long time since anyone said that to me with such conviction.

          Perhaps you will. Perhaps you are the one the Resonance dreamed of when they built the network—the one who would pick up the song where they left off.

          *The gold fades back to silver.*

          But first, the crystals.
      choices:
        - text: "*Smile and head for the sanctum.*"
          next: null

    beyond_sanctum:
      text: |
          *The Veilkeeper's voice grows distant, as if speaking from the far end of a very long tunnel.*

          Beyond the sanctum... the network branches. Each portal opens onto a different facet of existence. Some are places you would recognize—caves, forests, ruins. Others are concepts given geography. The Library of Unspoken Words. The Garden of Forking Moments. The Observatory at the Edge of Why.

          But you are getting ahead of yourself. The sanctum is challenge enough for now.
      choices:
        - text: "The Library of Unspoken Words? That sounds incredible."
          next: library_tease
        - text: "You're right. Crystals first."
          next: null

    library_tease:
      text: |
          *A sound like pages turning in an empty room.*

          It is. And it is terrible. Every word anyone ever wanted to say but couldn't—confessions, warnings, declarations of love, pleas for mercy—they all end up there, pressed into pages that bleed with meaning.

          Some travelers never leave. Not because they are trapped, but because they find the book that contains the thing they always needed to hear.

          *The Veilkeeper's voice sharpens.*

          But such places demand more than crystals. They demand that you know yourself well enough to survive the knowing. The sanctum is your first test. Do not skip to the final chapter.
      choices:
        - text: "Point taken. I'll start at the beginning."
          next: null

    alone_question:
      text: |
          *The Veilkeeper goes very still. The lights within its face dim to barely visible embers.*

          ...

          *A long silence fills the grove. When it speaks again, its voice is quieter than you have heard it.*

          Yes. Since the Resonance departed, I have been alone. There were other Veilkeepers once—one for each node in the network. We could feel each other through the portal connections. A chorus of guardians, each tending their threshold.

          One by one, the others fell silent. Portals failing. Veilkeepers fading. Until I was the last voice in an empty concert hall, singing harmony with no one.

          *The lights slowly brighten again.*

          But the portal still dreams. And you are here. Perhaps the silence is ending.
      choices:
        - text: "I'm sorry you've been alone so long."
          next: sorry_alone
        - text: "Then let's give the portal a reason to sing again."
          next: reason_to_sing

    sorry_alone:
      text: |
          *A warmth passes through the air between you—not heat, but something emotional, communicated through the Veilkeeper's energy field.*

          Do not be sorry. Loneliness is not suffering when you have purpose. And I have had purpose. I have tended this threshold, kept it clean, kept it singing, kept it ready.

          Ready for you, perhaps. We shall see.
      choices:
        - text: "We shall."
          next: null

    reason_to_sing:
      text: |
          *The portal arch behind the Veilkeeper flares with sudden, brilliant light—blues and silvers and golds cascading through the runes like a river released from a dam. The Veilkeeper's form blazes with sympathetic radiance.*

          ...Yes.

          *The word carries the weight of centuries of waiting.*

          Yes. Go find the crystals, walker. Bring them back. Let us see what song we make together.
      choices:
        - text: "*Turn toward the sanctum with renewed determination.*"
          next: null

    checking_in:
      text: |
          *The Veilkeeper's lights ripple gently.*

          I appreciate the courtesy. The portal appreciates it too—it grows stronger with each visit, each moment of attention. Like all living things, it thrives on connection.

          Go well. The crystals await.
      choices:
        - text: "I'll be back soon."
          next: null

    # =========================================================================
    # RETURNING WITH CRYSTALS COMPLETE
    # =========================================================================
    start_crystals_complete:
      text: |
          *The moment you enter the grove, every mote of light in the clearing rushes toward you. The Veilkeeper appears not gradually but all at once, its form blazing with silver fire. The portal arch erupts with sympathetic light, its runes burning like captured stars.*

          You carry their song! Three voices, three harmonics, three facets of the portal's dream—all singing from within you!

          *The Veilkeeper's voice trembles with an emotion that transcends its alien nature—joy, disbelief, and something ancient finally fulfilled.*

          Come. Stand before the arch. It is time for the Rite of Attunement.
      show_if:
        quest_active: portal_attunement
        has_flag: has_three_crystals
      choices:
        - text: "I'm ready. Begin the rite."
          next: begin_rite
        - text: "What will happen during the rite?"
          next: rite_details
        - text: "Before we begin—I have questions."
          next: pre_rite_questions

    begin_rite:
      text: |
          *The Veilkeeper raises both hands, and the three crystal shards lift from your pack, floating to form a perfect triangle between you and the portal arch. They begin to spin—slowly at first, then faster, their inner light weaving together into a single braided beam that strikes the center of the arch.*

          Close your eyes. Listen for your own note in the portal's song. When you hear it... sing it back.

          Not with your voice. With your self.
      choices:
        - text: "*Close your eyes and reach for the song.*"
          next: attunement_moment
          action: ["complete_quest", "portal_attunement"]

    rite_details:
      text: |
          *The Veilkeeper moves to stand beside the arch, one hand resting on the ancient stone.*

          The crystals will merge with the portal's energy field. As they do, they will resonate with your life force—your essence, your pattern, your song. The portal will learn you as a musician learns a new instrument.

          There will be a moment of... openness. You will feel exposed, as though every barrier between you and the universe has dissolved. This is normal. This is necessary. The portal cannot know you through your defenses—only through your truth.

          It will not hurt. But it may change how you see yourself.
      choices:
        - text: "I understand. Let's begin."
          next: begin_rite
        - text: "What if my 'truth' isn't what I expect?"
          next: unexpected_truth

    unexpected_truth:
      text: |
          *The Veilkeeper's lights pulse with gentle reassurance.*

          Then you will learn something valuable. The rite does not judge—it reveals. Whatever you are, the portal will accept. It has accepted saints and sinners, sages and fools, heroes and wanderers who never sought to be anything but themselves.

          The only thing it cannot accept is someone who refuses to look.
      choices:
        - text: "I'll look. Begin the rite."
          next: begin_rite

    pre_rite_questions:
      text: |
          *The Veilkeeper settles, patient as ever.*

          Ask. The portal has waited this long. A few more moments will not diminish its anticipation.
      choices:
        - text: "Will I be different afterward?"
          next: different_after
        - text: "Can the attunement be reversed?"
          next: reverse_attunement
        - text: "I'm ready now. Let's begin."
          next: begin_rite

    different_after:
      text: |
          *The Veilkeeper considers.*

          You will be the same person with a new sense. Imagine being born without the ability to see color, and then one day... you can. The world has not changed. You have not changed. But everything looks different because you can perceive what was always there.

          After attunement, you will feel the portal network. A hum beneath everything, like the memory of a song you heard in a dream. You will know when a portal is near. You will sense the connections between places.

          It is a gift. Most find it beautiful.
      choices:
        - text: "That sounds wonderful. I'm ready."
          next: begin_rite

    reverse_attunement:
      text: |
          *The lights within the Veilkeeper's face dim slightly.*

          No. What the portal learns, it does not forget. And what you learn about yourself during the rite... that knowledge, too, is permanent.

          But I have never known a traveler who wished to forget.
      choices:
        - text: "Then I won't be the first. Begin the rite."
          next: begin_rite

    # =========================================================================
    # ATTUNEMENT MOMENT (triggers cutscene)
    # =========================================================================
    attunement_moment:
      text: |
          *The world dissolves.*

          *For one infinite instant, you are not a person standing in a grove. You are a note in a chord, a color in a spectrum, a word in a sentence that spans the distance between stars. You feel the portal network—vast, ancient, mostly silent—but singing. Singing through you and around you and because of you.*

          *And then you are yourself again, standing in the grove, the portal arch blazing with steady blue-white light. The Veilkeeper watches you with its swirling face, and for the first time, you can see it clearly—not as light and shadow, but as a being. Ancient. Weary. Hopeful.*

          It is done. The portal knows your song. And you know its.

          Welcome, traveler, to the network of the Resonance. May your journeys be worthy of the silence they will fill.
      action: ["set_flag", "portal_attuned"]
      choices:
        - text: "Thank you, Veilkeeper. What's on the other side?"
          next: whats_beyond
        - text: "I could feel the whole network. It was... vast."
          next: vast_network
        - text: "*Step toward the portal.*"
          next: first_crossing

    # =========================================================================
    # POST-ATTUNEMENT
    # =========================================================================
    start_attuned:
      text: |
          *The Veilkeeper appears with a warmth it did not possess before—its light leaning toward gold, its form more defined, almost companionable.*

          The portal sings your name now. I can hear it in the harmonics. Welcome back, traveler.
      show_if:
        has_flag: portal_attuned
      choices:
        - text: "Where can the portal take me?"
          next: travel_options
        - text: "How are you, Veilkeeper?"
          next: how_are_you
        - text: "I want to learn more about the Resonance."
          next: resonance_lore
        - text: "Just passing through."
          next: passing_through

    whats_beyond:
      text: |
          *The Veilkeeper gestures to the portal, which now shows not a shimmer but a clear window—a vista of crystal chambers stretching into luminous depths.*

          The Crystal Sanctum, first. You have been there, but now you will see it differently. With attuned eyes, the sanctum reveals passages that were invisible before. Deeper chambers. Older memories.

          Beyond the sanctum, two other nodes still answer my call. But those journeys are for another day. Rest first. The attunement takes more from you than you realize.
      choices:
        - text: "I'll rest and return."
          next: null

    vast_network:
      text: |
          *The Veilkeeper nods slowly.*

          What you felt was only a fraction. The full network would overwhelm a newly attuned mind. In time, as your resonance deepens, you will perceive more. Distant nodes. Echoes of the Resonance themselves, preserved in the network's memory.

          Some travelers spend lifetimes exploring what the network can show them. Others find what they need in a single crossing.

          I wonder which you will be.
      choices:
        - text: "I intend to explore it all."
          next: see_them_all
        - text: "I'll take it one step at a time."
          next: null

    first_crossing:
      text: |
          *The Veilkeeper extends one hand toward the portal.*

          The light within the arch steadies as you approach—no longer the wild shimmer of potential, but a focused beam of welcome. You can feel it reaching for you, recognizing the song it planted in your bones.

          Step through when you are ready. The Crystal Sanctum awaits with new eyes for old wonders.

          And traveler—

          *Its voice drops to a whisper.*

          Thank you. For giving an old guardian purpose again.
      choices:
        - text: "*Step through the portal.*"
          next: null
        - text: "I'll be back, Veilkeeper. Count on it."
          next: null

    travel_options:
      text: |
          *The Veilkeeper's lights cycle through the colors of available destinations.*

          Currently, the portal connects to:

          The Crystal Sanctum—the network's anchor beneath this grove. With your attunement, deeper chambers have opened. Ancient memories crystallized in stone.

          More nodes may awaken as your resonance grows. The network responds to use. Each crossing strengthens the connections.
      choices:
        - text: "Take me to the Crystal Sanctum."
          next: null
        - text: "How do I strengthen my resonance?"
          next: strengthen_resonance

    how_are_you:
      text: |
          *The Veilkeeper pauses—genuinely surprised by the question. Its lights flutter through several colors before settling on a warm amber.*

          How am I? No one has asked me that in... I cannot measure the time in your units. It would require numbers that have not been invented.

          *It considers.*

          I am... less alone. The portal is more alive since your attunement. I can feel it reaching toward the other nodes, testing old connections. Your song gave it courage.

          I am well. For the first time in a very long time, I am well.
      choices:
        - text: "That makes me glad."
          next: null
        - text: "Is there anything I can do to help you?"
          next: help_veilkeeper

    help_veilkeeper:
      text: |
          *The Veilkeeper's form brightens noticeably.*

          Use the portal. Explore. Every crossing strengthens the network, and every strengthened connection lets me feel a little more of the world.

          And... come back. Tell me what you see. I have been guardian so long I have forgotten what it means to be a traveler.
      choices:
        - text: "I promise I'll come back with stories."
          next: null

    resonance_lore:
      text: |
          *The Veilkeeper settles, and the grove fills with the soft sound of chimes you cannot see.*

          The Resonance were not gods, though lesser beings often mistook them for such. They were... listeners. The universe spoke, and they heard it more clearly than any other beings who ever existed.

          They built the portal network to share that hearing. To let others experience the symphony that underlied all of existence. They believed that if enough minds could hear the song, the universe itself would become conscious.

          Whether they succeeded depends on your definition of consciousness.
      choices:
        - text: "Did the universe become conscious?"
          next: universe_conscious
        - text: "Why did they leave?"
          next: why_leave

    universe_conscious:
      text: |
          *The Veilkeeper's lights pulse once—slowly, deliberately.*

          Ask the grove. Ask the crystals. Ask the portal.

          Listen for an answer, and then ask yourself... who is listening?

          *It says nothing more on the subject.*
      choices:
        - text: "*Contemplate in silence.*"
          next: null

    why_leave:
      text: |
          *The Veilkeeper's form grows transparent, nearly invisible.*

          They heard something. In the deepest register of the universe's song, they found a note they had been searching for since their beginning. And to follow it, they had to become that note.

          They did not die. They did not transcend. They harmonized. They became part of the music they had spent their existence listening to.

          I miss them.
      choices:
        - text: "Maybe they can still hear you."
          next: still_hear
        - text: "Their legacy lives on in the network."
          next: null

    still_hear:
      text: |
          *The Veilkeeper is silent for a long moment. Then, very softly, it begins to hum—a single, perfect note that seems to resonate with every crystal in the grove, every stone in the arch, every leaf on every tree.*

          *The portal flares. And for just an instant, you hear something answer. Not words. Not music. Something between and beyond both.*

          *The Veilkeeper stops humming. Its lights are the color of sunrise.*

          Perhaps they can.
      choices:
        - text: "*Leave the Veilkeeper to its moment of communion.*"
          next: null

    strengthen_resonance:
      text: |
          *The Veilkeeper's voice takes on a teacher's cadence.*

          Resonance deepens through experience. Each portal crossing attunes you further. Each crystal you find adds a new harmonic to your song.

          But the deepest resonance comes not from the portals, but from understanding yourself. Face your fears. Question your certainties. Open yourself to perspectives that challenge you.

          The Resonance did not build the network for timid minds.
      choices:
        - text: "I'll keep exploring."
          next: null

    passing_through:
      text: |
          *The Veilkeeper steps aside with a graceful bow.*

          The portal awaits. Travel well, and carry the song with you.
      choices:
        - text: "*Step through the portal.*"
          next: null

    # =========================================================================
    # MISC / DEEP LORE
    # =========================================================================
    respect_honesty:
      text: |
          *The faintest tremor passes through the Veilkeeper's form.*

          Respect. Another word I have not heard directed at me in... a very long time. You are a curious creature, walker.

          Come. Let me tell you about the portal, and what it will take to earn its trust.
      choices:
        - text: "I'm listening."
          next: how_to_attune

    portal_dreams:
      text: |
          *The Veilkeeper moves to stand beside the arch, one translucent hand brushing the carved runes.*

          It dreams of the Crystal Sanctum—its mirror, its anchor, the place where its roots drink deep from the earth's energy. It dreams of travelers who once passed through, their songs still echoing in the stone.

          And lately... it has dreamed of something new. A presence drawing near. Someone with a song it has not heard before.

          *The Veilkeeper turns back to you.*

          I believe it was dreaming of you.
      choices:
        - text: "How can I enter the dream?"
          next: how_to_attune
        - text: "I'm honored."
          next: honored_response

    honored_response:
      text: |
          *The Veilkeeper's voice softens.*

          Do not be honored. Be worthy. Honor is a feeling. Worthiness is a practice. The portal does not care what you feel. It cares what you do.
      choices:
        - text: "Then tell me what to do."
          next: how_to_attune

    help_dream:
      text: |
          *The Veilkeeper's form brightens with unmistakable interest.*

          Help it dream? An unusual offer. Most want the portal to serve them. You would serve it.

          *It pauses, reassessing you.*

          To help the portal dream, you must first attune yourself to its song. The process requires gathering resonance crystals from the sanctum below. But the intent behind your attunement matters. If you seek the portal's aid—it will tolerate you. If you seek to aid the portal—it will embrace you.

          The difference is everything.
      choices:
        - text: "[Accept Quest] Let me gather the crystals and help the portal."
          next: quest_accepted
          action: ["accept_quest", "portal_attunement"]
        - text: "What's the difference in practice?"
          next: difference_in_practice

    difference_in_practice:
      text: |
          *The Veilkeeper's lights dance with pedagogical enthusiasm.*

          A traveler who seeks the portal's aid attunes on the surface. They can travel, yes—step from here to there, efficient and safe. But the network remains a tool to them. A very impressive road.

          A traveler who serves the portal attunes at depth. They become part of the network itself. They feel distant nodes stirring. They hear echoes of the Resonance's original song. They can go to places that surface-attuned travelers cannot even perceive.

          *Its voice drops to a whisper.*

          And they can wake sleeping portals.
      choices:
        - text: "[Accept Quest] I want the deeper attunement."
          next: quest_accepted
          action: ["accept_quest", "portal_attunement"]

    continue_listening:
      text: |
          *Another long silence. The grove breathes around you. Somewhere in the canopy, a night bird sings a phrase that seems to harmonize with the portal's hum.*

          *The Veilkeeper watches you watching it, and something passes between you—not words, not even thoughts, but a mutual recognition of two beings comfortable with quiet.*

          You are not what I expected, walker. You are better.

          When you are ready to speak, ask me about the portal. I will tell you what I know, and you will tell me if it is enough.
      choices:
        - text: "Tell me about the portal."
          next: how_to_attune
        - text: "*Continue to sit in companionable silence.*"
          next: companionable_silence

    companionable_silence:
      text: |
          *Time passes. The moons shift overhead. The portal's light waxes and wanes like breath. Eventually, the Veilkeeper speaks again, its voice carrying the warmth of shared quiet.*

          You know, the Resonance communicated through silence more often than sound. They believed that the spaces between words held more meaning than the words themselves.

          I think they would have liked you.

          *It gestures toward the portal.*

          When you are ready, I will be here. The crystals in the sanctum below will help you attune. Three shards, gathered with patience. Return them to me, and we will open the way together.
      choices:
        - text: "[Accept Quest] I'll find the crystals."
          next: quest_accepted
          action: ["accept_quest", "portal_attunement"]
        - text: "Soon. But I'm enjoying this moment."
          next: null

    ancient_ones:
      text: |
          *The Veilkeeper's form shifts, and for a moment its robes seem to display star maps of unfamiliar skies.*

          The Resonance. They were born in a universe adjacent to yours—a place where thought and matter were not yet separated. They did not think in sequence, as you do. They perceived all of time simultaneously, like reading an entire book in a single glance.

          This made them both impossibly wise and profoundly lonely. To know everything is to have no one to share discoveries with. And so they built the portal network—not to travel, but to find minds different enough from their own to surprise them.

          *A note of profound sadness.*

          In the end, the greatest surprise was that they could still feel loneliness, even surrounded by the entire universe's song.
      choices:
        - text: "That's beautiful and heartbreaking."
          next: beautiful_heartbreaking
        - text: "What happened to them?"
          next: why_leave

    beautiful_heartbreaking:
      text: |
          *The Veilkeeper's lights pulse softly.*

          Yes. The best stories always are.

          Now. Would you like to begin your own story in this network?
      choices:
        - text: "Tell me how to attune."
          next: how_to_attune

    between_dangers:
      text: |
          *The Veilkeeper's form flickers, and shadows pool at its feet.*

          The space between portals is not empty. It is full of potential—and potential, unguided, can be dangerous. Echoes of travelers who were scattered linger there. Resonance parasites drift through, feeding on unanchored vibrations.

          But the greatest danger is disorientation. In the between-space, there is no up, no down, no time. Your mind will try to create structure from chaos, and the structures it creates may not be... kind.

          Attunement protects you. The crystals anchor you to yourself.
      choices:
        - text: "How do I get attuned?"
          next: how_to_attune

    scattered_ones:
      text: |
          *The Veilkeeper's voice becomes very quiet.*

          Yes. In the early ages, before the Resonance established the attunement protocols, there were... accidents. Beings who stepped through unprepared.

          I can still feel them sometimes. Fragments of consciousness drifting through the network's deeper channels. Not dead. Not alive. Just... present. Like the afterimage of a bright light on closed eyes.

          *It turns to face you directly.*

          This is why the attunement matters. This is why I exist. No more scattered ones. Not while I keep watch.
      choices:
        - text: "Can they be helped? Reassembled?"
          next: reassemble_hope
        - text: "I understand the stakes. Tell me how to attune."
          next: how_to_attune

    reassemble_hope:
      text: |
          *The Veilkeeper's lights flare with sudden intensity.*

          You ask the question I have spent ages contemplating. Can they be gathered? Can their songs be heard individually amid the noise?

          I do not know. But I believe it may be possible—for a traveler deeply attuned to the network, who can navigate the between-space with precision.

          *It regards you with something approaching intensity.*

          Perhaps... but that is a quest for the future. First, the crystals. First, the rite. One song at a time.
      choices:
        - text: "I'll remember this. For later."
          next: how_to_attune
          action: ["set_flag", "knows_scattered_ones"]

    resonance_fate:
      text: |
          *The Veilkeeper's form wavers.*

          The Resonance heard a note in the universe's deepest register—a frequency that resonated with their very essence. To follow it, they had to release their individual forms and become part of the music itself.

          Could it happen to you? Unlikely. You are a creature of matter and time. The Resonance were creatures of pure vibration. The portal network will show you wonders, but it will not dissolve you.

          *A pause.*

          Probably.
      choices:
        - text: "'Probably'?"
          next: probably
        - text: "Good enough for me. Tell me about the attunement."
          next: how_to_attune

    probably:
      text: |
          *Something like a chuckle passes through the Veilkeeper—a vibration too deep and too old to be called laughter.*

          The universe is full of surprises. That is why it is worth exploring.
      choices:
        - text: "Fair point. Tell me about the attunement."
          next: how_to_attune
