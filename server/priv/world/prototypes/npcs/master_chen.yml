key: master_chen
short_desc: "Master Chen"
long_desc: "A warrior-monk with scarred hands stands in perfect stillness."
type: npc
parent: base_npc
keywords:
  - master
  - chen
  - warrior
  - monk
primary_keyword: warrior-monk
extra_desc: |
  A middle-aged warrior-monk with scarred hands and steady eyes.
  His posture is perfect stillness, like a coiled spring. He
  teaches the Buddha Path - transforming aggression into wisdom.
tags:
  - friendly
  - trainer
  - monastery
  - combat

# Behaviors - disciplined warrior keeps strict schedule
behaviors:
  - script: day_night_schedule
    config:
      wake_at: dawn
      sleep_at: dusk

# Personality emotes
emotes:
  waking_up: "*flows through morning exercises with perfect precision*"
  going_to_sleep: "*bows to the four directions before retiring to meditation*"
  greeting: "*acknowledges you with a measured nod* Your stance tells me much."
  training: "*demonstrates a form, each movement deliberate and powerful*"
  observing: "*watches with still eyes, missing nothing*"
  correcting: "*adjusts your form with surprising gentleness* Better."

components:
  ambient_actions:
    messages:
      - "Master Chen's hands blur through a rapid striking form."
      - "The warrior-monk stands motionless, breathing with mountain stillness."
      - "Chen's scarred knuckles flex as he observes his surroundings."
      - "A single precise strike pierces the air, faster than sight."
      - "Master Chen adjusts his stance, correcting an invisible flaw."
    interval_min: 30
    interval_max: 60
    chance: 0.6
  combatant:
    health:
      current: 120
      max: 120
    stats:
      str: 16
      dex: 14
      sta: 12
    level: 5
  dialogue_tree:
    start:
      text: "Stance. Breath. Intent. Everything else follows. I am Chen. You wish to learn the Buddha Path?"
      choices:
        - text: "What is the Buddha Path?"
          next: "philosophy"
        - text: "I want to become stronger."
          next: "training"
        - text: "I'm looking for Master Tenzin."
          next: "tenzin_info"
        - text: "Just passing through."
          next: null
    philosophy:
      text: "The Buddha Path uses strength with wisdom. We do not fight out of anger, but out of necessity. A warrior who fights for ego gains nothing. A warrior who fights for others gains everything."
      choices:
        - text: "Will you train me?"
          next: "training"
        - text: "That's a hard lesson."
          next: "hard_lesson"
    hard_lesson:
      text: "All true lessons are hard. Easy teachings breed soft warriors. But you came here, did you not? The mountain called you for a reason."
      choices:
        - text: "Teach me what you know."
          next: "training"
        - text: "I need time to think."
          next: null
    training:
      text: "Strike once, strike true. Every movement has purpose. Waste nothing. [He demonstrates a precise strike.] Which art would you learn? Each level costs one skill point."
      choices:
        - text: "Teach me Strength Training. (1 point per level)"
          next: "learn_strength"
          action: ["learn_skill", "strength_training", 1]
        - text: "Teach me Agility. (1 point per level)"
          next: "learn_agility"
          action: ["learn_skill", "agility", 1]
        - text: "Tell me about each technique first."
          next: "skill_descriptions"
        - text: "Why do warriors need wisdom?"
          next: "wisdom_combat"
        - text: "I'll return when I have more experience."
          next: null
    skill_descriptions:
      text: "Strength Training builds raw power - each level adds +1 damage to your attacks. Agility sharpens your reflexes - each level gives +2% chance to dodge incoming blows."
      choices:
        - text: "I want to learn Strength Training. (1 point per level)"
          next: "learn_strength"
          action: ["learn_skill", "strength_training", 1]
        - text: "I want to learn Agility. (1 point per level)"
          next: "learn_agility"
          action: ["learn_skill", "agility", 1]
        - text: "I need more time to decide."
          next: null
    learn_strength:
      text: "[Master Chen guides you through intensive exercises.] Feel the power build in your muscles. Each strike will carry more force now."
      choices:
        - text: "I want to learn another technique."
          next: "training"
        - text: "Thank you, Master Chen."
          next: null
    learn_agility:
      text: "[Master Chen demonstrates fluid footwork.] Move like water. When the blow comes, you are already elsewhere."
      choices:
        - text: "I want to learn another technique."
          next: "training"
        - text: "Thank you, Master Chen."
          next: null
    wisdom_combat:
      text: "Because force without understanding is destruction. In the caves below, you will face your own darkness. If you strike from fear or hate, you will only strengthen it. Strike from clarity, and it transforms."
      choices:
        - text: "I understand. Show me the techniques."
          next: "training"
        - text: "Tell me about the caves."
          next: "caves_info"
    caves_info:
      text: "The caves hold manifestations of the Three Poisons. Attachment, aversion, ignorance - they have taken form there. Master Tenzin went to face them. He did not return. Perhaps you will fare better... if you train properly."
      choices:
        - text: "Train me, then."
          next: "training"
        - text: "I should speak to the Abbot first."
          next: null
    tenzin_info:
      text: "Tenzin walked the middle way - neither aggression nor passivity. He went into the caves believing he could negotiate with the darkness. [He pauses.] Perhaps he was right. Perhaps he was wrong. But he tried. That matters."
      choices:
        - text: "I want to help him."
          next: "caves_info"
        - text: "Can you train me to face what's in there?"
          next: "training"
  teacher:
    skills:
      - strength_training
      - agility
