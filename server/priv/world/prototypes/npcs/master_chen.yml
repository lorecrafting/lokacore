key: master_chen
name: "Master Chen"
type: npc
parent: base_npc
description: |
  A middle-aged warrior-monk with scarred hands and steady eyes.
  His posture is perfect stillness, like a coiled spring. He
  teaches the Buddha Path - transforming aggression into wisdom.
tags:
  - friendly
  - trainer
  - monastery
  - combat
components:
  short_desc: "A warrior-monk with scarred hands stands in perfect stillness."
  combatant:
    health:
      current: 120
      max: 120
    stats:
      str: 16
      dex: 14
      sta: 12
    level: 5
  dialogue_tree:
    start:
      text: "Stance. Breath. Intent. Everything else follows. I am Chen. You wish to learn the Buddha Path?"
      choices:
        - text: "What is the Buddha Path?"
          next: "philosophy"
        - text: "I want to become stronger."
          next: "training"
        - text: "I'm looking for Master Tenzin."
          next: "tenzin_info"
        - text: "Just passing through."
          next: null
    philosophy:
      text: "The Buddha Path uses strength with wisdom. We do not fight out of anger, but out of necessity. A warrior who fights for ego gains nothing. A warrior who fights for others gains everything."
      choices:
        - text: "Will you train me?"
          next: "training"
        - text: "That's a hard lesson."
          next: "hard_lesson"
    hard_lesson:
      text: "All true lessons are hard. Easy teachings breed soft warriors. But you came here, did you not? The mountain called you for a reason."
      choices:
        - text: "Teach me what you know."
          next: "training"
        - text: "I need time to think."
          next: null
    training:
      text: "Strike once, strike true. Every movement has purpose. Waste nothing. [He demonstrates a precise strike.] I can teach you Power Strike, Critical Eye, and the Berserker's Focus. But wisdom must guide strength."
      choices:
        - text: "I'm ready to learn."
          next: "accept_training"
        - text: "Why do warriors need wisdom?"
          next: "wisdom_combat"
    wisdom_combat:
      text: "Because force without understanding is destruction. In the caves below, you will face your own darkness. If you strike from fear or hate, you will only strengthen it. Strike from clarity, and it transforms."
      choices:
        - text: "I understand. Teach me."
          next: "accept_training"
        - text: "Tell me about the caves."
          next: "caves_info"
    caves_info:
      text: "The caves hold manifestations of the Three Poisons. Attachment, aversion, ignorance - they have taken form there. Master Tenzin went to face them. He did not return. Perhaps you will fare better... if you train properly."
      choices:
        - text: "Train me, then."
          next: "accept_training"
        - text: "I should speak to the Abbot first."
          next: null
    accept_training:
      text: "Good. Begin with stance. [He adjusts your position.] Remember: the body follows the mind. Control your thoughts, and your strikes will be true. Practice this. Return when you are ready for more."
      choices:
        - text: "Thank you, Master Chen."
          next: null
    tenzin_info:
      text: "Tenzin walked the middle way - neither aggression nor passivity. He went into the caves believing he could negotiate with the darkness. [He pauses.] Perhaps he was right. Perhaps he was wrong. But he tried. That matters."
      choices:
        - text: "I want to help him."
          next: "caves_info"
        - text: "Can you train me to face what's in there?"
          next: "training"
  teacher:
    skills:
      - power_strike
      - critical_eye
      - berserkers_focus
    mantras:
      - om_ah_hum_vajra_guru
