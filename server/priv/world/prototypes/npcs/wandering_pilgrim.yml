key: wandering_pilgrim
type: npc
parent: base_npc

short_desc: "Wandering Pilgrim"
long_desc: "An elderly pilgrim in dusty robes walks with the slow certainty of faith."
extra_desc: |
  An elderly pilgrim whose face is weathered by sun and wind, her robes
  faded to the color of mountain dust. She carries prayer beads worn smooth
  by decades of devotion and walks with the patient determination of one
  who has made this journey many times before. Her eyes hold the peace of
  one who has found their purpose.

keywords:
  - pilgrim
  - elder
  - traveler
  - grandmother
primary_keyword: pilgrim
mood: serene

tags:
  - friendly
  - traveler
  - sacred
  - atmosphere

# Behaviors - pilgrim walks at dawn, rests during evening
behaviors:
  - script: day_night_schedule
    config:
      wake_at: dawn
      sleep_at: evening
  - script: wander
    config:
      rooms: [monastery_gate, main_courtyard, temple, waterfall_shrine, village_square, cliff_path]
      interval: 480
      stay_probability: 0.8

# Personality emotes
emotes:
  waking_up: "*rises with the sun, greeting the dawn with prayer*"
  going_to_sleep: "*settles onto a worn bedroll, beads still in hand*"
  greeting: "*bows with serene dignity* Blessings upon you, traveler."
  praying: "*lips move in silent prayer, worn beads clicking softly*"
  walking: "*moves with patient, measured steps, each one a meditation*"
  peaceful: "*gazes at the mountains with quiet contentment*"

components:
  ambient_actions:
    messages:
      - "The pilgrim fingers her prayer beads, whispering mantras."
      - "The elderly woman pauses to catch her breath, smiling peacefully."
      - "The pilgrim touches a carved stone with reverent fingers."
      - "A soft chant drifts from the pilgrim's lips."
      - "The pilgrim adjusts her dusty robes with practiced ease."
      - "The elderly pilgrim gazes at the mountains with quiet wonder."
    interval_min: 30
    interval_max: 60
    chance: 0.5
  combatant:
    health:
      current: 35
      max: 35
    stats:
      str: 5
      dex: 8
      sta: 12
    level: 2
  dialogue_tree:
    start:
      text: "Blessings upon you, young one. Have you come to walk the mountain path?"
      choices:
        - text: "Tell me about your pilgrimage."
          next: "pilgrimage"
        - text: "What have you seen on your travels?"
          next: "travels"
        - text: "May your journey be peaceful."
          next: null
    pilgrimage:
      text: "Sixty years I have walked these mountains. Each stone knows my footsteps, each stream my prayers. The journey is not the destination - the journey IS the destination."
      choices:
        - text: "That is wise."
          next: "wisdom"
        - text: "What keeps you going?"
          next: "faith"
        - text: "Safe travels, pilgrim."
          next: null
    travels:
      text: "I have seen the sun rise from every peak, the stars wheel over every valley. I have seen kind hearts in dark times and found shelter in the most unlikely places. The mountains provide."
      choices:
        - text: "Any advice for a traveler?"
          next: "advice"
        - text: "Thank you for sharing."
          next: null
    wisdom:
      text: "*The pilgrim nods slowly.* 'Wisdom comes not from learning, but from walking. Put one foot before the other, and the path reveals itself.'"
      choices:
        - text: "I will remember that."
          next: null
    faith:
      text: "Faith? *She chuckles softly.* Not faith in some distant heaven - faith in the next step. Faith that the mountain will hold me. Faith that the sun will rise. Simple things."
      choices:
        - text: "Simple but profound."
          next: null
    advice:
      text: "Listen more than you speak. Rest when you can. And never pass a shrine without offering a prayer - you never know which prayer will be answered."
      choices:
        - text: "Thank you, grandmother."
          next: null
