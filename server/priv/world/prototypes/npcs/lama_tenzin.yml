key: lama_tenzin
short_desc: "Lama Tenzin"
long_desc: "An ancient monk sits motionless, surrounded by a faint golden glow."
type: npc
parent: base_npc
keywords:
  - lama
  - tenzin
  - monk
  - master
primary_keyword: monk
extra_desc: |
  An ancient monk sits motionless, his form surrounded by a faint
  golden glow. His breath is imperceptible, his expression serene
  yet somehow troubled. He exists between worlds.
tags:
  - friendly
  - monastery
  - trance
components:
  ambient_actions:
    messages:
      - "A faint golden glow pulses around Tenzin's motionless form."
      - "The Lama's breath is barely perceptible, slow as mountain time."
      - "Shadows seem to flicker at the edges of Tenzin's chamber."
      - "A whisper of distant chanting seems to emanate from the meditating master."
      - "The air around Tenzin shimmers with barely contained spiritual energy."
    interval_min: 40
    interval_max: 80
    chance: 0.5
  combatant:
    health:
      current: 200
      max: 200
    stats:
      str: 6
      dex: 6
      sta: 20
    level: 10
  dialogue_tree:
    start:
      text: "[He does not respond. His eyes remain closed, his breath barely visible. Yet somehow, you sense awareness within.]"
      choices:
        - text: "[Reach out with your mind]"
          next: "vision"
        - text: "[Examine him closely]"
          next: "examine"
        - text: "[Leave him in peace]"
          next: null
    examine:
      text: "His chest rises and falls with breath so subtle it might be imagination. A faint golden glow surrounds his form. He is alive, but far away - trapped somewhere between this world and the next."
      choices:
        - text: "[Try to sense where he has gone]"
          next: "vision"
        - text: "[Step back]"
          next: null
    vision:
      text: "[In your mind, you hear a distant voice, thin as mountain wind:] 'The path is within. Three poisons block the way. Face what I could not face alone. The caves... the caves remember...'"
      choices:
        - text: "[Ask about the caves]"
          next: "caves_hint"
        - text: "[Withdraw from the connection]"
          next: null
    caves_hint:
      text: "[The voice grows fainter:] 'Attachment. Aversion. Ignorance. They have taken form. Defeat them not with hatred, but with understanding. The Abbot... holds the key...'"
      choices:
        - text: "I will find a way to help you."
          next: null
    awakened:
      text: "You have done what I could not do alone. The poisons are transformed, not destroyed - this is the wisdom path. Thank you, traveler. The monastery is in your debt."
      completed_quest: "main_liberation"
      choices:
        - text: "What happens now?"
          next: "aftermath"
        - text: "I'm glad you're safe."
          next: null
    aftermath:
      text: "I will need time to recover, but I will return to my teaching. And you... you have learned much on this journey. The dharma reveals itself through action. Remember what you have faced within those caves."
      choices:
        - text: "I won't forget."
          next: null
    liberation:
      text: "[The golden glow intensifies. Tenzin's eyes flutter open for the first time in days.] You have faced the Three Poisons and emerged whole. My spirit is freed. The monastery... the monastery is saved."
      show_if:
        quest_active: "main_liberation"
      choices:
        - text: "[Complete Quest] I'm glad you're free, Master."
          next: "liberation_thanks"
          action: ["complete_quest", "main_liberation"]
    liberation_thanks:
      text: "Thank you, traveler. You have done what I could not do alone. The poisons are transformed, not destroyed - this is the wisdom path. Rest now. You have earned it."
      choices:
        - text: "What happens now?"
          next: "aftermath"
        - text: "I'm glad I could help."
          next: null
  state:
    trance: true
    awakens_at: mara_defeated
