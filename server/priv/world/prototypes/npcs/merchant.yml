key: merchant
parent: base_npc
type: npc
name: "Grizzled Merchant"
description: |
  A weathered trader with keen eyes watches over his wares.
  Years of haggling have sharpened his wit and loosened his tongue.
  His worn leather apron bears stains from countless journeys.
components:
  combatant:
    health:
      current: 80
      max: 80
  conversant:
    default_greeting: "Welcome, traveler! Looking to buy or sell?"
    dialogue_tree:
      start:
        text: "Welcome, traveler! Looking to buy or sell?"
        choices:
          - label: "Show me your wares"
            next: show_wares
          - label: "What news from the road?"
            next: rumors
          - label: "Farewell"
            next: goodbye
      show_wares:
        text: "I've got potions, weapons, and supplies. What interests you?"
        action: open_shop
      rumors:
        text: "They say goblins have been spotted in the forest to the south..."
        choices:
          - label: "Tell me more"
            next: goblin_quest
          - label: "Back"
            next: start
      goblin_quest:
        text: "Clear them out and I'll reward you handsomely. Say, 50 gold?"
        choices:
          - label: "I'll do it"
            action: offer_quest
            quest_id: clear_goblins
          - label: "Maybe later"
            next: start
      goodbye:
        text: "Safe travels, friend!"
        action: end_conversation
tags:
  - friendly
  - quest_giver
  - merchant
attributes:
  shop_inventory:
    - health_potion
    - rusty_sword
    - leather_armor
