short_desc: "Old Tom"
long_desc: "Years of tavern work have carved deep lines around Tom's eyes, but they crinkle with genuine warmth when he smiles. His sleeves are rolled to weathered forearms, and a stained apron hangs from his broad frame. Silver stubble catches the firelight as he polishes glasses with practiced efficiency, each movement speaking of decades behind this very bar."
