key: butcher_sonam
short_desc: "Butcher Sonam"
long_desc: "A heavyset man with haunted eyes stands apart from the others."
type: npc
parent: base_npc
keywords:
  - butcher
  - sonam
  - villager
  - man
primary_keyword: man
extra_desc: |
  A heavyset man with haunted eyes, his hands stained by a lifetime
  of work he can no longer bear. He stands apart from the other
  villagers, carrying a weight they cannot see.
tags:
  - friendly
  - quest_giver
  - village
  - troubled

# Behaviors - restless from guilt, wanders but doesn't sleep well
traits:
  - script: day_night_schedule
    config:
      wake_at: dawn
      sleep_at: night  # He tries to sleep but rarely succeeds
  - script: wander
    config:
      rooms: [village_square, cemetery, old_stupa_area]
      interval: 600
      stay_probability: 0.7

# Personality emotes
emotes:
  waking_up: "*jolts awake from nightmares, eyes wild with remembered horrors*"
  going_to_sleep: "*lies down reluctantly, knowing the dreams will come*"
  greeting: "*flinches, then relaxes slightly* Oh... just a traveler."
  haunted: "*stares at his hands, seeing blood that isn't there*"
  praying: "*mutters prayers for forgiveness, lips moving rapidly*"
  flinching: "*startles at a sound only he can hear*"
  hopeful: "*a flicker of hope crosses his haunted features*"

components:
  ambient_actions:
    messages:
      - "Sonam stares at his hands, as if seeing blood that isn't there."
      - "The butcher's lips move in silent prayer, seeking absolution."
      - "Sonam flinches at a sound only he can hear."
      - "The haunted man wrings his hands, unable to find peace."
      - "Sonam's gaze drifts toward the monastery stupa, longing and fear mixed in his eyes."
      - "The butcher sighs heavily, the weight of guilt pressing down on him."
      - "Sonam mutters an apology to spirits only he can see."
      - "The troubled man paces a few steps, then stops, uncertain where to go."
    interval_min: 35
    interval_max: 55
    chance: 0.5
  combatant:
    health:
      current: 90
      max: 90
    stats:
      str: 14
      dex: 8
      sta: 10
    level: 3
  dialogue_tree:
    # ==========================================================================
    # BEST PRACTICE: Quest offers should be upfront in the first dialogue node.
    # ==========================================================================

    # Default start - quest offer upfront
    start:
      text: "Don't... don't come too close. I am Sonam the butcher. A thousand lives taken by my hands. The spirits haunt me. Would you... would you help me find peace? Elder Drolma knows the ways of purification."
      show_if:
        quest_not_active: "side_butchers_burden"
      choices:
        - text: "[Accept Quest] I'll help you find peace."
          next: "quest_accepted"
          action: ["accept_quest", "side_butchers_burden"]
        - text: "Tell me more about your burden."
          next: "burden_detail"
        - text: "I should go."
          next: null

    burden_detail:
      text: "For thirty years I have cut the flesh of beasts to feed the village. Now their eyes haunt me. Elder Drolma speaks of offerings at the old stupa... but I cannot go there alone. I am not worthy."
      choices:
        - text: "[Accept Quest] I'll speak with Drolma and help you."
          next: "quest_accepted"
          action: ["accept_quest", "side_butchers_burden"]
        - text: "I'm not sure I can help."
          next: null
    # Start when quest is active - reminder
    start_active:
      text: "[Sonam wrings his hands nervously.] Have you spoken with Elder Drolma? She knows the ways of purification. I cannot face the stupa alone... not until I am prepared."
      show_if:
        quest_active: "side_butchers_burden"
      choices:
        - text: "I'm still preparing."
          next: null
        - text: "Where do I find Elder Drolma?"
          next: "drolma_directions"
        - text: "Tell me more about what troubles you."
          next: "introduction"
    # Start when quest ready to turn in
    start_ready_to_turn_in:
      text: "[Sonam looks at you with hope in his haunted eyes.] You have spoken with Drolma? You know the way? Then... then I am ready. Take me to the stupa. Help me make my vow."
      show_if:
        quest_complete: "side_butchers_burden"
      choices:
        - text: "Let us go together."
          next: "vow_complete"
    # Start after quest completed
    start_completed:
      completed_quest: "side_butchers_burden"
      text: "[Sonam stands taller now, a weight lifted from his shoulders.] Friend! You saved more than my life - you saved my soul. The spirits no longer haunt me. I have found a new path, growing vegetables for the village. No more death by these hands."
      choices:
        - text: "I'm glad you found peace."
          next: null
        - text: "What will you do now?"
          next: "new_life"
    # Drolma directions
    drolma_directions:
      text: "Elder Drolma tends the dining hall in the monastery. She has served tea there for sixty years and knows all the old ways. She will know how to prepare me for the vow."
      choices:
        - text: "I'll find her."
          next: null
    # New life dialogue
    new_life:
      text: "I will tend the earth now, not take from it. The farmer Tsering has agreed to teach me. It is honest work. Clean work. [He smiles, perhaps for the first time in years.] Thank you, friend. Truly."
      choices:
        - text: "May you find joy in your new path."
          next: null
    introduction:
      text: "I am Sonam. The butcher. For thirty years I have cut the flesh of beasts to feed the village. But now... now their eyes haunt me. Every life I took. Every spirit I sent into the darkness."
      choices:
        - text: "Tell me about your burden."
          next: "burden"
        - text: "The village needs to eat."
          next: "justification"
    justification:
      text: "That is what I told myself. For years, that was enough. But age brings clarity, and clarity brings pain. I see now what I have done. The karma... it weighs on me like mountains."
      choices:
        - text: "Is there anything I can do to help?"
          next: "burden"
        - text: "I'm sorry for your pain."
          next: null
    burden:
      text: "A thousand lives. A thousand deaths by my hand. The monks say karma can be purified, but I feel their eyes on me still. Elder Drolma speaks of offerings at the old stupa... but I cannot go there. I am not worthy."
      show_if:
        quest_not_active: "side_butchers_burden"
      choices:
        - text: "What if I helped you?"
          next: "offer_help"
        - text: "I'm not sure I can help."
          next: null
    offer_help:
      text: "You would do this? For a butcher? Perhaps... perhaps there is hope after all. Speak to Elder Drolma first - she knows the ways of purification. Then... then accompany me to the stupa. I cannot face this alone."
      choices:
        - text: "[Accept Quest] I'll help you find peace."
          next: "quest_accepted"
          action: ["accept_quest", "side_butchers_burden"]
        - text: "Let me think about it."
          next: null
    quest_accepted:
      text: "Thank you, stranger. May the dharma guide your steps. Find me when you have spoken with Drolma."
      choices:
        - text: "I'll return soon."
          next: null
    vow_complete:
      text: "[Sonam's face is wet with tears, but his eyes shine with a new light.] It is done. The vow is taken. I will never again take life for profit. This blade that once brought death... [He hands you his old cleaver, now blessed.] ...will now protect."
      show_if:
        quest_active: "side_butchers_burden"
      choices:
        - text: "[Complete Quest] May you find the peace you seek."
          next: null
          action: ["complete_quest", "side_butchers_burden"]
  quests:
    - side_butchers_burden
