  - cave
  - pale
primary_keyword: spider
mood: wary

tags:
  - hostile
  - whispering_caverns
  - creature

emotes:
  spotted_player: "*clicks its mandibles and draws back slightly*"
  greeting: "*raises two forelegs in a defensive display*"

components:
  ambient_actions:
    messages:
      - "The cave spider adjusts its grip on a crystal formation."
      - "A faint clicking echoes as the spider tests the air with its palps."
      - "The spider's silk catches the dim light, shimmering like dewdrops."
    interval_min: 40
    interval_max: 80
    chance: 0.4
