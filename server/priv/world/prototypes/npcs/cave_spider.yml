key: cave_spider
type: npc
parent: base_npc

short_desc: "Cave Spider"
long_desc: "A pale spider the size of a dinner plate clings to the crystal formations, its legs wrapped around a glowing shard."
extra_desc: |
  Translucent and eyeless, the cave spider navigates by vibration
  alone. Its silk is prized by the monks for its unusual resonant
  properties. The creature seems more curious than aggressive,
  tilting its body toward sounds like a dog listening for its name.
