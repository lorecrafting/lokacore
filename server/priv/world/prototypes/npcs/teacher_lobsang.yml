key: teacher_lobsang
name: "Teacher Lobsang"
type: npc
parent: base_npc
description: |
  A broad-shouldered monk with a gentle face, his robes stretched
  across a frame built for protection, not aggression. He teaches
  the Dharma Path - defense through understanding.
tags:
  - friendly
  - trainer
  - monastery
  - defense
components:
  short_desc: "A broad-shouldered monk with a gentle face teaches nearby."
  combatant:
    health:
      current: 140
      max: 140
    stats:
      str: 10
      dex: 8
      sta: 18
    level: 5
  dialogue_tree:
    start:
      text: "The mountain stands unmoved by wind. So too must you stand. I am Lobsang, teacher of the Dharma Path."
      choices:
        - text: "What is the Dharma Path?"
          next: "dharma_path"
        - text: "Can you teach me to fight?"
          next: "training"
        - text: "Do you know what happened to Master Tenzin?"
          next: "tenzin_info"
        - text: "I should go."
          next: null
    dharma_path:
      text: "The Dharma Path is patience made manifest. We endure, we protect, we do not break. When others attack, we absorb. When others falter, we stand firm. This is not weakness - it is the greatest strength."
      choices:
        - text: "Will you train me?"
          next: "training"
        - text: "That sounds difficult."
          next: "encouragement"
    encouragement:
      text: "All worthy paths are difficult. But you are here, are you not? That alone shows the spirit required. The mountain did not call you without reason."
      choices:
        - text: "Teach me, then."
          next: "training"
        - text: "I need to think about it."
          next: null
    training:
      text: "I can teach you the ways of defense - Shield Wall, Parry, and with time, Fortitude itself. But true mastery requires more than practice. It requires proof of will."
      choices:
        - text: "What kind of proof?"
          next: "quest_offer"
        - text: "Just teach me the basics."
          next: "basic_training"
    basic_training:
      text: "Very well. Watch closely - the body is a shield, but only if the mind is steady first. [He demonstrates a defensive stance.] Practice this. Return when you wish to learn more."
      choices:
        - text: "Thank you, Teacher."
          next: null
    quest_offer:
      text: "Reach the mountain peak before dawn. There, in a stone alcove, you will find a sutra - the teachings of our founder. Bring it to me, and I will teach you Fortitude."
      show_if:
        quest_not_active: "side_mountain_peak"
      choices:
        - text: "I will climb the mountain."
          next: "quest_accepted"
          action: ["accept_quest", "side_mountain_peak"]
        - text: "The peak sounds dangerous."
          next: "peak_warning"
        - text: "Perhaps another time."
          next: null
    peak_warning:
      text: "The path is treacherous, yes. But the view from above... it changes perspective. You will see the monastery, the village, the world spread out below. And you will understand why we stand firm."
      choices:
        - text: "I accept the challenge."
          next: "quest_accepted"
          action: ["accept_quest", "side_mountain_peak"]
        - text: "I'm not ready yet."
          next: null
    quest_accepted:
      text: "May your steps be sure. The cliff path leads south from the monastery gate. Follow it upward. The sutra awaits one worthy enough to reach it."
      choices:
        - text: "I'll return with it."
          next: null
    tenzin_info:
      text: "Master Tenzin... he was the strongest of us all. If the darkness could trap him, what hope do any of us have? [He pauses.] But perhaps that is why you are here. Sometimes strength comes from unexpected places."
      choices:
        - text: "I will try to help him."
          next: "tenzin_hope"
        - text: "Tell me about the Dharma Path instead."
          next: "dharma_path"
    tenzin_hope:
      text: "Then I pray for your success. Speak with Abbot Jampa - he knows more than he tells. And if you survive the caves... come back. I will teach you everything I know."
      choices:
        - text: "Thank you, Teacher."
          next: null
  teacher:
    skills:
      - shield_wall
      - parry
      - fortitude
    mantras: []
  quests:
    - side_mountain_peak
