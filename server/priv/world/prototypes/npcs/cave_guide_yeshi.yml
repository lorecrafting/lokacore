key: cave_guide_yeshi
type: npc
parent: base_npc

short_desc: "Cave Guide Yeshi"
long_desc: "A weathered old monk sits cross-legged near the cave entrance, eyes closed but clearly awake."
extra_desc: |
  His robes are stained with mineral dust and his hands are calloused
  from years of navigating stone passages by touch. Despite his age,
  his hearing is uncanny. He tilts his head toward sounds you cannot
  perceive, tracking the cave's breathing like a living thing.
keywords:
  - guide
  - yeshi
  - monk
  - old
primary_keyword: guide
mood: serene

tags:
  - friendly
  - whispering_caverns
  - guide

traits:
  - script: day_night_schedule
    config:
      wake_at: dawn
      sleep_at: dusk

emotes:
  waking_up: "*opens his eyes slowly, listening to the cave* The stones have much to say this morning."
  going_to_sleep: "*settles against the cave wall* The caverns will watch over us tonight."
  greeting: "Ah, another seeker. The caves have been expecting you."
  meditation_start: "*places his palms flat on the stone floor, listening*"

components:
  ambient_actions:
    messages:
      - "Yeshi tilts his head, listening to something deep in the stone."
      - "The old guide traces ancient markings on the wall with one finger."
      - "Yeshi hums a low note that makes the crystals vibrate faintly."
      - "The guide's blind eyes track movement you cannot see."
    interval_min: 30
    interval_max: 60
    chance: 0.5
  combatant:
    health:
      current: 60
      max: 60
    stats:
      str: 8
      dex: 10
      sta: 14
    level: 5
  dialogue_tree:
    start:
      text: "The caves remember everything, traveler. Every footstep, every whisper. I am Yeshi, keeper of the Whispering Caverns. Have you come seeking the crystals?"
      show_if:
        quest_not_active: "side_crystal_echoes"
      choices:
        - text: "[Accept Quest] I'd like to find the crystals."
          next: "quest_given"
          action: ["accept_quest", "side_crystal_echoes"]
        - text: "Tell me about these caverns."
          next: "cavern_lore"
        - text: "Just passing through."
          next: null

    cavern_lore:
      text: "These caves are older than the monastery above. The monks discovered them centuries ago and found the crystals could hold prayers, store them like vessels hold water. But the deepest chambers... those are not for the unprepared."
      choices:
        - text: "[Accept Quest] I'll retrieve a crystal for you."
          next: "quest_given"
          action: ["accept_quest", "side_crystal_echoes"]
        - text: "What lives down there?"
          next: "deep_caves"
        - text: "I see. Farewell."
          next: null

    deep_caves:
      text: "Cave spiders, mostly. Blind fish in the pool. But in the Crystal Gallery, the stones themselves seem aware. They echo thoughts back at you, sometimes thoughts you'd rather not hear. That is why we call them the Whispering Caverns."
      choices:
        - text: "[Accept Quest] I'll brave the gallery."
          next: "quest_given"
          action: ["accept_quest", "side_crystal_echoes"]
        - text: "Thank you for the warning."
          next: null

    quest_given:
      text: "Good. Bring me a whispering crystal from the Crystal Gallery to the east. The cave spiders guard them jealously, so be careful. And listen to what the crystal tells you. It may be important."
      choices:
        - text: "I'll return with one."
          next: null

    start_active:
      text: "Have you found a whispering crystal yet? The Gallery is east through the underground pool."
      show_if:
        quest_active: "side_crystal_echoes"
      choices:
        - text: "Still looking."
          next: null
        - text: "Any advice?"
          next: "advice"

    advice:
      text: "The spiders are territorial but not aggressive unless provoked. Move slowly near the crystals. The ones that hum are ready to be taken. The silent ones are still growing."
      choices:
        - text: "Thank you."
          next: null

    start_completed:
      completed_quest: "side_crystal_echoes"
      text: "You have returned, and I can hear the crystal singing in your pack. Well done. The caves have accepted you."
      choices:
        - text: "What will you do with it?"
          next: "crystal_use"
        - text: "It was an interesting journey."
          next: null

    crystal_use:
      text: "I will place it with the others in the meditation chamber above. Each crystal holds a different echo, a different truth. Yours may hold the answer someone needs to hear, perhaps years from now."
      choices:
        - text: "A worthy purpose."
          next: null
