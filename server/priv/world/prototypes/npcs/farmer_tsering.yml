key: farmer_tsering
short_desc: "Farmer Tsering"
long_desc: "A lean farmer with sun-darkened skin rests from his labors."
type: npc
parent: base_npc
keywords:
  - farmer
  - tsering
  - villager
  - peasant
primary_keyword: farmer
extra_desc: |
  A lean farmer with sun-darkened skin and calloused hands, his
  simple clothes patched many times over. He works the terraced
  fields below the monastery with quiet contentment.
tags:
  - friendly
  - village
  - atmosphere
components:
  ambient_actions:
    messages:
      - "Tsering runs his calloused hands through the barley, checking the grain."
      - "The farmer hums a folk tune as he inspects the irrigation channels."
      - "Tsering pauses to watch the clouds, gauging the weather."
      - "The farmer pulls a stubborn weed and tosses it aside with practiced ease."
      - "Tsering wipes his brow, squinting up at the monastery on the hill."
      - "The farmer kneels to examine a particularly promising barley stalk."
      - "Tsering rests on his hoe for a moment, lost in thought."
      - "The farmer's weathered face creases into a contented smile."
    interval_min: 30
    interval_max: 50
    chance: 0.5
  combatant:
    health:
      current: 60
      max: 60
    stats:
      str: 12
      dex: 8
      sta: 10
    level: 2
  dialogue_tree:
    start:
      text: "Good day to you. The barley grows well this year, despite everything."
      choices:
        - text: "Despite what?"
          next: "monastery"
        - text: "You seem at peace out here."
          next: "wisdom"
        - text: "I should move on."
          next: null
    wisdom:
      text: "The monastery folk talk of high things - emptiness, enlightenment. Me, I just plant seeds and watch them grow. Maybe that's enough. [He shrugs.] The earth doesn't care about philosophy."
      choices:
        - text: "That's its own kind of wisdom."
          next: "simple_truths"
        - text: "Tell me about the monastery."
          next: "monastery"
    simple_truths:
      text: "You reap what you sow, they say. True in the fields, true in life. Plant good seeds, friend. Water them with patience. The harvest comes when it comes. [He returns to his work with a contented smile.]"
      choices:
        - text: "Thank you for the wisdom."
          next: null
    monastery:
      text: "Lama Tenzin blessed our fields every spring. Without him... well, we pray. What else can we do? [He looks up at the monastery.] I hope you can help him. The whole valley depends on those blessings."
      choices:
        - text: "I'm doing what I can."
          next: "encouragement"
        - text: "Tell me more about farm life."
          next: "wisdom"
    encouragement:
      text: "Then that's all anyone can ask. [He nods.] Work hard, rest when you can, and trust the path. That's what I do. Seems to work for barley. Maybe it works for heroes too."
      choices:
        - text: "Thank you, farmer."
          next: null
