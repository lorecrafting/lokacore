# Red Jujube Date (Da Zao)
# Blood tonic and harmonizer, appears in many formulas

key: da_zao
type: item
parent: base_herb

short_desc: "Red Jujube Dates"
long_desc: "Clusters of red-brown jujube dates hang from a low branch."
extra_desc: |
  Wrinkled red-brown fruits about the size of olives, their skin
  deeply creased from drying. The flesh is sweet and chewy, prized
  by the monks for nourishing the blood and calming the spirit.
  These dates are called the "King of Nuts" in the old texts.

