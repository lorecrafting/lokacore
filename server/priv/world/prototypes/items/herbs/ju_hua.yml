# Chrysanthemum Flower (Ju Hua)
# Cooling herb for eyes and liver heat

key: ju_hua
type: item
parent: base_herb

short_desc: "Chrysanthemum Flowers"
long_desc: "Delicate chrysanthemum flowers bloom in white and yellow."
extra_desc: |
  Clusters of small, delicate flowers with many layered petals ranging
  from pale yellow to pure white. They release a gentle, floral scent
  when crushed. Called the "Queen of Fall Flowers," chrysanthemum cools
  the body and brightens the eyes. The monks steep them in tea to ease
  headaches and clear the mind.

