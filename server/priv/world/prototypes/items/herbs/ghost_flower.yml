# Ghost Flower - Cemetery spirit flower
# Blooms where the veil between worlds is thin

key: ghost_flower
parent: base_herb
type: item

short_desc: "Ghost Flower"
long_desc: "A translucent flower that seems to exist half in this world and half in another."
extra_desc: |
  This otherworldly bloom is cold to the touch and seems to shift in and out
  of visibility. It grows only in places of death and remembrance, fed by
  the memories of the departed. Those who carry it say they can sometimes
  hear whispers from the other side. Essential for rituals of the dead.
