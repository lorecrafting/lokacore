short_desc: "Dried Longan Fruit"
long_desc: "Dried longan fruits with translucent amber flesh lie here."
extra_desc: |
  Round, dried fruits with dark brown shells that crack open to reveal
  translucent amber flesh. Their name means "dragon eye" for their
  appearance when fresh. Sweet and fragrant, these fruits calm the
  spirit and ease anxiety. The monks use them to help restless
  sleepers find peace.

