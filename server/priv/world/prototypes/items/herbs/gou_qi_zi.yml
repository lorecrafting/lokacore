short_desc: "Goji Berries"
long_desc: "Bright red goji berries cling to a thorny shrub."
extra_desc: |
  Small, vibrant orange-red berries hang in clusters from a thorny
  shrub. Each berry is about the size of a fingernail, with a sweet,
  slightly tangy taste. The monks prize these as the "King of Berries"
  for their ability to nourish the blood and brighten tired eyes.
  They are often paired with chrysanthemum in healing teas.

