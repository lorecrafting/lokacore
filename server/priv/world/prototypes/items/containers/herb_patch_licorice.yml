# Licorice Herb Patch

key: herb_patch_licorice
parent: base_container
type: item

short_desc: "Licorice Patch"
long_desc: "A patch of licorice plants grows here, their sweet roots hidden beneath the soil."
extra_desc: |
  Feathery green leaves rise from tangled stems, marking the presence
  of licorice roots below. The monks prize gan cao as the "great
  harmonizer" - it appears in more formulas than any other herb.
  Carefully dig to unearth the sweet, woody roots.
keywords:
  - licorice
  - patch
  - herbs
  - gan
  - cao
primary_keyword: patch

components:
  physical:
    weight: 0
    stackable: false
  container:
    capacity: 3
    can_take: true
    can_put: false
    description_open: "You carefully examine the licorice plants."
    state_descriptions:
      full: "Several mature licorice roots are ready for harvest."
      partial: "A few licorice roots have matured."
      empty: "The licorice roots need more time to grow."
    respawn:
      enabled: true
      delay_seconds: 420  # 7 minutes - slightly rarer
      loot_table:
        - item: gan_cao
          weight: 100
          quantity: [1, 2]

tags:
  - container
  - herb_patch
  - no_get
  - furniture
