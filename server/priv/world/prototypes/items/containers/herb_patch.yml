# Herb Patch - A container for gathering herbs
# This is a static object in the room that players can "open" to see herbs inside
# and take them. The herbs respawn after some time.

key: herb_patch_ginger
parent: base_container
type: item

short_desc: "Ginger Patch"
long_desc: "A patch of ginger plants grows here, their golden roots peeking through the soil."
extra_desc: |
  Neat rows of ginger plants grow in well-tended soil. Their leaves sway
  gently in the breeze, and the pungent aroma of fresh ginger wafts up
  from where the golden roots push through the dark earth. The monks
  have clearly been nurturing this patch for some time.
keywords:
  - ginger
  - patch
  - herbs
primary_keyword: patch

components:
  physical:
    weight: 0  # Can't be picked up
    stackable: false
  container:
    capacity: 5
    can_take: true
    can_put: false  # Can't put items into herb patches
    description_open: "You examine the ginger patch closely."
    state_descriptions:
      full: "The patch is overflowing with ripe ginger roots."
      partial: "Some ginger roots are ready for harvesting."
      empty: "The patch has been picked clean. New growth will come in time."
    respawn:
      enabled: true
      delay_seconds: 300  # 5 minutes
      loot_table:
        - item: sheng_jiang
          weight: 100
          quantity: [1, 3]

tags:
  - container
  - herb_patch
  - no_get
  - furniture
