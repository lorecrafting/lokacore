# Ginger Patch - Fresh Ginger (Sheng Jiang)
# Warming herb used for digestion, nausea, and cold conditions

key: herb_patch_ginger
parent: base_container
type: item

short_desc: "Ginger Patch"
long_desc: "A patch of ginger plants grows here, their broad leaves hiding knobbly roots below."
extra_desc: |
  Broad, lance-shaped leaves rise from the dark soil, concealing the
  prized rhizomes beneath. The air carries a sharp, warm fragrance
  when the leaves brush together. Monks harvest these roots for
  teas that warm the body and settle the stomach.
keywords:
  - ginger
  - patch
  - sheng
  - jiang
primary_keyword: patch

components:
  physical:
    weight: 0
    stackable: false
  container:
    capacity: 3
    can_take: true
    can_put: false
    description_open: "You dig carefully around the ginger plants."
    state_descriptions:
      full: "Fat, knobbly ginger roots peek from the dark soil."
      partial: "A few ginger roots remain to be harvested."
      empty: "The soil has been thoroughly dug. New roots will grow in time."
    respawn:
      enabled: true
      delay_seconds: 300
      loot_table:
        - item: sheng_jiang
          weight: 100
          quantity: [1, 3]

tags:
  - container
  - herb_patch
  - no_get
  - furniture
