# Poria Mushroom Patch - Fu Ling (茯苓)
# Strengthens spleen, drains dampness, calms spirit

key: herb_patch_poria
parent: base_container
type: item

short_desc: "Poria Log"
long_desc: "A rotting pine log lies here, colonized by valuable poria fungus."
extra_desc: |
  A fallen pine log, perhaps a decade old, lies half-buried in the
  damp earth. The bark has long since rotted away, but the pale wood
  has become host to something precious: poria fungus grows within,
  forming dense white masses beneath the surface. The monks carefully
  cultivate these logs, knowing the fungus inside strengthens the
  spleen and calms an anxious heart.
keywords:
  - poria
  - log
  - fungus
  - mushroom
  - fu
  - ling
primary_keyword: log

components:
  physical:
    weight: 0
    stackable: false
  container:
    capacity: 2
    can_take: true
    can_put: false
    description_open: "You examine the poria log closely."
    state_descriptions:
      full: "White fungal masses are visible beneath the bark."
      partial: "Some poria remains in the log."
      empty: "The log has been harvested. New fungus will grow slowly."
    respawn:
      enabled: true
      delay_seconds: 600
      loot_table:
        - item: fu_ling
          weight: 100
          quantity: [1, 2]

tags:
  - container
  - herb_patch
  - no_get
  - furniture
