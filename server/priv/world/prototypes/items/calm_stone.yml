# Calm Stone - Key item for the Aversion trial
# Absorbs anger and prevents rage

key: calm_stone
short_desc: "Calm Stone"
long_desc: "a cool blue stone that pulses with a slow, steady rhythm"
keywords:
  - calm
  - stone
  - blue
