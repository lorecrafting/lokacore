key: grove_portal_arch
type: item
parent: base_item
short_desc: "mystical stone archway"
long_desc: "The ancient stone archway dominates this grove, its weathered surface inscribed with spiraling runes that pulse with ethereal blue light. The space within the arch shimmers and wavers like liquid starlight, offering glimpses of crystalline chambers beyond. When you focus on the portal's center, you sense vast magical energies held in perfect balance, waiting to transport those brave enough to step through. The runes seem to whisper secrets in a language older than memory."
