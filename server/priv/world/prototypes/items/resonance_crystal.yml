short_desc: "resonance crystal shard"
long_desc: "This crystal shard pulses with inner light, its faceted surface warm to the touch despite the cool underground air. Veins of silver energy flow through its translucent blue core like captured lightning. When held up to the light, the crystal projects faint runic symbols that hover in the air for moments before fading. The shard hums with magical resonance, creating a barely audible tone that seems to harmonize with the portal's energy."
