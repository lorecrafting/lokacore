# Lamp of Wisdom - Key item for the Ignorance Trial
# Dispels the darkness and illusions in Moha's realm

key: lamp_of_wisdom
short_desc: "Lamp of Wisdom"
long_desc: "a small butter lamp that burns with a steady, clarifying flame"
keywords:
  - lamp
  - wisdom
  - light
  - butter
primary_keyword: lamp
type: item
parent: base_item
extra_desc: |
  This simple butter lamp seems ordinary at first glance - a small
  brass dish with a cotton wick floating in clarified butter. But
  when lit, its flame never wavers, even in the strongest wind.
  In its steady light, illusions dissolve and confusion clears.
  The monks say it was blessed by Lama Tenzin before his descent
  into the caves.
components:
  physical:
    weight: 0.5
  valuable:
    base_price: 0
    cannot_sell: true
  usable:
    use_message: "You raise the lamp high. Its steady flame pushes back the darkness, revealing truth where shadows once reigned."
    use_effect:
      type: buff
      buff_type: clarity
      duration: 600
      bonus:
        - type: damage
          amount: 10
          vs_tags:
            - ignorance
            - illusion
        - type: defense
          amount: 5
          vs_tags:
            - confusion
    cooldown: 30
