short_desc: "Cave Fish"
long_desc: "A pale, translucent fish drifts in the dark water."
extra_desc: |
  Completely eyeless and nearly transparent, this small fish has
  adapted to total darkness over countless generations. Its lateral
  line is highly developed, sensing the slightest current change.
  The monks consider them sacred, symbols of finding one's way
  without sight.
