    cannot_sell: true
  usable:
    use_message: "You gaze into the mirror. For a moment, you see not your face but the truth beneath all surfaces."
    use_effect:
      type: buff
      buff_type: true_sight
      duration: 300
      bonus:
        - type: damage
          amount: 10
          vs_tags:
            - attachment
            - illusion
            - phantom
        - type: accuracy
          amount: 10
          vs_tags:
            - illusion
    cooldown: 60
