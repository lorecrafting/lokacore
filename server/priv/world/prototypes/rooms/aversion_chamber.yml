key: aversion_chamber
parent: base_room
type: room
short_desc: "Chamber of Aversion"
long_desc: "A searing chamber of rage where fury guardians patrol walls carved with scenes of vengeance."
extra_desc: |
  Heat blasts in waves of anger made manifest. Walls carved with battle and vengeance seethe with rage while Fury Guardians patrol the passage. This is Dvesha's domain, where hatred feeds upon itself.
keywords: []
exits:
  west: preparation_chamber
  east: dveshas_core
spawns:
  - prototype: fury_guardian
tags:
  - indoor
  - cave
  - ancient
  - dim_light
  - dangerous
  - trial_chamber
components:
  ambient_messages:
    day:
      - "Heat blasts against you in waves, anger made tangible."
      - "The carved walls seethe with scenes of betrayal and vengeance."
      - "Old wounds throb. Old slights burn fresh in memory."
      - "The stone itself seems to radiate hatred, ancient and undying."
      - "Fury Guardians pace the shadows, wrathful and hungry."
      - "Your fists clench without conscious thought. Blood pounds in your temples."
      - "Every enemy you've ever made seems to stand just out of sight, mocking."
      - "Hatred rises in your chest, the second poison demanding release."
  on_enter_script: aversion_anger
  room_elements:
    fire: medium
