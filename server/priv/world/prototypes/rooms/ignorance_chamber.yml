key: ignorance_chamber
parent: base_room
type: room
short_desc: "Chamber of Ignorance"
long_desc: "A twisting passage of living shadows where confusion wisps lead travelers astray."
extra_desc: |
  Darkness swallows light, the passage twisting impossibly as walls appear where none stood moments before. Confusion Wisps drift through murk leading nowhere. This is Moha's domain, the realm of delusion.
keywords: []
exits:
  north: preparation_chamber
  south: mohas_core
spawns:
  - prototype: confusion_wisp
  - prototype: mirror_illusion
tags:
  - indoor
  - cave
  - ancient
  - dark
  - dangerous
  - trial_chamber
components:
  ambient_messages:
    day:
      - "Darkness swallows your light, hungry and absolute."
      - "The passage twists impossibly, walls appearing where none stood before."
      - "Confusion Wisps drift past, their pale glow leading nowhere."
      - "Your own reflection leers back from the darkness, distorted and wrong."
      - "Which way is forward? Which way is back? The distinction blurs."
      - "Shadows move with purpose, alive with ancient delusion."
      - "Your thoughts scatter like startled birds, impossible to gather."
      - "Ignorance clouds all perception, the third poison veiling truth."
  on_enter_script: ignorance_confusion
  room_elements:
    shadow: high
