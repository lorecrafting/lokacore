key: watchers_post
type: room
short_desc: "The Watchers' Post"
extra_desc: |
  An elevated platform in the canopy of one of the great boundary trees, reached by worn handholds in the bark. The eastern groves spread below in both directions. The sightlines are unnaturally clear — the canopy arranged so that three directions lie open with no interference. Brennan spends his mornings here before his circuit begins.

exits:
  east: eastern_edge_grove

spawns:
  - prototype: brennan

tags:
