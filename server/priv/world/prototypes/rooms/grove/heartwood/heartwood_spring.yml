short_desc: "The Spring"
extra_desc: |
  A shallow pool gathers at the base of a mossy outcropping, fed by water welling up from somewhere below. The stones lining the pool are uniformly smooth — not river-worn, but shaped. Along the western edge, the water flows briefly upward before rejoining the pool. It has always done this. No one seems to have noticed.

