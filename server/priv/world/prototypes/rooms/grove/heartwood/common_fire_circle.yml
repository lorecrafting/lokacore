key: common_fire_circle
type: room
short_desc: "The Common Fire"
extra_desc: |
  A wide stone ring surrounds a fire that burns through all seasons. Tenders eat, argue, tell stories, and fall asleep here against the warm stones. The fire never runs low and never runs high — steady regardless of how much wood is given. The flames lean slightly inward, always toward center.

