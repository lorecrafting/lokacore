key: south_understory
type: room
short_desc: "The South Understory"
extra_desc: |
  The canopy closes thick here, the paths below dim and quiet. This is the understory network — a web of routes connecting the groves to each other below the level where Tenders usually work. The paths are worn by generations of passage, though no one is sure who made them first.

