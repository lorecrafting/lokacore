key: hidden_hollow
type: room
short_desc: "The Hidden Hollow"
extra_desc: |
  A secluded depression between root systems where the canopy overhead is too dense for wind to reach. Tenders who need solitude find their way here eventually — somehow always quiet, always sheltered, even when the grove around it is active. No one told them about it. They just found it.

exits:
  west: brennan_path

tags:
  - outdoor
