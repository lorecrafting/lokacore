extra_desc: |
  Cultivated trees heavy with fruit grow in generous rows, tended by Shapers and Gatherers who move between them with baskets. The harvest is always good. Two hundred years of growing from the same soil, never fertilized, never depleted — perfect yields every season, without exception.

