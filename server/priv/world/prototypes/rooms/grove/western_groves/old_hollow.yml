short_desc: "The Old Hollow"
extra_desc: |
  An ancient tree with a hollow large enough to shelter several people, the interior dry and faintly warm. Tenders come here alone when they need quiet. Inside the hollow, on the curve of the inner wall, are markings that predate any living Tender's memory — too regular to be scarring, too deliberate to be growth.

exits:
  east: western_orchard

