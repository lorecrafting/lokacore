key: blight_zone
type: room
short_desc: "The Dying Trees"
extra_desc: |
  Trees along the eastern reach have begun to blacken — leaves curling inward, bark splitting in long seams, ground cracked beneath them. The dying follows a line: not the wandering spread of disease, but a perfectly straight line that turns at a sharp right angle before continuing. Organic rot does not work this way. Kira has been watching.

