key: heartroot_antechamber
type: room
short_desc: "The Heartroot Antechamber"
extra_desc: |
  A passage descending from the Deep, cut through living root and old stone. The air changes: warmer, more humid, carrying the smell of old wood and something faintly electrical. The walls narrow. The roots here are densest. The Rootsong shifts — less overwhelming, more specific, as if something has become aware you are approaching.

exits:
  up: the_deep
  north: heartroot_chamber

tags:
  - underground
  - indoor
