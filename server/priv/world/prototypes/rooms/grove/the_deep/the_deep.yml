short_desc: "The Deep"
extra_desc: |
  Trees older than memory rise here in near-total silence. Their bark is covered in geometric patterns — whorls and lines too regular to be growth, too deliberate to ignore. Under close examination they look, uncomfortably, like circuit traces. The ground is warm with no sun source. The Rootsong is overwhelming: a sound beneath sound, pressing from every direction at once.

