key: forge
parent: base_room
type: room
short_desc: "The Forge"
long_desc: "A sooty smithy where the ring of hammer on metal echoes constantly."
extra_desc: |
  Heat washes over you from the central hearth, casting shadows on walls blackened by generations of smoke. Blades line one wall, armor and tools crowd the other, and a stone trough sits ready for quenching.
keywords: []
exits:
  west: village_square
spawns:
  - prototype: blacksmith_tashi
tags:
  - indoor
  - village
  - safe_zone
  - shop
  - crafting_station
components:
  ambient_messages:
    dawn:
      - "The forge fire is stoked to life, coals glowing with renewed purpose."
    day:
      - "The hammer rings against hot metal, sending sparks flying like fireflies."
      - "Hot metal hisses as it plunges into the quenching trough, steam billowing upward."
      - "The smell of smoke, hot iron, and honest sweat fills the smithy."
      - "Blades gleam on the wall, each one a prayer made manifest in steel."
    night:
      - "The forge fire burns low, coals pulsing like a sleeping heart."
      - "Charcoal crackles and pops, feeding the forge's eternal hunger."
  crafting_station:
    type: forge
    available_recipes:
      - reinforce_armor
      - sharpen_blade
      - forge_blessed_blade
