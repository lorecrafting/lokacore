name: "Village"
description: |
  A small settlement clings to the mountainside below the monastery,
  its rough stone houses huddled together against the wind. Smoke rises
  from cooking fires, carrying the scent of tsampa and yak butter.

  Villagers go about their daily tasks with the unhurried rhythm of
  mountain life. Prayer wheels spin in doorways, their mantras joining
  the distant chanting from above.
