key: threshold
parent: base_room
type: room
short_desc: "Threshold"
long_desc: "An ancient doorway into sacred ground, its walls carved with symbols older than the monastery."
extra_desc: |
  Beyond the doorway, walls are carved with symbols older than the monastery—mandalas, protective deities, warnings in forgotten scripts. Butter lamps flicker in niches, and the still air carries the weight of ages.
keywords: []
exits:
  west: cave_entrance
  east: preparation_chamber
tags:
  - indoor
  - cave
  - ancient
  - dim_light
  - room_entry_effect
components:
  ambient_messages:
    day:
      - "Butter lamps flicker in their niches, flames dancing without wind."
      - "Carved mandalas seem to turn slowly when not directly observed."
      - "The weight of ages presses down, countless seekers having passed this way."
      - "Protective deities glare from the walls, their painted eyes following movement."
    night:
      - "Cold air settles against your skin like a living thing."
      - "Warnings in forgotten scripts seem to pulse with urgency."
      - "The shadows between the carvings are too deep, too dark."
      - "This is sacred ground. What lies ahead will test you utterly."
