key: attachment_chamber
parent: base_room
type: room
short_desc: "Chamber of Attachment"
long_desc: "A golden chamber filled with impossible treasures that beckon with seductive illusion."
extra_desc: |
  Golden light emanates from piles of treasure—coins, jewels, silks gleaming with impossible beauty. Phantom hands reach from the piles, beckoning. This is Raga's domain, where craving manifests as seductive illusion.
keywords: []
exits:
  south: preparation_chamber
  north: ragas_core
spawns:
  - prototype: phantom_treasure
tags:
  - indoor
  - cave
  - ancient
  - dim_light
  - dangerous
  - trial_chamber
components:
  ambient_messages:
    day:
      - "Golden light pulses seductively from impossible treasures."
      - "Phantom hands reach from jeweled piles, beckoning with promise."
      - "The treasures shift when you look away, rearranging into new temptations."
      - "Everything you have ever desired whispers your name."
      - "Silk rustles. Coins clink. Beauty calls with a thousand voices."
      - "The air tastes of honey and wanting, sweet enough to choke."
      - "Reflections in golden surfaces show you wearing crowns, robed in splendor."
      - "Craving coils around your heart, the first poison made manifest."
  on_enter_script: attachment_temptation
