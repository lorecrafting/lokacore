short_desc: "Lira's Memorial"
extra_desc: |
  The statue is the same. What is different: you know who she is now. Not historical — present, in the Pulse, in the root network, in every tree that grew exactly where it was supposed to. The grove landed on the planet she chose. She did not stop when she became the Heart. She aimed.
