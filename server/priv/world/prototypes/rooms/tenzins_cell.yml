key: tenzins_cell
parent: base_room
type: room
short_desc: "Tenzin's Cell"
long_desc: "A small meditation chamber that feels vast, where the master sits in perfect stillness."
extra_desc: |
  The master's chamber is barely large enough for a single cushion and desk, yet feels vast. Lama Tenzin sits motionless, breath so subtle he might be carved from stillness. A cold draft flows from a passage to the east.
keywords: []
exits:
  west: meditation_hall
  east: cave_entrance
spawns:
  - prototype: lama_tenzin
  - prototype: meditation_journal
tags:
  - indoor
  - monastery
  - safe_zone
  - quest_location
components:
  ambient_messages:
    day:
      - "The master's breath is barely perceptible, slow as the turning of seasons."
      - "A faint golden glow seems to emanate from Tenzin's still form."
      - "Cold air drifts from the eastern passage, carrying whispers of deep places."
      - "Space seems to bend around the meditating master, vast within the small room."
    night:
      - "The pages of the meditation journal flutter though there is no wind."
      - "The shadows in the corners seem deeper here, more alive."
      - "Time moves differently in this space, each moment stretching toward eternity."
