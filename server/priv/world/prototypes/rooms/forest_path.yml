name: "Forest Path"
description: |
  A narrow dirt path winds through ancient oaks and gnarled pines.
  Dappled sunlight filters through the thick canopy above. The
  sounds of the village fade behind you, replaced by birdsong and
  the rustle of leaves. The path continues deeper into the forest.
