key: mountain_peak
parent: base_room
type: room
short_desc: "Mountain Peak"
long_desc: "A wind-scoured summit rising above the clouds where prayer flags stream against endless sky."
extra_desc: |
  The summit rises above the clouds, prayer flags streaming from a cairn against endless blue sky. Ranges upon ranges stretch to every horizon, and at dawn, revelations are said to come to those with eyes to see.
keywords: []
exits:
  down: cliff_path
tags:
  - outdoor
  - mountain
  - sacred
  - weather_affected
  - quest_location
  - room_entry_effect
components:
  gathering_nodes:
    mountain_herb:
      uses_remaining: 1
  ambient_messages:
    dawn:
      - "In this place between earth and sky, revelation feels within reach."
      - "The first light touches the cairn, turning prayer flags to gold."
    day:
      - "Wind screams across the exposed summit, raw and untamed."
      - "Prayer flags stream horizontally, vivid colors against endless blue."
      - "Clouds boil below, an ocean of white obscuring the world beneath."
      - "The air is thin here, each breath a precious gift."
    night:
      - "The cairn of stones hums with accumulated prayers, centuries of devotion."
      - "Ranges upon ranges of mountains stretch to every horizon beneath starlight."
  room_elements:
    air: high
  time_locked_items:
    - item: sutra_of_perfect_wisdom
      time: dawn
