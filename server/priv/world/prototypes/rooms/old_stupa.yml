key: old_stupa
parent: base_room
type: room
short_desc: "Old Stupa"
long_desc: "An ancient weathered stupa whose all-seeing eyes gaze serenely across the mountains."
extra_desc: |
  An ancient stupa rises from the hillside, whitewash cracked by centuries of storms. All-seeing eyes gaze serenely from its spire while a stone platform sits blackened by countless butter lamps—old beyond memory.
keywords: []
exits:
  west: cemetery
tags:
  - outdoor
  - sacred
  - offering_shrine
components:
  ambient_messages:
    dawn:
      - "The faded gold leaf catches the first light, remembering when it shone bright."
    day:
      - "The all-seeing eyes gaze serenely in four directions, patient as mountains."
      - "The offering platform is blackened by countless butter lamps, devotion made visible."
      - "A sense of profound antiquity settles over you, time made palpable."
    night:
      - "Wind whispers around the ancient spire, carrying centuries of prayers."
      - "This place was old when the monastery was young, a link to dharma's earliest days."
  offering_shrine:
    type: aversion
    bonus: 10
