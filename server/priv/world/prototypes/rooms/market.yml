key: market
parent: base_room
type: room
short_desc: "Market"
long_desc: "A colorful plaza of merchants and quiet haggling beneath weathered awnings."
extra_desc: |
  Colorful awnings shade weathered tables where merchants display dried herbs, woven blankets, and curious trinkets from distant lands. The air buzzes with quiet haggling and the clink of coins.
keywords: []
exits:
  east: village_square
spawns:
  - prototype: merchant_dorje
tags:
  - outdoor
  - village
  - safe_zone
  - shop
components:
  ambient_messages:
    dawn:
      - "Merchants arrive early, setting up their wares for the day's trade."
    day:
      - "Coins clink softly as a transaction completes, the ancient rhythm of trade."
      - "A merchant calls out the virtues of their wares in a singsong voice."
      - "Someone carefully examines a woven blanket, testing its warmth."
      - "The scent of dried herbs mingles with the smell of worked leather."
    dusk:
      - "Merchants pack away their wares, counting the day's earnings."
    night:
      - "Empty stalls stand silent, awaiting tomorrow's commerce."
