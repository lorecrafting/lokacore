name: "Market"
description: |
  Colorful awnings stretch over a small plaza where merchants display
  their wares on weathered wooden tables. The air buzzes with quiet
  haggling and the clink of coins changing hands.

  Despite the monastery's crisis, trade continues. Dried herbs, woven
  blankets, and simple tools share space with the occasional curious
  trinket from distant lands.
