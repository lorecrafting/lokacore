name: "Main Courtyard"
description: |
  A broad courtyard of worn flagstones opens before you, embraced
  by the monastery's whitewashed walls. At its heart, an ancient
  cherry tree spreads its branches over a moss-covered fountain,
  its waters trickling with patient persistence.

  Buildings surround the courtyard: the golden-roofed temple to the
  north, the meditation hall to the east, and the dining hall to the
  west. The main gate lies to the south.
exits:
