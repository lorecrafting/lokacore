  - monastery
  - safe_zone
  - central_hub
components:
  ambient_messages:
    dawn:
      - "The fountain's waters catch the first light, sending ripples of gold across the stones."
    day:
      - "Water trickles softly from the moss-covered fountain."
      - "Cherry blossoms drift down from the ancient tree, pink against the grey stones."
      - "A raven lands on the cherry tree, regarding the courtyard with knowing eyes."
