long_desc: "A broad courtyard with an ancient cherry tree shading a moss-covered fountain."
extra_desc: |
  Worn flagstones stretch beneath an ancient cherry tree shading a moss-covered fountain whose waters trickle patiently. The temple rises to the north, meditation hall to the east, dining hall west.
