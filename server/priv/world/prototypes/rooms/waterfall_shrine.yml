key: waterfall_shrine
parent: base_room
type: room
short_desc: "Waterfall Shrine"
long_desc: "A misty shrine beside cascading waters where white stones reveal truths to seekers."
extra_desc: |
  Crystal water cascades into a smooth pool beside a small shrine laden with flower offerings. Mist fills the air, and white river stones gleam beneath the surface, their patterns said to reveal hidden truths.
keywords: []
exits:
  west: cliff_path
spawns:
  - prototype: lama_yeshe
  - prototype: white_river_stone
  - prototype: white_river_stone
tags:
  - outdoor
  - sacred
  - water
  - offering_shrine
  - room_entry_effect
components:
  gathering_nodes:
    river_stones:
      uses_remaining: 2
  ambient_messages:
    dawn:
      - "A rainbow arcs through the morning spray, vivid against the mist."
    day:
      - "The waterfall thunders endlessly, drowning all thought in white noise."
      - "White river stones gleam beneath the surface, their patterns shifting, almost readable."
      - "Offerings of flowers bob gently in the pool's current."
      - "Mist swirls around you, cool droplets beading on your skin."
    night:
      - "Something moves in the spray - a figure? Or just tricks of moonlight and water?"
      - "The roar of falling water seems to carry distant voices, or perhaps chanting."
  room_elements:
    water: high
    stone: medium
  offering_shrine:
    type: attachment
    bonus: 10
