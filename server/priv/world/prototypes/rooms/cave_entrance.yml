key: cave_entrance
parent: base_room
type: room
short_desc: "Cave Entrance"
long_desc: "An ancient stone doorway carved into the mountain, covered in warnings of trials within."
extra_desc: |
  An ancient doorway carved into the mountain itself, its surface covered in warnings so old the elders cannot translate them. Beyond the threshold darkness waits, the air flowing from within neither warm nor cold.
keywords: []
exits:
  west: tenzins_cell
  east: threshold
locks:
  enter_east: "has_item(cave_entrance_key)"
tags:
  - indoor
  - cave
  - transition_zone
  - quest_gate
  - room_entry_effect
components:
  ambient_messages:
    day:
      - "Ancient warnings carved in stone seem to writhe at the edge of vision."
      - "The air from within is neither warm nor cold, existing outside ordinary sense."
      - "The script on the walls shifts subtly, meanings dancing just out of reach."
      - "The stone doorway seems older than the mountain itself."
    night:
      - "Darkness breathes beyond the threshold, patient and waiting."
      - "Echoes of distant sounds drift from the darkness: chanting? Screaming? Silence?"
      - "The boundary between the monastery's peace and something ancient trembles here."
