key: meditation_hall
parent: base_room
type: room
short_desc: "Meditation Hall"
long_desc: "An austere hall of worn cushions and silent stillness, polished by countless hours of practice."
extra_desc: |
  Rows of worn cushions face a simple altar bearing a single lotus flower. Wooden floors polished by countless hours of practice gleam beneath shafts of mountain light, and the air is utterly still.
keywords: []
exits:
  west: main_courtyard
  east: tenzins_cell
  north: guest_hall
spawns:
  - prototype: teacher_lobsang
tags:
  - indoor
  - monastery
  - safe_zone
  - meditation
components:
  ambient_messages:
    dawn:
      - "A shaft of pale light touches the polished floor as the hall awakens to stillness."
    day:
      - "The stillness deepens, as if the room itself is meditating."
      - "The single lotus flower on the altar seems to glow with inner light."
      - "Dust motes hang suspended in the air, frozen in contemplation."
      - "A sense of profound peace washes over the hall."
    night:
      - "The altar candle flame burns perfectly still, the only light in profound darkness."
