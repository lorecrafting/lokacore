long_desc: "A modest hall of long wooden tables marked by generations of shared meals."
extra_desc: |
  Long wooden tables marked by generations of shared meals stretch across the hall, the scent of butter tea lingering from the warm kitchen. Fresh wildflowers in a clay pot brighten the central table.
