    day:
      - "Cold fire burns without consuming, hatred given form."
      - "Phantom enemies stand in array, their faces twisted with malice."
      - "Old wounds ache as if freshly dealt. Old angers surge."
      - "Dvesha Mara's armor of rage reflects your own fury back at you."
