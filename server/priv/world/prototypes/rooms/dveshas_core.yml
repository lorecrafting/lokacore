key: dveshas_core
parent: base_room
type: room
name: "Dvesha's Core"
description: |
  The chamber burns with cold fire - hatred crystallized into
  form. Every enemy you have ever known stands here in phantom
  array, their faces twisted with malice. Old wounds ache, old
  angers rise.

  At the center, wreathed in flames that do not consume, stands
  Dvesha Mara. The demon of aversion wears armor of solidified
  rage, its eyes pits of endless fury. It reflects back every
  strike with greater force - only patience can pierce its guard.
