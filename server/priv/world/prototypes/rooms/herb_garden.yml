key: herb_garden
parent: base_room
type: room
short_desc: "Monastery Herb Garden"
long_desc: "A peaceful garden where medicinal herbs grow in neat rows, tended by the monks."
extra_desc: |
  Medicinal herbs grow in careful rows within these sheltered walls, the air thick with ginger, licorice, and chrysanthemum. Small wooden markers in flowing calligraphy name each variety while a stream trickles through.
keywords: []
exits:
  east: monastery_gate
  south: terraced_fields
spawns:
  - prototype: herb_master_dolkar
  - prototype: herb_patch_ginger      # Ginger (Sheng Jiang)
  - prototype: herb_patch_jujube     # Jujube dates (Da Zao)
  - prototype: herb_patch_licorice   # Licorice root (Gan Cao)
  - prototype: herb_patch_chrysanthemum  # Chrysanthemum (Ju Hua)
tags:
  - outdoor
  - monastery
  - safe_zone
  - herbs
  - healing
components:
  gathering_nodes:
    ginger_patch:
      uses_remaining: 3
    jujube_patch:
      uses_remaining: 4
    licorice_patch:
      uses_remaining: 2
    chrysanthemum_patch:
      uses_remaining: 4
    atractylodes_patch:
      uses_remaining: 2
  ambient_messages:
    dawn:
      - "Morning dew glistens on herb leaves, each droplet a tiny lens of light."
    day:
      - "The air is thick with healing scents: ginger, licorice, chrysanthemum."
      - "A bee drones lazily from flower to flower, heavy with pollen."
      - "Calligraphy on wooden markers names each plant: prayers made botanical."
      - "Sunlight dapples through the garden, warming the medicine-plants."
    night:
      - "Night-blooming herbs release their subtle fragrances to the cool air."
