# Base Container Prototype
# Containers can hold items and optionally respawn their contents
#
# Container Component Fields:
#   capacity: Maximum number of items (default 10)
#   can_take: Whether items can be taken (default true)
#   can_put: Whether items can be added (default true)
#   locked: Whether the container requires a key (default false)
#   lock_key: Item key required to unlock
#   description_open: Text shown when container is open
#   description_closed: Text shown when closed/locked
#   state_descriptions:
#     full: "The container is stuffed full."
#     partial: "There are some items inside."
#     empty: "It's empty."
#   respawn:
#     enabled: Whether items respawn after being taken
#     delay_seconds: Time until respawn (default 300)
#     loot_table: List of weighted item drops
#       - item: item_key
#         weight: 50
#         quantity: [1, 3]  # Range or single number

key: base_container
type: item

short_desc: "Container"
long_desc: "A container sits here."
extra_desc: "A simple container for storing items."
keywords:
  - container

components:
  physical:
    weight: 5.0
    stackable: false
  container:
    capacity: 10
    can_take: true
    can_put: true
    locked: false
    description_open: "The container is open."
    description_closed: "A closed container."

tags:
  - container
  - furniture
