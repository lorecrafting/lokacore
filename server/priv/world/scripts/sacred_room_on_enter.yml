key: sacred_room_on_enter
type: script
name: "Sacred Room Entry Effects"
description: "Shows special descriptions for sacred locations"
tags: [room, sacred, atmosphere]
data:
  hook: at_enter_room
  source: |
    # Show special descriptions for sacred locations
    if "offering_shrine" in (context.room.tags || []) do
      message.("You sense this is a place where offerings have power.")
    end

    continue.()
