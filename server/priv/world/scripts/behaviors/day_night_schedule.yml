key: day_night_schedule
type: script
name: "Day/Night Schedule Behavior"
description: "Makes an NPC follow a wake/sleep cycle, moving between locations and emitting events"
tags: [behavior, schedule, day_night]
data:
  hook: behavior
  events: [dawn, dusk, morning, evening, noon, midnight]
  config_schema:
    wake_at:
      type: atom
      default: dawn
      description: "Time event to wake at (dawn, morning, noon)"
    sleep_at:
      type: atom
      default: dusk
      description: "Time event to sleep at (dusk, evening, midnight)"
    wake_room:
      type: string
      description: "Room key to move to when waking (optional)"
    sleep_room:
      type: string
      description: "Room key to move to when sleeping (optional)"
    stagger_max:
      type: integer
      default: 90
      min: 0
      max: 300
      description: "Maximum seconds to randomly delay emotes (prevents all NPCs emoting at once)"
    emote_chance:
      type: float
      default: 0.85
      min: 0.0
      max: 1.0
      description: "Probability (0.0-1.0) of emoting on wake/sleep events"
  source: |
    # Day/Night Schedule - respond to time events with staggered emotes
    event = context.event
    wake_event = config.wake_at || :dawn
    sleep_event = config.sleep_at || :dusk
    stagger_max = config.stagger_max || 90
    emote_chance = config.emote_chance || 0.85

    # Convert config to atoms for comparison if needed
    wake_event = if is_binary(wake_event), do: String.to_atom(wake_event), else: wake_event
    sleep_event = if is_binary(sleep_event), do: String.to_atom(sleep_event), else: sleep_event

    cond do
      # Wake up event
      event == wake_event ->
        # Schedule staggered emote (random delay prevents spam when multiple NPCs wake)
        stagger_delay = if stagger_max > 0, do: :rand.uniform(stagger_max), else: 0
        set_behavior_state(:pending_emote, :waking_up)
        set_behavior_state(:pending_emote_chance, emote_chance)
        after(stagger_delay, "day_night_staggered_emote")

        # Move to wake room if configured (immediate, not staggered)
        wake_room = config.wake_room
        if wake_room do
          teleport(entity.id, wake_room)
          # Schedule arrival emote with additional stagger
          set_behavior_state(:pending_emote, :arrived_at_work)
          after(stagger_delay + 5, "day_night_staggered_emote")
        end

        set_behavior_state(:awake, true)
        handled()

      # Sleep event
      event == sleep_event ->
        # Schedule staggered emote
        stagger_delay = if stagger_max > 0, do: :rand.uniform(stagger_max), else: 0
        set_behavior_state(:pending_emote, :going_to_sleep)
        set_behavior_state(:pending_emote_chance, emote_chance)
        after(stagger_delay, "day_night_staggered_emote")

        # Move to sleep room if configured
        sleep_room = config.sleep_room
        if sleep_room do
          teleport(entity.id, sleep_room)
          set_behavior_state(:pending_emote, :arrived_home)
          after(stagger_delay + 5, "day_night_staggered_emote")
        end

        set_behavior_state(:awake, false)
        handled()

      true ->
        continue()
    end
