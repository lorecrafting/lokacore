key: veilkeeper_ambient
type: script
name: "Veilkeeper Ambient Behavior"
description: "Ambient behavior script for the Veilkeeper NPC. Controls periodic emotes, portal interactions, and environmental effects."
tags: [npc, ambient, portal]
data:
  hook: behavior
  source: |
    # Veilkeeper ambient behavior
    # Cycles through atmospheric emotes and portal interactions

    roll = :rand.uniform(100)

    cond do
      # Portal resonance event (rare, dramatic)
      roll <= 10 ->
        emote.("portal_pulse")

      # Check if players are in room
      length(entities_in_room.("player")) > 0 and roll <= 60 ->
        emote.("notice_player")

      # Standard idle emotes
      roll <= 75 ->
        emote.("idle_1")

      roll <= 85 ->
        emote.("idle_2")

      roll <= 95 ->
        emote.("idle_3")

      true ->
        emote.("idle_4")
    end
