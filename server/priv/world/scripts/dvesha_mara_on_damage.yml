key: dvesha_mara_on_damage
type: script
name: "Dvesha Mara Damage Reflection"
description: "Dvesha Mara reflects damage when attacked recklessly"
tags: [combat, boss, dvesha_mara]
data:
  hook: at_damage
  source: |
    target = context.target

    if target.key == "dvesha_mara" do
      attacker = context.attacker
      damage = context.damage
      attack_type = context.attack_type

      # Reckless attacks (not in patient stance) get reflected
      if attack_type == "attack" and not has_status?(attacker, "patient_stance") do
        reflected = div(damage, 4)  # 25% reflection
        apply_damage(attacker, reflected)
        message.("Your hasty attack is reflected! #{reflected} damage to you!")
        continue.()
      end

      # Patient attacks do bonus damage
      if has_status?(attacker, "patient_stance") do
        bonus = div(damage, 2)  # 50% bonus
        message.("Your patience pierces Dvesha's guard! +#{bonus} damage!")
        # Return modified damage
        default.(damage + bonus)
      else
        continue.()
      end
    else
      continue.()
    end
