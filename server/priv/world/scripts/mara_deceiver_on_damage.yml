key: mara_deceiver_on_damage
type: script
name: "Final Mara Damage Handler"
description: "Handles damage events for the Deceiver boss fight"
tags: [combat, boss, mara_deceiver, final_boss]
data:
  hook: at_damage
  source: |
    target = context.target

    if target.key == "mara_the_deceiver" do
      damage = context.damage
      continue.(damage)
    else
      continue.()
    end
