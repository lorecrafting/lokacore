key: mara_deceiver_on_defeat
type: script
name: "Final Mara Defeat Sequence"
description: "Triggers the final choice cutscene when Mara is defeated"
tags: [combat, boss, mara_deceiver, final_boss, story]
data:
  hook: at_enemy_defeat
  source: |
    enemy = context.enemy

    if enemy.key == "mara_the_deceiver" do
      # Trigger the final choice cutscene
      # show_cutscene("final_choice")
      message.("Mara falls... but something feels incomplete.")
    end

    continue.()
