# =============================================================================
# Social/Emote Commands
# =============================================================================
# Data-driven social commands for roleplay and expression.
#
# Each social has message slots for different contexts:
#   - no_target: When used alone (e.g., "smile")
#   - with_target: When targeting someone (e.g., "smile bob")
#   - self_target: When targeting yourself (e.g., "smile self")
#   - not_found: When target isn't found
#
# Variables available in messages:
#   {actor}           - The person performing the action
#   {target}          - The person being targeted
#   {actor_subjective} - he/she/they (actor)
#   {actor_objective}  - him/her/them (actor)
#   {actor_possessive} - his/her/their (actor)
#   {target_subjective} - he/she/they (target)
#   {target_objective}  - him/her/them (target)
#   {target_possessive} - his/her/their (target)
#   {self_pronoun}     - himself/herself/themself
# =============================================================================

socials:

