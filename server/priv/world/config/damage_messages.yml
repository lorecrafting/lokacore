      - "{target}'s shield absorbs {attacker}'s blow!"

# Critical hit messages
critical:
  melee:
    to_attacker:
      - "**CRITICAL!** You strike {target} with devastating precision!"
      - "**CRITICAL!** You find a gap in {target}'s defenses!"
      - "**CRITICAL!** Your blow lands with bone-crushing force!"
    to_defender:
      - "**CRITICAL!** {attacker} strikes you with devastating precision!"
      - "**CRITICAL!** {attacker} finds a gap in your defenses!"
      - "**CRITICAL!** {attacker}'s blow lands with bone-crushing force!"
    to_room:
      - "**CRITICAL!** {attacker} strikes {target} with devastating precision!"
      - "**CRITICAL!** {attacker} finds a gap in {target}'s defenses!"

  backstab:
    to_attacker:
      - "You plunge your blade into {target}'s back!"
      - "Your backstab catches {target} completely unaware!"
    to_defender:
      - "{attacker} stabs you in the back!"
      - "{attacker}'s blade bites into your back!"
    to_room:
      - "{attacker} backstabs {target}!"
      - "{attacker} strikes {target} from behind!"

# Death messages
death:
  normal:
    to_attacker:
      - "You have slain {target}!"
      - "{target} falls before your might!"
      - "With a final blow, you defeat {target}!"
    to_defender:
      - "{attacker} has slain you!"
      - "You fall before {attacker}'s might!"
      - "{attacker} delivers the killing blow!"
    to_room:
      - "{attacker} has slain {target}!"
      - "{target} falls before {attacker}'s might!"
      - "{attacker} delivers the killing blow to {target}!"

  overkill:
    to_attacker:
      - "You utterly **ANNIHILATE** {target}!"
      - "You destroy {target} in a brutal display of power!"
      - "{target} is no match for your overwhelming might!"
    to_defender:
      - "{attacker} utterly **ANNIHILATES** you!"
      - "{attacker} destroys you in a brutal display of power!"
      - "You are no match for {attacker}'s overwhelming might!"
    to_room:
      - "{attacker} utterly **ANNIHILATES** {target}!"
      - "{attacker} destroys {target} in a brutal display of power!"

# Defensive stance messages
defense:
  enter:
    to_attacker:
      - "You raise your guard and take a defensive stance."
      - "You prepare to defend yourself."
      - "You brace yourself for incoming attacks."
    to_room:
      - "{attacker} raises their guard."
      - "{attacker} takes a defensive stance."
      - "{attacker} braces for incoming attacks."

  enemy_enter:
    to_defender:
      - "{target} raises its guard."
      - "{target} takes a defensive stance."
      - "{target} braces itself."
    to_room:
      - "{target} raises its guard."
      - "{target} takes a defensive stance."

# Flee messages
flee:
  success:
    to_attacker:
      - "You successfully flee from combat!"
      - "You manage to escape!"
      - "You disengage and retreat to safety!"
    to_room:
      - "{attacker} flees from {target}!"
