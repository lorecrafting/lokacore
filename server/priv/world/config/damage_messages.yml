# Damage Message Configuration
# Tier-based descriptive combat messages for immersive "living ebook" aesthetic
#
# Each tier defines messages for three perspectives:
# - to_attacker: What the attacking player sees
# - to_defender: What the defending entity sees
# - to_room: What observers in the room see
#
# Variables available:
# - {attacker} - Attacker's name
# - {target} - Target's name
# - {damage} - Numeric damage value (optional display)

# Default melee damage messages
melee:
  tiers:
    - range: [0, 0]
      verb: "miss"
      to_attacker:
        - "You swing at {target} but miss completely."
        - "Your attack fails to connect with {target}."
        - "You lunge at {target} but strike only air."
      to_defender:
        - "{attacker} swings at you but misses."
        - "{attacker}'s attack fails to connect."
        - "{attacker} lunges at you but strikes only air."
      to_room:
        - "{attacker} swings at {target} but misses."
        - "{attacker}'s attack fails to connect with {target}."

    - range: [1, 2]
      verb: "tickle"
      to_attacker:
        - "You barely tickle {target} with your attack."
        - "Your strike glances harmlessly off {target}."
        - "You manage only a feeble tap against {target}."
      to_defender:
        - "{attacker} barely tickles you."
        - "{attacker}'s strike glances harmlessly off you."
        - "{attacker} manages only a feeble tap against you."
      to_room:
        - "{attacker} barely tickles {target}."
        - "{attacker}'s strike glances harmlessly off {target}."

    - range: [3, 5]
      verb: "barely scratch"
      to_attacker:
        - "You barely scratch {target}."
        - "Your attack leaves only a superficial mark on {target}."
        - "You nick {target} lightly."
      to_defender:
        - "{attacker} barely scratches you."
        - "{attacker}'s attack leaves only a superficial mark."
        - "{attacker} nicks you lightly."
      to_room:
        - "{attacker} barely scratches {target}."
        - "{attacker}'s attack leaves a superficial mark on {target}."

    - range: [6, 10]
      verb: "scratch"
      to_attacker:
        - "You scratch {target}."
        - "Your blow scratches {target}."
        - "You land a glancing blow on {target}."
      to_defender:
        - "{attacker} scratches you."
        - "{attacker}'s blow scratches you."
        - "{attacker} lands a glancing blow on you."
      to_room:
        - "{attacker} scratches {target}."
        - "{attacker} lands a glancing blow on {target}."

    - range: [11, 15]
      verb: "graze"
      to_attacker:
        - "You graze {target}."
        - "Your attack grazes {target}'s defenses."
        - "You catch {target} with a grazing blow."
      to_defender:
        - "{attacker} grazes you."
        - "{attacker}'s attack grazes your defenses."
        - "{attacker} catches you with a grazing blow."
      to_room:
        - "{attacker} grazes {target}."
        - "{attacker} catches {target} with a grazing blow."

    - range: [16, 20]
      verb: "hit"
      to_attacker:
        - "You hit {target}."
        - "You strike {target} solidly."
        - "Your attack connects with {target}."
        - "You land a solid blow on {target}."
      to_defender:
        - "{attacker} hits you."
        - "{attacker} strikes you solidly."
        - "{attacker}'s attack connects."
        - "{attacker} lands a solid blow on you."
      to_room:
        - "{attacker} hits {target}."
        - "{attacker} strikes {target} solidly."
        - "{attacker} lands a solid blow on {target}."

    - range: [21, 30]
      verb: "injure"
      to_attacker:
        - "You injure {target}."
        - "Your blow injures {target} noticeably."
        - "You strike {target} with telling force."
      to_defender:
        - "{attacker} injures you."
        - "{attacker}'s blow injures you noticeably."
        - "{attacker} strikes you with telling force."
      to_room:
        - "{attacker} injures {target}."
        - "{attacker} strikes {target} with telling force."

    - range: [31, 45]
      verb: "wound"
      to_attacker:
        - "You wound {target} badly."
        - "Your attack wounds {target} deeply."
        - "You deal a grievous wound to {target}."
      to_defender:
        - "{attacker} wounds you badly."
        - "{attacker}'s attack wounds you deeply."
        - "{attacker} deals you a grievous wound."
      to_room:
        - "{attacker} wounds {target} badly."
        - "{attacker} deals a grievous wound to {target}."

    - range: [46, 60]
      verb: "maul"
      to_attacker:
        - "You maul {target}!"
        - "Your devastating blow mauls {target}!"
        - "You tear into {target} viciously!"
      to_defender:
        - "{attacker} mauls you!"
        - "{attacker}'s devastating blow mauls you!"
        - "{attacker} tears into you viciously!"
      to_room:
        - "{attacker} mauls {target}!"
        - "{attacker} tears into {target} viciously!"

    - range: [61, 80]
      verb: "devastate"
      to_attacker:
        - "You devastate {target}!"
        - "Your crushing blow devastates {target}!"
        - "You deliver a devastating strike to {target}!"
      to_defender:
        - "{attacker} devastates you!"
        - "{attacker}'s crushing blow devastates you!"
        - "{attacker} delivers a devastating strike!"
      to_room:
        - "{attacker} devastates {target}!"
        - "{attacker} delivers a devastating strike to {target}!"

    - range: [81, null]
      verb: "OBLITERATE"
      to_attacker:
        - "You **OBLITERATE** {target}!"
        - "Your earth-shattering blow **OBLITERATES** {target}!"
        - "You utterly **ANNIHILATE** {target}!"
      to_defender:
        - "{attacker} **OBLITERATES** you!"
        - "{attacker}'s earth-shattering blow **OBLITERATES** you!"
        - "{attacker} utterly **ANNIHILATES** you!"
      to_room:
        - "{attacker} **OBLITERATES** {target}!"
        - "{attacker} utterly **ANNIHILATES** {target}!"

# Weapon-specific verb overrides
# When a weapon type is specified, these verbs replace the default
weapon_overrides:
  sword:
    scratch: "nick"
    graze: "slice"
    hit: "slash"
    injure: "cut"
    wound: "cleave"
    maul: "carve"
    devastate: "rend"

  axe:
    scratch: "chip"
    graze: "nick"
    hit: "chop"
    injure: "hack"
    wound: "hew"
    maul: "cleave"
    devastate: "split"

  mace:
    scratch: "bump"
    graze: "thump"
    hit: "bash"
    injure: "batter"
    wound: "crush"
    maul: "smash"
    devastate: "shatter"

  dagger:
    scratch: "prick"
    graze: "nick"
    hit: "stab"
    injure: "pierce"
    wound: "puncture"
    maul: "impale"
    devastate: "eviscerate"

  spear:
    scratch: "poke"
    graze: "jab"
    hit: "thrust"
    injure: "pierce"
    wound: "impale"
    maul: "skewer"
    devastate: "run through"

  staff:
    scratch: "tap"
    graze: "thwack"
    hit: "strike"
    injure: "crack"
    wound: "bludgeon"
    maul: "pummel"
    devastate: "shatter"

  fist:
    scratch: "tap"
    graze: "jab"
    hit: "punch"
    injure: "pummel"
    wound: "batter"
    maul: "pound"
    devastate: "demolish"

  claw:
    scratch: "scratch"
    graze: "scrape"
    hit: "rake"
    injure: "rend"
    wound: "tear"
    maul: "shred"
    devastate: "eviscerate"

  bite:
    scratch: "nip"
    graze: "gnaw"
    hit: "bite"
    injure: "chomp"
    wound: "maul"
    maul: "savage"
    devastate: "ravage"

# Combat avoidance messages
