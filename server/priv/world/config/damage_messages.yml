  fail:
    to_attacker:
      - "You try to flee but {target} blocks your escape!"
      - "Your attempt to flee fails!"
      - "{target} cuts off your escape route!"
    to_room:
      - "{attacker} tries to flee but {target} blocks the escape!"
      - "{attacker}'s escape attempt is thwarted!"

