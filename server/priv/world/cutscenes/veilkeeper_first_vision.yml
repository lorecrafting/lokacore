id: veilkeeper_first_vision
name: "The Veilkeeper's Memory"
trigger:
  type: enter_room
  location: ancient_grove_portal
  condition: "player.has_flag('portal_attuned') && !player.has_flag('veilkeeper_vision')"

sequence:
  - type: narration
    text: "As you step into the grove, the portal flares—and the world around you ripples like a reflection in disturbed water."

  - type: fade_out
    duration: 2

  - type: narration
    text: "You stand in the same grove, but it is not the same. The trees are younger, the portal arch gleaming with fresh-carved runes. And you are not alone."

  - type: pause
    duration: 2

  - type: narration
    text: "Hundreds of figures fill the clearing—beings of light, of shadow, of crystal, of living flame. Each one stands before a shimmering threshold. And at the center, where the Veilkeeper now keeps its lonely watch, a figure of blinding radiance raises its hands to the sky."

  - type: pause
    duration: 2

  - type: dialogue
    speaker: veilkeeper
    text: "We have heard the universe's song. We have woven its notes into pathways. Now we give these pathways to all who would listen."

  - type: pause
    duration: 2

  - type: narration
    text: "The gathered beings step through their portals in unison. A wave of harmony washes through reality—and in its wake, the portal network blazes to life across the cosmos. Thousands of archways, millions of connections, an infinite web of understanding."

  - type: pause
    duration: 3

  - type: narration
    text: "Then the vision shifts. Time accelerates. The beings of light begin to fade. One by one, the portals darken. The web unravels, strand by strand, until only a handful of nodes remain—tiny candles in a vast darkness."

  - type: pause
    duration: 2

  - type: narration
    text: "And in the grove, alone, the Veilkeeper remains. Patient. Waiting. Singing its single note into the silence, hoping—always hoping—that someone, somewhere, will hear it and sing back."

  - type: fade_in
    duration: 3

  - type: narration
    text: "The vision fades. You are back in the present, standing in the grove with the taste of ozone and ancient memory on your tongue. The Veilkeeper is watching you with something that might be gratitude."

  - type: dialogue
    speaker: veilkeeper
    text: "You saw. The portal wanted you to understand what was lost... and what might yet be found."

effects:
  - type: set_flag
    flag: veilkeeper_vision
    value: true
  - type: give_xp
    amount: 200
