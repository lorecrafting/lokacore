id: attachment_temptation
name: "Attachment's Temptation"
trigger:
  type: enter_room
  location: attachment_chamber
  condition: "!player.has_flag('attachment_entered')"
sequence:
  - type: narration
    text: "The chamber glitters with gold. Mountains of treasure."
  - type: pause
    duration: 1
  - type: dialogue
    speaker: raga_voice
    text: "Take it. It's yours. You deserve this."
  - type: narration
    text: "You reach out... and your hand passes through. Illusion."
  - type: narration
    text: "But the wanting feels so real."
  - type: apply_status
    status: attached
    duration: 60
    message: "A creeping desire settles into your mind."
effects:
  - type: set_flag
    flag: attachment_entered
    value: true
