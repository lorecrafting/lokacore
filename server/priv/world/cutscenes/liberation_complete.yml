# Cutscene: Liberation of Lama Tenzin
# Triggers when player defeats Mara and frees Tenzin

id: liberation_complete
name: "The Dawn Returns"
trigger:
  type: enemy_defeated
  target: mara_the_deceiver
  location: heart_cave
sequence:
  - type: narration
    text: "Mara the Deceiver fades like morning mist."
  - type: pause
    duration: 2
  - type: narration
    text: "The Heart Cave fills with golden light."
  - type: narration
    text: "In its center, Lama Tenzin stirs. His eyes open - clear and bright."
  - type: pause
    duration: 1
  - type: dialogue
    speaker: lama_tenzin
    text: "I... I was lost in the darkness. So long in the darkness."
  - type: pause
    duration: 1
  - type: dialogue
    speaker: lama_tenzin
    text: "But you came. You faced the Three Poisons. You showed me the way back."
  - type: narration
    text: "He rises, unsteady but alive."
  - type: dialogue
    speaker: lama_tenzin
    text: "The monastery will want to see their teacher again. But first..."
  - type: pause
    duration: 1
  - type: dialogue
    speaker: lama_tenzin
    text: "Thank you. Whatever path brought you here, you have my eternal gratitude."
  - type: narration
    text: "The caves begin to brighten. The nightmare ends."
  - type: pause
    duration: 2
  - type: narration
    text: "Somewhere above, the monastery bells begin to ring."
effects:
  - type: set_flag
    flag: tenzin_liberated
    value: true
  - type: give_xp
    amount: 500
  - type: complete_quest
    quest: main_liberation
