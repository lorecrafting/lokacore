id: portal_awakening
name: "The Awakening"
trigger:
  type: enter_room
  location: crystal_sanctum_portal
  condition: "player.has_flag('portal_attuned') && !player.has_flag('first_crossing_complete')"

sequence:
  - type: narration
    text: "You step toward the portal arch. The light within responds to your presence, shifting from its restless shimmer to a focused, welcoming glow."

  - type: pause
    duration: 1

  - type: narration
    text: "Your attunement sigil warms against your chest. The runes on the arch pulse in rhythm with your heartbeat—recognizing you, accepting you, drawing you forward."

  - type: pause
    duration: 2

  - type: narration
    text: "You step through."

  - type: fade_out
    duration: 2

  - type: narration
    text: "For a fraction of an instant that lasts forever, you exist everywhere at once. You feel the Crystal Sanctum below—vast, luminous, singing. You feel the dormant portals scattered across creation, stirring in their sleep as your song passes through the network."

  - type: pause
    duration: 2

  - type: narration
    text: "Somewhere, impossibly far away, you sense something stir. Another node. Another portal, sealed for ages, cracking open the merest sliver at the touch of a new traveler's resonance."

  - type: pause
    duration: 2

  - type: narration
    text: "And then the between-space releases you."

  - type: fade_in
    duration: 3

  - type: narration
    text: "Crystal light floods your vision. You stand in the Crystal Sanctum—but it is transformed. Where before you saw only caves and scattered shards, now you see the architecture of the Resonance laid bare. Pathways of living crystal thread through the walls. Harmonics you could not hear before fill the air with alien beauty."

  - type: pause
    duration: 2

  - type: narration
    text: "The sanctum recognizes you. And somewhere behind you, through the portal connection, you can feel the Veilkeeper's presence—warm, watchful, and for the first time in millennia, not alone."

effects:
  - type: set_flag
    flag: first_crossing_complete
    value: true
  - type: give_xp
    amount: 300
