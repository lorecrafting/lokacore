id: crystal_whisper
name: "The Crystal's Whisper"
trigger:
  type: meditate
  location: deep_grotto
  condition: "!player.has_flag('crystal_whisper')"
sequence:
  - type: fade_out
    duration: 2
  - type: narration
    text: "The stone beneath you grows warm. The ancient paintings on the walls begin to glow."
  - type: pause
    duration: 1
  - type: narration
    text: "Voices rise from the crystal formations, layered like wind through prayer flags."
  - type: narration
    text: "Voices rise, layered and ancient: We sat where you sit now. We asked the same questions."
  - type: narration
    text: "The mountain does not answer. It listens."
  - type: pause
    duration: 1
  - type: narration
    text: "And in listening, teaches you to hear yourself."
  - type: pause
    duration: 1
  - type: fade_in
    duration: 2
  - type: narration
    text: "The glow fades. The grotto is silent again, but the silence feels different now. Fuller."
effects:
  - type: set_flag
    flag: crystal_whisper
    value: true
  - type: add_insight
    amount: 1
  - type: give_xp
    amount: 50
