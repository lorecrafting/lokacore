id: portal_attunement_rite
name: "The Rite of Attunement"
trigger:
  type: quest_complete
  quest: portal_attunement
  location: ancient_grove_portal
  condition: "player.has_flag('has_three_crystals') && !player.has_flag('portal_attuned')"

sequence:
  - type: narration
    text: "The three crystal shards lift from your hands, rising into the air between you and the ancient stone archway. They hang suspended, impossibly still, their inner light pulsing in perfect synchrony."

  - type: pause
    duration: 2

  - type: narration
    text: "The Veilkeeper raises both translucent hands. The crystals begin to spin—slowly at first, tracing a widening triangle. Then faster. Their individual glows merge into a single braided beam of light that arcs toward the portal."

  - type: pause
    duration: 2

  - type: narration
    text: "The beam strikes the center of the archway. The runes carved into the stone ignite—not with fire, but with memory. Each sigil blazes with visions: crystal caves, moonlit gardens, towers of impossible architecture, beings of pure light weaving songs between stars."

  - type: pause
    duration: 3

  - type: dialogue
    speaker: veilkeeper
    text: "Close your eyes. The portal is reaching for you. Let it find you."

  - type: fade_out
    duration: 2

  - type: narration
    text: "Darkness. And then—"

  - type: pause
    duration: 2

  - type: narration
    text: "You hear it. A note. Not with your ears—you hear it with your bones, your blood, the spaces between your thoughts. It is the sound of everything that exists, compressed into a single perfect tone."

  - type: pause
    duration: 2

  - type: narration
    text: "The note expands. Harmonics unfold from it like petals from a flower. You hear the Crystal Sanctum humming beneath the earth. You hear the ancient grove breathing above you. You hear distant portals—dormant, dreaming—stirring in recognition."

  - type: pause
    duration: 2

  - type: narration
    text: "And buried within the harmony, you hear your own voice. Your own frequency. Your own song, distinct and irreplaceable, weaving itself into the portal network like a new thread in an ancient tapestry."

  - type: pause
    duration: 3

  - type: narration
    text: "The network learns you. And you learn it."

  - type: fade_in
    duration: 3

  - type: narration
    text: "Light returns. You are standing in the grove, but everything looks different. The portal arch blazes with steady blue-white radiance. The runes glow with welcoming warmth. The air itself seems to vibrate with purpose."

  - type: pause
    duration: 2

  - type: narration
    text: "The Veilkeeper watches you, and for the first time, you can truly see it—not as shifting light and shadow, but as a being. Ancient beyond reckoning. Weary from ages of lonely vigil. And now, unmistakably, at peace."

  - type: dialogue
    speaker: veilkeeper
    text: "It is done. The portal knows your song. And you know its. Welcome, traveler, to the network of the Resonance."

  - type: pause
    duration: 2

  - type: dialogue
    speaker: veilkeeper
    text: "May your journeys be worthy of the silence they will fill."

effects:
  - type: set_flag
    flag: portal_attuned
    value: true
  - type: set_flag
    flag: rite_of_attunement_complete
    value: true
  - type: give_xp
    amount: 500
