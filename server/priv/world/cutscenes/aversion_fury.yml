id: aversion_fury
name: "Aversion's Fury"
trigger:
  type: enter_room
  location: aversion_chamber
  condition: "!player.has_flag('aversion_entered')"
sequence:
  - type: narration
    text: "Heat. Anger. The walls are carved with scenes of war."
  - type: pause
    duration: 1
  - type: narration
    text: "Every injustice you've ever suffered floods back."
  - type: dialogue
    speaker: dvesha_voice
    text: "They wronged you. Strike back!"
  - type: narration
    text: "Your fists clench. But is this truly your anger?"
  - type: apply_status
    status: aversion
    duration: 60
    message: "Rage burns through your veins."
effects:
  - type: set_flag
    flag: aversion_entered
    value: true
