id: final_choice
name: "The Final Choice"
trigger:
  type: enemy_defeated
  enemy: mara_the_deceiver
sequence:
  - type: narration
    text: "Mara falls, its form flickering between dissolution and solidity."
  - type: pause
    duration: 2
  - type: dialogue
    speaker: lama_tenzin
    text: "You have won. But how will you end this?"
  - type: choice
    prompt: "How do you end this?"
    options:
      - id: destroy
        text: "I will destroy it forever!"
        available: true
        sequence:
          - type: narration
            text: "Mara screams and shatters. Power rushes through you."
          - type: dialogue
            speaker: lama_tenzin
            text: "Anger defeating anger. It will return."
          - type: narration
            text: "Tenzin rises, his eyes sad but accepting."
          - type: dialogue
            speaker: lama_tenzin
            text: "You have done what was needed. Thank you."
          - type: trigger_ending
            ending: destruction
      - id: liberate
        text: "I recognize it as empty. I offer it compassion."
        available: "player.insight >= 10"
        sequence:
          - type: dialogue
            speaker: mara
            text: "You... forgive me?"
          - type: dialogue
            speaker: player
            text: "There is nothing to forgive. You were never real."
          - type: narration
            text: "Mara dissolves into light that flows into your heart."
          - type: dialogue
            speaker: lama_tenzin
            text: "Now you understand. Nirvana and samsara are one."
          - type: narration
            text: "Tenzin rises, his eyes bright with joy."
          - type: dialogue
            speaker: lama_tenzin
            text: "You have walked the bodhisattva's path."
          - type: trigger_ending
            ending: liberation
