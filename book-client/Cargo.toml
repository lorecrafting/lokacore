[package]
name = "loka-book"
version = "0.1.0"
edition = "2021"
description = "Diegetic 3D book renderer for Loka MUD"
license = "MIT"

[lib]
name = "loka_book"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "test-app"
path = "src/bin/test_app.rs"

[dependencies]
# Game engine - minimal features for mobile
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_winit",
    "bevy_sprite",
    "png",
    "tonemapping_luts",  # Required for proper rendering
    "x11",           # For desktop testing
    "wayland",       # For desktop testing
] }

# Text rendering
cosmic-text = "0.12"
fontdue = "0.9"  # SDF font generation

# Math
glam = "0.29"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization and FFI
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = { version = "0.28", features = ["build"] }

[target.'cfg(target_os = "ios")'.dependencies]
# iOS-specific dependencies will go here

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
# Testing dependencies

[profile.dev]
opt-level = 1           # Some optimization for playable dev builds

[profile.dev.package."*"]
opt-level = 3           # Optimize dependencies in dev

[profile.release]
opt-level = 3
lto = "thin"
strip = true
