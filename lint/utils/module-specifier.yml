# A string that is a module specifier: import/export ... from '<here>', import('<here>'),
# require('<here>'). The mobile import-boundary rules match only inside one.
id: module-specifier
language: tsx
rule:
  kind: string
  any:
    - inside: { kind: import_statement, field: source }
    - inside: { kind: export_statement, field: source }
    - inside:
        kind: arguments
        inside:
          kind: call_expression
          has: { field: function, regex: '^(import|require)$' }
