id: mobile-book-text
language: tsx
severity: error
message: 'A Book line reads Text from ./Text.tsx (book/reading.ts): React Native Text or TextInput scales again by the system font scale; only Text.tsx and the WordBar input draw them, with allowFontScaling={false}.'
files: [mobile/app/book/**, mobile/app/SaveError.tsx]
# Text.tsx is the wrapper; WordBar.tsx owns the one TextInput; title.ts names Text only as a ref type.
ignores: ['**/*.test.ts', mobile/app/book/Text.tsx, mobile/app/book/WordBar.tsx, mobile/app/book/title.ts]
rule:
  kind: import_specifier
  regex: '^(Text|TextInput)\b'
  inside:
    kind: import_statement
    stopBy: end
    has: { kind: string, regex: "^['\"]react-native['\"]$" }
