id: mobile-shared-no-authority
language: tsx
severity: error
message: Shared packages never import an authority or a feature (spec documents 10 §2, 14 §R2).
files: [mobile/packages/**]
rule:
  kind: string_fragment
  regex: '(^|/)(authority|local-story|remote-realm|features|story|realm)(/|$)'
  inside: { matches: module-specifier }
