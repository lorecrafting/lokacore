id: mobile-book-map-page-no-actions
language: tsx
severity: error
message: 'The Map page holds no actions, Where included (docs/system/book-ui.md, Minimap, Map and presentation controls; Verbs the Book does not draw): draw no ActionCard in MapPage.'
files: [mobile/app/book/sections.tsx]
rule:
  any:
    - kind: jsx_self_closing_element
    - kind: jsx_opening_element
  has: { field: name, regex: '^ActionCard$' }
  inside:
    kind: function_declaration
    has: { field: name, regex: '^MapPage$' }
    stopBy: end
