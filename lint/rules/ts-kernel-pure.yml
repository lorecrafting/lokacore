id: ts-kernel-pure
language: typescript
severity: error
message: Kernel code must stay pure (spec document 01 A6, proposed ADR-072). No Node APIs, clock, randomness or timers.
files: [kernel/ts/src/**]
rule:
  any:
    - pattern: Date.now()
    - pattern: new Date($$$)
    - pattern: Math.random()
    - pattern: performance.now()
    - pattern: require($$$)
    - kind: identifier
      regex: ^(process|setTimeout|setInterval|setImmediate|Buffer|globalThis)$
    - kind: string_fragment
      inside:
        kind: import_statement
        stopBy: end
      regex: ^(node:.*|(fs|path|os|child_process|crypto|http|https|net)(/.*)?)$
