id: mobile-story-no-realm
language: tsx
severity: error
message: Story code never imports Realm code (spec document 14 §R2).
files: [mobile/features/story/**, mobile/authority/local-story/**]
# Only module specifiers: import/export ... from '<here>', import('<here>'), require('<here>').
rule:
  kind: string_fragment
  regex: '(^|/)(realm|remote-realm)(/|$)'
  inside:
    kind: string
    any:
      - inside: { kind: import_statement, field: source }
      - inside: { kind: export_statement, field: source }
      - inside:
          kind: arguments
          inside:
            kind: call_expression
            has: { field: function, regex: '^(import|require)$' }
