id: mobile-renderer-imports
language: tsx
severity: error
message: 'The renderer imports only react, named React Native building blocks from the list, its own files and the GameSession package, so react-native-web can mount it (owner wish 2026-10-02); the shell, App.tsx, injects the phone''s APIs.'
files: [mobile/app/book/**, mobile/app/SaveError.tsx]
ignores: ['**/*.test.ts']
# Allowlists, not blocklists: every other form or name is flagged. ponytail: a new renderer file, or a new
# React Native building block, needs adding here (one name in each regex).
rule:
  any:
    # Every require(...) and import(...) call, whatever its argument (the shell, App.tsx, loads the fonts).
    # ponytail: this guards accidental drift, not adversarial constructions (an aliased require).
    - kind: call_expression
      has: { field: function, regex: '^(import|require)$' }
    - kind: string_fragment
      inside: { matches: module-specifier }
      any:
        - not:
            regex: '^(react|react-native|\./(book/)?(Book|Body|DreamPage|Combat|Footer|MapDrawing|DiscoveredMap|Menu|Turn|SaveError|buttons|item-pages|joystick|logs|model|notices|dreams|positions|offers|pages|paper|presenter|received|sections|skills|updates|words)(\.tsx?)?|(\.\./)+packages/game-view/[\w-]+(\.ts)?)$'
        # react-native: only `import { A, B } from`, every name plain and on the list. A namespace, default,
        # `{ default as X }`, aliased or string-named import, a re-export, require() or import() is flagged.
        - regex: '^react-native$'
          not:
            inside:
              stopBy: end
              kind: import_statement
              all:
                - has: { stopBy: end, kind: named_imports }
                - not:
                    has:
                      stopBy: end
                      any:
                        - kind: namespace_import
                        - { kind: identifier, inside: { kind: import_clause } }
                        - kind: import_specifier
                          not: { regex: '^(AccessibilityInfo|Animated|Button|Easing|PanResponder|Pressable|SafeAreaView|ScrollView|Text|View)$' }
