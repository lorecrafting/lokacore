id: elixir-kernel-pure
language: elixir
severity: error
message: Kernel code must stay pure (spec document 01 A6, ADR-072). Take time, randomness, storage and processes from the host.
files: [lib/loka/core.ex, lib/loka/core/**]
rule:
  any:
    - kind: alias
      regex: ^(Elixir\.)?(IO|System|Process|Port|Node|Task|Agent|GenServer|Supervisor|DynamicSupervisor|Registry|Application|Date|Time|DateTime|NaiveDateTime|Calendar|Ecto|Phoenix|Logger)(\.|$)
    # File only as a compile-time read: `@x File.read!(...)` or `@x File.read(...)`, the call
    # being the attribute's whole value. Captures and bare module values could escape to runtime.
    - kind: alias
      regex: ^(Elixir\.)?File(\.|$)
      not:
        inside:
          kind: dot
          field: left
          regex: ^(Elixir\.)?File\.read!?$
          inside:
            kind: call
            field: target
            has: { kind: arguments }
            inside:
              kind: arguments
              inside:
                kind: call
                inside: { kind: unary_operator, field: operand, regex: ^@ }
    - kind: alias
      regex: (^|\.)Repo$
    - kind: atom
      regex: ^:(rand|random|os|file|timer|ets|dets|erlang|persistent_term|calendar|gen_tcp|gen_udp|ssl|httpc|counters|atomics|global|mnesia|io|code)$
    # :crypto also holds randomness; only :crypto.hash/2 (a pure digest) is allowed.
    - kind: atom
      regex: ^:crypto$
      not:
        inside:
          kind: dot
          field: left
          has: { field: right, regex: ^hash$ }
          inside:
            kind: call
            field: target
            has:
              kind: arguments
              all:
                - has: { nthChild: 2 }
                - not: { has: { nthChild: 3 } }
    - kind: identifier
      regex: ^(self|send|spawn|spawn_link|spawn_monitor|make_ref|node|monitor|receive|apply)$
      inside:
        kind: call
        field: target
    - kind: dot
      regex: ^Enum\.(random|shuffle|take_random)$
