id: mobile-authority-no-display-text
language: tsx
severity: error
message: 'The local authority returns results, never display text; the app''s presenter says them (owner decision 2026-10-02, presenter split).'
files: [mobile/authority/**]
ignores: ['**/*.test.ts']
# A string with two words, or ending in a full stop, is display text unless it is an Error message, a
# module specifier or SQL: a constant that starts with an SQL keyword, or the first argument of a call on
# `db` that starts with one. A bind argument, or the same call on any other receiver, is not exempt.
rule:
  kind: string_fragment
  regex: '[A-Za-z]+ [A-Za-z]+|[A-Za-z]\.$|[A-Za-z] $|^ [A-Za-z]'
  not:
    any:
      - inside: { matches: module-specifier }
      - inside:
          stopBy: end
          kind: new_expression
          has: { field: constructor, regex: 'Error$' }
      - regex: '^\s*(SELECT|INSERT|UPDATE|DELETE|CREATE|PRAGMA|BEGIN|COMMIT|ROLLBACK|DROP|ALTER|REPLACE|WITH)\b'
        not: { inside: { stopBy: end, kind: arguments } } # a SQL constant
      - inside: # a SQL literal: the first argument of a call on db
          any: [{ kind: string }, { kind: template_string }]
          regex: '^.\s*(SELECT|INSERT|UPDATE|DELETE|CREATE|PRAGMA|BEGIN|COMMIT|ROLLBACK|DROP|ALTER|REPLACE|WITH)\b'
          nthChild: 1
          inside:
            kind: arguments
            inside:
              kind: call_expression
              has: { field: function, regex: '^(\w+\.)?db\.(exec|run|getFirst|getAll)Sync$' }
