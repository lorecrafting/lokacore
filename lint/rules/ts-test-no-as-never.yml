id: ts-test-no-as-never
language: tsx
severity: error
message: "A kernel test casts with `as never`. Use the typed helpers in kernel/ts/test/harness.ts (eid, ctx, cmd, commands, reload) or a real type; loka-ivjq.15."
files: [kernel/ts/test/**]
# ponytail: the baseline is per file (files that had casts when the rule landed), so a new cast in a
# listed file passes. Drop a file from the list once its casts are gone; count per file if that leaks.
