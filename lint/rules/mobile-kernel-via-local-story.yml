id: mobile-kernel-via-local-story
language: tsx
severity: error
message: Only mobile/authority/local-story imports the kernel (spec document 10 §2).
files: [mobile/**]
ignores: [mobile/authority/local-story/**]
# Only module specifiers: import/export ... from '<here>', import('<here>'), require('<here>').
rule:
  kind: string_fragment
  regex: '(^|/)kernel(/|$)'
  inside:
    kind: string
    any:
      - inside: { kind: import_statement, field: source }
      - inside: { kind: export_statement, field: source }
      - inside:
          kind: arguments
          inside:
            kind: call_expression
            has: { field: function, regex: '^(import|require)$' }
