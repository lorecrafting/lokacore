id: ts-rule-module-imports
language: tsx
severity: error
message: A rule module imports only kernel helpers in foundation/runtime/commands and mechanics, never I/O, a package or another rule module; its capability's commands and events come through the typed Rule contract (kernel/ts/src/runtime/decision.ts).
files: [kernel/ts/src/mechanics/*/rule.ts]
rule:
  any: [{ kind: string }, { kind: template_string }]
  matches: module-specifier
  not:
    any:
      - regex: "^['\"](\\.\\./\\.\\./(foundation|runtime|commands)/[a-z0-9_]+\\.ts|\\.\\./\\.\\./contracts\\.gen\\.ts|\\.\\./(fact|policy|lookups|resource|reaction|skills)\\.ts|(\\.\\./[a-z0-9_]+/|\\./)(shared|lifecycle|behavior)\\.ts)['\"]$"
      - regex: "^['\"](\\./(sequence|flee|payment|exchange|harvest|recovery)\\.ts|\\.\\./combat/round\\.ts|\\.\\./water/expiry\\.ts|\\.\\./(bleed|status)/job\\.ts)['\"]$"
      - regex: "^['\"]\\.\\./(patrol|scene)/sequence\\.ts['\"]$"
