id: ts-rule-registration
language: tsx
severity: error
message: The rule table binds each capability to an imported rule module's decide (kernel/ts/src/runtime/world.ts RULES; owner decision, docs/archive/decisions/owner-decision-r5-setup-2026-09-25.md). A RULES value is $MODULE.decide, and world.ts takes namespace imports only from ../mechanics/<capability>/rule.ts; an object with a decide key outside a mechanic rule is ts-rule-module-location's.
files: [kernel/ts/src/runtime/world.ts]
rule:
  any:
    - kind: pair
      inside:
        kind: object
        inside: { kind: variable_declarator, has: { field: name, regex: ^RULES$ } }
      not: { has: { field: value, pattern: $M.decide } }
    - kind: shorthand_property_identifier
      inside:
        kind: object
        inside: { kind: variable_declarator, has: { field: name, regex: ^RULES$ } }
    - kind: spread_element
      inside:
        kind: object
        inside: { kind: variable_declarator, has: { field: name, regex: ^RULES$ } }
    - kind: import_statement
      has: { kind: import_clause, has: { kind: namespace_import } }
      not: { has: { field: source, regex: "^['\"]\\.\\./mechanics/[a-z_]+/rule\\.ts['\"]$" } }
