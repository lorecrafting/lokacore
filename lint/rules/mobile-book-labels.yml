id: mobile-book-labels
language: tsx
severity: error
message: 'A Book control or section word comes from LABEL in mobile/app/book/labels.ts, never a literal, so a rename is one edit there (loka-x6t.11).'
files:
  [
    mobile/app/book/*.ts,
    mobile/app/book/*.tsx,
    mobile/app/SaveError.tsx,
    mobile/app/App.tsx,
    mobile/app/tests/*.ts,
    mobile/app/walkthrough/*.ts,
    mobile/app/stories/routes.ts,
  ]
ignores: [mobile/app/book/labels.ts, mobile/app/book/*.test.ts]
rule:
  any:
    # Any literal label on a Control.
    - kind: jsx_attribute
      has: { kind: property_identifier, regex: '^label$' }
      any:
        - has: { kind: string }
        - has: { kind: jsx_expression, has: { kind: string } }
      inside:
        any: [{ kind: jsx_self_closing_element }, { kind: jsx_opening_element }]
        has: { field: name, regex: '^Control$' }
    # Literal text in a SectionTitle.
    - kind: jsx_text
      regex: '\S'
      inside:
        kind: jsx_element
        has: { field: open_tag, has: { field: name, regex: '^SectionTitle$' } }
    # One of the table's words as a string (a tap, a getByRole name, a story route step).
    # Keep this list equal to LABEL's values.
    - kind: string
      regex: "^['\"](Leave|Leave the conversation|Back to World|Back to board|Back to map|Close|Resume dream|Got it|Start over|Backspace|Clear|Submit|Start over\\?|Your saved game will be lost\\.|Cancel|Inside|Look inside|There is nothing inside\\.|Held|Worn|Where|Ask where|Ask about|While you were away|Lore|Chronicle|Day|Not here|Say|Shout|Cast|Say to the room|A word|One word, letters only\\.|Spells|Inventory|Reading size|Standard|Large|Larger|Use an item…|Use on…|Give an item…|Give to…|Cast a spell…|Cast on…|Buy or sell|Sell…|Your order)['\"]$"
