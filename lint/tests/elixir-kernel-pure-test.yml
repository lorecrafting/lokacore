id: elixir-kernel-pure
valid:
  - "def step(state, cmd), do: Map.put(state, :last, cmd)"
  - "def next(rng), do: Loka.Core.Rng.next(rng)"
  - "def f(x), do: Filesystem.ok(x)"
  - "def g(xs), do: Enum.map(xs, &(&1 + 1))"
  - "def h(state), do: state.self"
  - "def sha(x), do: :crypto.hash(:sha256, x)"
  - "@schema File.read!(\"protocol/a.json\")"
  - "@schemas Map.new(paths, &{&1, File.read!(&1)})"
invalid:
  - "def load, do: File.read!(\"world.json\")"
  - "alias File, as: F"
  - "def load(p), do: @x || File.read!(p)"
  - "def f, do: [@x, File.exists?(\"y\")]"
  - "def now, do: DateTime.utc_now()"
  - "def roll, do: :rand.uniform(6)"
  - "def save(x), do: Loka.Repo.insert(x)"
  - "def me, do: Process.get(:x)"
  - "def env, do: System.get_env(\"X\")"
  - "def t, do: :erlang.monotonic_time()"
  - "def r, do: :crypto.strong_rand_bytes(4)"
  - "def r1, do: :crypto.hash(:sha256)"
  - "def r2, do: :crypto.hash(:sha256, :crypto.strong_rand_bytes(4))"
  - "def r4(x), do: :crypto.hash(:sha256, x, 1)"
  - "def e, do: Enum.random([1, 2])"
  - "def s, do: send(self(), :x)"
  - "def p, do: spawn(fn -> :ok end)"
  - "def d, do: Date.utc_today()"
  - "def pt, do: :persistent_term.get(:x)"
  - "def a, do: Application.get_env(:loka, :x)"
  - "def ap, do: apply(File, :read!, [\"x\"])"
  - "def el, do: Elixir.File.read!(\"x\")"
  - "def rf, do: make_ref()"
  - "def rg, do: Registry.lookup(R, :k)"
