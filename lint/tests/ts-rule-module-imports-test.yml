id: ts-rule-module-imports
valid:
  - "import { accepted, type Rule } from '../../runtime/decision.ts';"
  - "import type { Key } from '../../contracts.gen.ts';"
  - "import { add } from '../../foundation/int.ts';"
  - "import { refusal } from '../../commands/actions.ts';"
  - "import { activation } from './lifecycle.ts';"
  - "import { earned } from '../quest/lifecycle.ts';"
  - "import { pay } from '../resource.ts';"
  - "import { entered } from './behavior.ts';"
  # Break: named pure helpers are rejected along with rule-module imports.
  - "import { moveSequence } from './sequence.ts';"
  - "import { roundSequence } from '../combat/round.ts';"
  - "import { flee } from './flee.ts';"
  - "import { exchangeTransfers } from './exchange.ts';"
  - "import { decideHarvest } from './harvest.ts';"
