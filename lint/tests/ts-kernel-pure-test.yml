id: ts-kernel-pure
valid:
  - "export const step = (s: S, c: C): S => ({ ...s, last: c });"
  - "import { next } from './rng.ts';"
  - "const d = s.date;"
  - "const m = Math.floor(x / 2);"
invalid:
