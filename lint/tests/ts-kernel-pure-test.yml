  - "const d = new Date();"
  - "const a = Date();"
  - "const r = Math.random();"
  - "const c = Math['random']();"
  - "import { readFileSync } from 'node:fs';"
  - "import fs from 'fs';"
  - "const env = process.env.X;"
  - "setTimeout(f, 1);"
  - "const x = require('os');"
  - "export const e = () => import('node:fs');"
  - "export const f = global.setTimeout;"
  - "export const h = Intl.DateTimeFormat().resolvedOptions().timeZone;"
