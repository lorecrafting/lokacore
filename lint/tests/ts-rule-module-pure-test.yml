id: ts-rule-module-pure
valid:
  - "export const decide: Rule<'movement'> = (w, c) => accepted(w, 'moved', [], []);"
  - "const t = { op: 'entity.transfer', writer_group: 0 } as const;"
  - "const next = { ...w.state, clock: 1 }; const ok = xs.map((x) => x + 1).filter(Boolean);"
  - "let n = 0; n = 1;"
  - "import { has, values } from '../decision.ts'; const ok = has(w.rooms, id) && values(w.rooms).length > 0;"
  - "type T = { json: string }; const o = x.Object;"
invalid:
  - "w.state.clock = 1;"
  - "w.rooms[id] = r;"
  - "n += 1;"
  - "n++;"
  - "delete w.rooms[id];"
  - "out.push(x);"
  - "xs.sort();"
  - "Object.assign(w, { clock: 1 });"
  - "m.set(k, v);"
  - "const d = direction as Key;"
  - "const d = direction as unknown as Key;"
  - "const x: any = 1;"
  - "const { assign } = Object; assign(w.state, { clock: 123 });"
  - "const o = Object;"
  - "Function(\"process.stdout.write('x')\")();"
  - "const p = JSON.parse(s);"
  - "Reflect.set(w, 'clock', 1);"
  - "eval('1');"
  - "const g = globalThis;"
  - "new Proxy(w, {});"
