  - "export * from '../../../kernel/ts/src/index.ts';"
  - "const k = () => require('../../../kernel/ts/src');"
  - "const t = require(`../../kernel/ts/src`);"
  - "jest.mock('../../kernel/ts/src');"
  - "jest.mock('../../kernel/ts/src', () => ({}));"
  - "const a = jest.requireActual('../../kernel/ts/src');"
  - "const p = require.resolve('../../kernel/ts/src');"
