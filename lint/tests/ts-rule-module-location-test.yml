id: ts-rule-module-location
valid:
  - "export function step(w: W, c: C) { return rule(w, c); }"
  - "const RULES: { readonly [C in keyof Owned]?: Rule<C> } = { movement: movement.decide };"
  - "export type Rule<C> = (w: W, c: C) => D;"
  - "const decide = 1;"
invalid:
  - "export const decide: Rule<'movement'> = (w, c) => rejected('not_found');"
  - "export const decide = (w, c) => rejected('not_found');"
  - "export function decide(w: W, c: C) { return rejected('not_found'); }"
  - "const helper: Rule<'containment'> = (w) => accepted(w, 'x', [], []);"
  - "const fake = { decide: (w) => rejected('not_found') };"
