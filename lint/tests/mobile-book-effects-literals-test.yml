id: mobile-book-effects-literals
valid:
  - 'const a = { duration: motion.fade.duration };'
  - 'setTimeout(done, motion.quick.duration);'
  - 'play(name);'
  - 'Easing[name];'
  - 'withDelay(motion.fade.delay, x);'
  - 'const a = { transitionDuration: motion.fade.duration };'
  - 'setTimeout(done, motion.fade.duration);'
  - 'setTimeout(fall, -streak.every * Math.log(1 - Math.random()));'
invalid:
  - 'const a = { duration: 300 };'
  - 'const a = { delay: 50 };'
  - 'setTimeout(done, 300);'
  - 'setInterval(tick, 300);'
  - 'const e = Easing.linear;'
  - 'const e = "cubic-bezier(0, 0, 1, 1)";'
  - 'navigator.vibrate(10);'
  - 'Vibration.vibrate(10);'
  - 'new Audio(url);'
  - 'new AudioContext();'
  - 'el.play();'
  - 'globalThis.navigator?.vibrate?.(10);'
  - 'window.navigator.vibrate(10);'
  - 'el?.play();'
  - 'window.setTimeout(f, 300);'
  - 'window.setInterval(f, 300);'
  - 'const a = { duration: 100 + 200 };'
  - 'const a = { duration: fast ? 100 : 200 };'
  - 'setTimeout(f, motion.fade.duration * 2);'
  - 'withDelay(300, x);'
  - 'const a = { transitionDuration: 300 };'
  - 'new window.Audio(url);'
