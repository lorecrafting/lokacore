# NPC Conversation Flow
# Tests: Navigation to NPC location + Entity context modal (when accessible)
#
# Prerequisites:
# - Player logged in
# - Server running with world spawned
#
# === Test Coverage Alignment ===
#
# This test (Maestro) covers UI/Client layer:
# - Navigation to rooms with NPCs
# - Entity text area visibility
# - (BLOCKED) Entity tap - requires accessibility fix for HighlightedTextInline
#
# ChannelBot covers complementary server logic:
# - Dialogue tree navigation and state
# - Quest triggers from dialogue choices
# - NPC response selection logic
# - Dialogue conditions and flags
#
# === Entity Tapping via Pressable Wrapper ===
# Entities are wrapped in Pressable components with testIDs like "entity-npc-0".
# This allows Maestro to tap and trigger the entity context modal.
# The flex-wrap layout preserves the prose paragraph aesthetic while enabling
# reliable accessibility tapping.

appId: com.loka.game
tags:
  - dialogue
  - interaction
---

# Clear state for consistent testing
- clearState

# Launch app with clean state
- launchApp:
    clearState: true
    clearKeychain: true

# Wait for app to load
- waitForAnimationToEnd:
    timeout: 5000

# Handle login if needed
- runFlow:
    when:
      visible:
        id: "name-input"
    commands:
      - tapOn:
          id: "name-input"
      - inputRandomText:
          length: 8
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          label: "Enter the World"
      - waitForAnimationToEnd:
          timeout: 10000

# Wait for game to load
- extendedWaitUntil:
    visible:
      id: "room-view"
    timeout: 15000
    label: "Wait for game to load"

# Wait for room to render
- waitForAnimationToEnd:
    timeout: 3000

# Navigate south then north to reach monastery_gate with NPCs
- tapOn:
    text: "south"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    text: "north"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# Verify we have entity text area (NPCs/items exist)
- extendedWaitUntil:
    visible:
      id: "entity-text"
    timeout: 5000
    label: "Verify entities are present"

- takeScreenshot: "npc_room_reached"

# Tap on the first NPC using testID
- tapOn:
    id: "entity-npc-0"
- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: "npc_tapped"

# Verify context modal appeared (check for entity name or Talk button)
- extendedWaitUntil:
    visible:
      id: "entity-name"
    timeout: 5000
    label: "Verify entity context modal opened"

- takeScreenshot: "npc_context_modal"

# Start dialogue
- tapOn:
    text: "Talk"
- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: "dialogue_opened"

# Test verifies full NPC interaction flow:
# 1. Navigation works (south/north commands)
# 2. Room view renders correctly with entities
# 3. Entity tapping works via Pressable testID
# 4. Entity context modal opens with NPC info
# 5. Talk action triggers dialogue
