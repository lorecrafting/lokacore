# Dialogue Depth Test
# Tests multi-turn conversations, dialogue choices, and dialogue state
#
# This test covers UI gaps that ChannelBot cannot test:
# - Dialogue modal rendering and visibility
# - Dialogue choice buttons are tappable
# - Dialogue history displays correctly
# - Dialogue ends and modal can be closed
#
# Prerequisites:
# - Player logged in
# - Server running with NPCs that have dialogue trees

appId: com.loka.game
tags:
  - dialogue
  - ui-depth
---

# Clear state for consistent testing
- clearState

# Launch app with clean state
- launchApp:
    clearState: true
    clearKeychain: true

# Wait for app to load
- waitForAnimationToEnd:
    timeout: 5000

# Handle login if needed
- runFlow:
    when:
      visible:
        id: "name-input"
    commands:
      - tapOn:
          id: "name-input"
      - inputRandomText:
          length: 8
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          label: "Enter the World"
      - waitForAnimationToEnd:
          timeout: 10000

# Wait for game to load
- extendedWaitUntil:
    visible:
      id: "room-view"
    timeout: 15000
    label: "Wait for game to load"

# Wait for WebSocket connection
- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "dialogue_depth_01_game_loaded"

# Navigate to find an NPC with dialogue
# monastery_gate typically has Novice Pema
- runFlow:
    when:
      visible:
        text: "south"
    commands:
      - tapOn:
          text: "south"
      - waitForAnimationToEnd:
          timeout: 2000

- runFlow:
    when:
      visible:
        text: "north"
    commands:
      - tapOn:
          text: "north"
      - waitForAnimationToEnd:
          timeout: 2000

# Verify entities are present
- extendedWaitUntil:
    visible:
      id: "entity-text"
    timeout: 5000
    label: "Verify entities present in room"

# Tap on first NPC
- tapOn:
    id: "entity-npc-0"
- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: "dialogue_depth_02_entity_modal"

# Verify entity context modal opened (check entity-name which is inside the modal)
- extendedWaitUntil:
    visible:
      id: "entity-name"
    timeout: 5000
    label: "Entity context modal opened"

# Verify action menu is visible
- extendedWaitUntil:
    visible:
      id: "action-menu"
    timeout: 3000
    label: "Action menu visible"

# Start dialogue by tapping Talk
- tapOn:
    text: "Talk"
- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "dialogue_depth_03_dialogue_started"

# Verify dialogue content appeared
- extendedWaitUntil:
    visible:
      id: "dialogue-content"
    timeout: 5000
    label: "Dialogue content visible"

# Verify dialogue history is present
- assertVisible:
    id: "dialogue-history"
    label: "Dialogue history visible"

# Verify there's at least one dialogue choice
- extendedWaitUntil:
    visible:
      id: "dialogue-choices"
    timeout: 5000
    label: "Dialogue choices visible"

# Tap dialogue choices repeatedly until dialogue ends
# NPC dialogues can be long, so we need to exhaust all choices

- tapOn:
    id: "dialogue-choice-0"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: "dialogue_depth_04_choice_made"

# Keep clicking choices until we exhaust the dialogue tree (up to 10 iterations)
- repeat:
    times: 10
    commands:
      - runFlow:
          when:
            visible:
              id: "dialogue-choice-0"
          commands:
            - tapOn:
                id: "dialogue-choice-0"
            - waitForAnimationToEnd:
                timeout: 1500

- takeScreenshot: "dialogue_depth_05_dialogue_exhausted"

# Now try to close the modal using multiple methods
# Method 1: dialogue-leave button (when dialogue ended but modal still open)
- tapOn:
    id: "dialogue-leave"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# Method 2: close-modal button (in action menu mode)
- tapOn:
    id: "close-modal"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# Method 3: text "Leave" anywhere on screen
- tapOn:
    text: "Leave"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# Method 4: If still stuck in dialogue, try one more dialogue choice
- tapOn:
    id: "dialogue-choice-0"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500

# Try closing again after possible additional choice
- tapOn:
    text: "Leave"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: "dialogue_depth_06_closing_modal"

# Verify we're back to room view (extended timeout for transition)
- extendedWaitUntil:
    visible:
      id: "room-view"
    timeout: 10000
    label: "Back to room view after dialogue"

- takeScreenshot: "dialogue_depth_final_success"
