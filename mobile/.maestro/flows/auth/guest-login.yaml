# Guest Login Flow
# Tests: Welcome screen -> Enter name -> Navigate to game
#
# Prerequisites:
# - Server running at localhost:4000
# - App freshly installed (no existing auth token)

appId: com.loka.game
tags:
  - auth
  - smoke
---

# Clear app state for clean test
- clearState

# Launch the app
- launchApp:
    clearState: true

# Welcome screen should show
- assertVisible:
    text: "Loka"
    label: "App title visible"

- assertVisible:
    text: "A Living Story"
    label: "Subtitle visible"

- assertVisible:
    text: "What shall we call you?"
    label: "Name prompt visible"

# Enter player name
- tapOn:
    id: "name-input"
    label: "Tap name input"

- inputText: "TestPlayer_${TEST_RUN_ID}"
- hideKeyboard

# Tap the enter button
- tapOn:
    id: "enter-button"
    label: "Tap Enter the World"

# Wait for game to load (connecting -> loading game state)
- extendedWaitUntil:
    visible:
      id: "room-title"
    timeout: 15000
    label: "Wait for game to load"

# Verify we're in the game
- assertVisible:
    id: "room-view"
    label: "Room view visible"

- assertVisible:
    id: "bottom-bar"
    label: "Bottom navigation visible"

# Take screenshot of successful login
- takeScreenshot: "guest_login_success"
