# Smoke Test - Critical Path
# Runs through the most important user flows to verify app functionality
#
# This is the main test to run in CI to catch regressions
#
# === Test Coverage Alignment ===
#
# Maestro (this test) covers UI/Client layer:
# - Auth flow: Login screen, name input, world entry
# - WebSocket: Connection establishment
# - Rendering: Room view, entity text, bottom bar
# - Navigation: Exit tapping, room transitions
#
# ChannelBot (server/test/integration/storyline_channel_test.exs) covers:
# - Quest logic: Objective tracking, completion
# - Dialogue: NPC conversation trees, choices
# - Combat: Enemy encounters, damage
# - Pathfinding: Room navigation, BFS
# - Storyline: Full monastery_arc playthrough
#
# These tests are COMPLEMENTARY:
# - Maestro catches UI/UX regressions (testIDs, accessibility, rendering)
# - ChannelBot catches game logic regressions (quests, dialogue, combat)
#
# Both test the same Phoenix Channel protocol but at different layers.

appId: com.loka.game
tags:
  - smoke
  - ci
---

# Clear all state for clean test
- clearState

# === PHASE 1: Launch and Auth ===
- launchApp:
    clearState: true
    clearKeychain: true

# Wait for app to fully load
- waitForAnimationToEnd:
    timeout: 5000

# CASE 1: If we see the login screen, complete login flow
- runFlow:
    when:
      visible:
        id: "name-input"
    commands:
      - tapOn:
          id: "name-input"
      - inputRandomText:
          length: 8
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          label: "Enter the World"
      - waitForAnimationToEnd:
          timeout: 10000

# CASE 2: If we see error screen, tap return to login
- runFlow:
    when:
      visible:
        text: "Return to login"
    commands:
      - tapOn:
          text: "Return to login"
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible:
              id: "name-input"
          commands:
            - tapOn:
                id: "name-input"
            - inputRandomText:
                length: 8
            - hideKeyboard
            - waitForAnimationToEnd:
                timeout: 2000
            - tapOn:
                label: "Enter the World"
            - waitForAnimationToEnd:
                timeout: 10000

# Wait for game world to load
- extendedWaitUntil:
    visible:
      id: "room-view"
    timeout: 30000
    label: "Game world loaded"

# Wait for WebSocket connection to establish
- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "smoke_1_game_loaded"

# === PHASE 2: Room View Verification ===
- extendedWaitUntil:
    visible:
      id: "bottom-bar"
    timeout: 10000
    label: "Navigation bar visible"

# Verify entity text area is visible
- extendedWaitUntil:
    visible:
      id: "entity-text"
    timeout: 5000
    label: "Room content visible"

# === PHASE 3: Navigation Test ===
- runFlow:
    when:
      visible:
        text: "north"
    commands:
      - tapOn:
          text: "north"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: "smoke_2_navigated"

# Go back south if we went north
- runFlow:
    when:
      visible:
        text: "south"
    commands:
      - tapOn:
          text: "south"
      - waitForAnimationToEnd:
          timeout: 3000

# === FINAL: Verify App State ===
- extendedWaitUntil:
    visible:
      id: "room-view"
    timeout: 5000
    label: "App in stable state"

- takeScreenshot: "smoke_final_success"
