# Crafting System Test
# Tests crafting panel UI, recipe display, and ingredient checking
#
# This test covers UI gaps that ChannelBot cannot test:
# - Crafting panel opens and displays
# - Recipe list renders
# - Ingredient requirements display
# - Ready/Missing status indicators
#
# Prerequisites:
# - Player logged in
# - Server running

appId: com.loka.game
tags:
  - crafting
  - ui-depth
---

# Clear state for consistent testing
- clearState

# Launch app with clean state
- launchApp:
    clearState: true
    clearKeychain: true

# Wait for app to load
- waitForAnimationToEnd:
    timeout: 5000

# Handle login if needed
- runFlow:
    when:
      visible:
        id: "name-input"
    commands:
      - tapOn:
          id: "name-input"
      - inputRandomText:
          length: 8
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          label: "Enter the World"
      - waitForAnimationToEnd:
          timeout: 10000

# Wait for game to load
- extendedWaitUntil:
    visible:
      id: "room-view"
    timeout: 15000
    label: "Wait for game to load"

# Wait for WebSocket connection
- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "crafting_01_game_loaded"

# Open menu panel
- tapOn:
    id: "menu-button"
- waitForAnimationToEnd:
    timeout: 2000

# Verify menu panel is visible (check for menu-tabs which is inside the panel)
- extendedWaitUntil:
    visible:
      id: "menu-tabs"
    timeout: 5000
    label: "Menu panel visible"

# Navigate to Craft tab
- tapOn:
    id: "menu-tab-craft"
- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: "crafting_02_craft_tab"

# Verify craft content is visible
# New players typically don't know any recipes, so check for that message
- extendedWaitUntil:
    visible:
      text: ".*recipe.*"
    timeout: 5000
    label: "Craft panel visible"

# Check if there are recipes or "no recipes" message
- runFlow:
    when:
      visible:
        text: "don't know any crafting recipes"
    commands:
      - takeScreenshot: "crafting_03_no_recipes"

- runFlow:
    when:
      notVisible:
        text: "don't know any crafting recipes"
    commands:
      - takeScreenshot: "crafting_03_has_recipes"

- takeScreenshot: "crafting_04_final_state"

# Test completed successfully - we verified:
# 1. Menu opens (menu-tabs visible)
# 2. Craft tab can be selected
# 3. Craft panel shows recipe content (or no-recipes message)

# Note: Menu close verification is skipped as React Native Modal behavior
# on iOS can be inconsistent with Maestro's element detection after closing

- takeScreenshot: "crafting_final_success"
