# Room Navigation Flow
# Tests: Moving between rooms using directional controls
#
# Prerequisites:
# - Player already logged in and in starting room
# - Starting room has at least one exit

appId: com.loka.game
tags:
  - navigation
  - core
---

# Launch app (should auto-login if token exists)
- launchApp

# Wait for game to load
- extendedWaitUntil:
    visible:
      id: "room-view"
    timeout: 15000
    label: "Wait for game to load"

# Capture initial room title for comparison
- copyTextFrom:
    id: "room-title"
    label: "Copy initial room title"

# Store initial room title
- evalScript: |
    const initialRoom = maestro.copiedText;
    output.initialRoom = initialRoom;

# Try to navigate north (most common direction)
- runFlow:
    when:
      visible:
        id: "nav-north"
    file: ./helpers/try-navigate-north.yaml
    label: "Try north if available"

# Try east if north wasn't available
- runFlow:
    when:
      visible:
        id: "nav-east"
    file: ./helpers/try-navigate-east.yaml
    label: "Try east if available"

# Verify we moved (room title should change or event appeared)
- assertVisible:
    id: "room-view"
    label: "Still in room view after navigation"

- takeScreenshot: "after_navigation"
